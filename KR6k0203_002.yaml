body:
  text: 龍住寺成簡西宗集注讚文四八端嚴微妙相僧祇三大劫修來面如滿月目如蓮天上人間咸恭敬慈悲水懺法卷中一切諸佛愍念衆生為說水懺道場總法今當歸命一切諸佛南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩地藏菩薩白佛言我從久遠劫來蒙佛接引使獲不可思議神力具大智慧我所分身遍滿百千萬億恆河沙世界每一世界化百千萬億身每一身度百千萬億人令歸敬三寶永離生死至涅槃樂南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔此下承上文而起觀行以作滅罪之方然而禮懺雖在一日一時入道功程必當隨力漸次而能成就某等即今身心寂靜無諂無障正是生善滅惡之時復應各起四種觀行以為滅罪方便即今等者指初卷後折憍竭愛等以至禮佛已畢之時斯時至誠虔懇即今道場之內身口意三業了無過失故得身心寂靜無諂誑無私曲趂此心靜之時復加觀行而進之觀行如下觀察思惟等文中自明何等為四一者觀於因緣二者觀於果報三者觀我自身四者觀如來身上總標下別釋第一觀因緣者知我此罪藉以無明不善思惟無正觀力不識其過遠離善友諸佛菩薩隨逐魔道行邪險徑如魚吞鈎不知其患如蠶作繭自纏自縛如蛾赴火自燒自爛以是因緣不能自出觀因緣者之一字疊上標下而釋之也藉托也因緣者要自知起罪之因習罪之緣皆由無明遂至不能自出無正觀力即所謂無正知見力也天台止觀云正觀者觀諸法無相並是因緣所生因緣無性即是實相先了所觀之境一切皆空能正之心自然不起無正觀之力所以不識其過自然有許多纏縛貪著要知十惡五逆乃至無窮之罪業皆由不識其過而生不識即不知不知即不明不明即無明無明即不善也以是因緣失於正智故云無正觀力梵語魔羅此云奪命乃至奪智慧命故又名殺者又梵語波卑夜亦名波旬此云惡釋迦出世魔王之名亦翻殺者又惡中之惡常欲斷人慧命故即今毀宗誘法邪見等流亦同此類也依隨此等即當墮三惡道故云險徑云云魚但知有香餌不知有喪身之患重看不知二字蠶求堅固蛾貪色見而自害無非自取重看自字三者皆貪著因縛作是觀者當永斷無明以求正知見若以法合魚合我人及一切衆生鈎合無明不善并五欲等之鈎餌也蠶及飛蛾皆合我等之言繭合愛纏之患火合貪欲之殃若能如是觀察即名正智即名善思惟修懺行人喫緊於斯慎毋忽之而不自知也第二觀於果報者所有諸惡不善之業三世輪轉苦果無窮沉溺無邊巨夜大海為諸煩惱羅剎所食未來生死冥然無涯設使報得轉輪聖王王四天下飛行自在七寶具足命終之後不免惡趣四空果報三界極尊福盡還作牛領中蟲況復其餘無福德者而復懈怠不勤懺悔此亦譬如抱石沉淵求出應難二果報觀行果報者既有惡業必招惡果不修出世縱有福如聖王如四空天福盡還應墮落所以必勤懺悔作是觀者定修出世不求福報三世無窮者經云假使百千劫所作業不忘因緣會遇時果報還自受故云耳沉溺大海謂受苦無量如在黑暗大海亦喻言也以羅剎為喻非真羅剎也諸煩惱似之為煩惱之羅剎耳非真為羅剎所食也為煩惱汩沒之盡耳王四天下王者治也晉本華嚴云金輪寶名勝自在象寶名青山紺馬寶名勇疾風神珠寶名光藏雲主藏臣寶名大財玉女寶名淨妙德主兵臣寶名離垢眼謂之七種王寶得此七寶作轉輪王飛行自在王四天下者也如此福德尚墮苦報未知何日出離況無福而不求懺悔乎四空者即無色界四空天也一空無邊天二識無邊處天三無所有處天四非非想處天證四空果報為三界之極尊三界即欲界色界無色界諸天共二十八天也第三觀我自身雖有正因靈覺之性而為煩惱黑暗叢林之所覆蔽無了因力不能得顯我今應當發起勝心破裂無明顛倒重障斷滅生死虗僞苦因顯發如來大明覺慧建立無上涅槃妙果三自身觀行自身雖凡夫實可以超凡而入聖惟在發起勝心耳作是觀者當知我身即如來身自身亦有三身慧身妙法身應一切身也黑暗叢林就是煩惱發揮充滿處覆蔽本性猶如黑暗叢林非煩惱之外更有黑暗叢林也大乘法界論云衆生法身既與功德相應何故無有如來德用應知此如蓮華未開諸惡見葉共包裹故亦如金山被瞋恚泥所封著故亦如虗空被愚癡雲之所蔽故有三種因玄妙云有心者皆得作佛即法身種謂之正因一切世智三乘解心即般若種謂之了因一切低頭舉手即解脫種謂之緣因亦可以說師教外熏等緣謂之緣因有緣因故始得了因可知勝心即今虔懇至誠乃至止觀之心可為勝心也因無明遂有許多顛倒重障故須破裂覺慧是無上之因也因即果果即因因果雙忘不可思議故云無上妙果涅槃有三一性淨為外道妄計涅槃一方便淨為二乘取證涅槃皆非無上一圓淨如來究竟涅槃是謂無上涅槃是出世第一義故為妙果又涅槃有四一本來自性清淨涅槃一切衆生平等共有即真如理也二有餘涅槃二乘煩惱雖斷餘習未除故云有餘三無餘涅槃謂煩惱既盡餘習亦減故云無餘四無住涅槃謂不住生死不住涅槃窮未來際利樂有情故云無住此指無依無住即是出世第一義諦故云無上第四觀如來身四如來觀行以此觀如來身直須常如佛學常如佛心能作是觀者當知吾身亦同如來豈獨如來為如來身哉無為寂照無有少法故曰無為永嘉所謂不見一法即如來是也寂照者譬如明鏡照物恆自無心心體本來常寂寂而常用用而常寂隨境鑒辨皆是實性自爾非是有心方始用也只為衆生不了自心常寂妄計有心心便成境所以有四句百非妄生許多見解無為寂照自然離絶百非不動心相故也所以者何以即心無心故心恆是理即理無理故理恆是心理恆是心故不動心相心恆是理故不得心相不得心相故即是衆生不生不動心相故即是佛亦不生以生佛俱不生故即凡聖常自平等法界性也純一道清淨更無異法離四句絶百非離四句絶百非者大明覺慧之中念念清淨一切邪妄知見不生此即如來清淨法身也本無四句百非之想又安有所謂離之絶之耶特世人視之見為如來離之絶之耳四句者但舉一對或舉一字便成四句即如有無對作四句者如云有無亦有亦無非有非無便成四句也一異二字或斷常二字俱可成四句楞嚴經云淨極光通達寂照含虗空却來觀世間猶如夢中事百非者法教數云凡作四句有本末三世已起未起積成四句皆非得真故云百非也即就上有無對作四句者言之若云有是增益謗若云無是損減謗若云亦有亦無是相違謗若云非有非無是戲論謗此是本四句也復此四句每句有四句有中四句者有有有無有亦有亦無有非有非無又無中四句者無有無無無亦有亦無無非有非無又亦有亦無中四句者亦有亦無有亦有亦無無亦有亦無亦有亦無亦有亦無非有非無又非有非無中四句者非有非無有非有非無無非有非無亦有亦無非有非無非有非無如上四句每一句成四句則成四四十六句此是末四句也三世皆有此十六句則成四十八句此四十八句皆有已起未起成九十六句搭上本四句則成百句也餘法四句皆倣此衆德具足湛然常住衆德即萬行感報百福莊嚴具足圓滿故曰具足湛然常住者即如來萬億圓滿之報身也湛然即湛寂常住者即常住不動之謂也又湛然常住者如宗門統要云佛光如滿禪師因唐順宗問佛從何方來滅向何方去既言常在世佛今在何處師云佛從無為來滅向無為去法身等虗空常在無心處有念歸無念有住歸無住來為衆生來去為衆生去清淨真如海湛然體常住帝又問曰佛向王宮生滅向雙林滅住世四十九又言無法說山河及大海天地及日月時至皆歸盡誰知不生滅疑情猶若斯智者善分別師曰佛體本無為迷情妄分別法身等虗空未曾有生滅有緣佛出世無緣佛入滅處處化衆生猶如水中月非常亦非斷非生亦非滅生亦未曾生滅亦未曾滅了見無心處自然無法說雖復方便入於滅度慈悲救接未曾暫捨方便入滅而不捨救接所謂他方此土分身無數皆如來化身也別有示現而人不識耳非真入滅故曰未曾暫捨生如是心可謂滅罪之良津除障之要行是故至誠求哀懺悔生如心三句總收繳上與四種觀行以為滅罪作前方便等語相應以此四心總申懺悔則無罪不滅無福不生也上明四種觀行懺悔已竟下復重舉煩惱障道因緣重求懺悔蓋因煩惱深厚慧眼即盲障道因緣從茲而起煩惱一起種種善法悉為障蔽不生故云起障等云云文在後面某等無始以來至於今日長養煩惱日深日厚日滋日茂覆蓋慧眼令無所見斷除衆善不得相續業力覆蔽縱善法在前而心境俱違自然斷除衆善一切善法俱障如下文所云皆是耳起障不得見佛不聞正法不值聖僧煩惱起障不見過去未來一切善惡業行出離煩惱障受人天尊貴之煩惱人天尊貴以異三塗微賤之比人天之天欲界諸天也障生色無色界禪定福樂之煩惱色為色界天無色為無色界天色界禪見下四禪定內無色界禪具見後八解脫九空定中禪定福樂禪法要解云得初禪相云何答曰離生喜樂先以正念呵止五欲深入一心有覺有觀離不善法得未到地身心快樂證初禪相轉復增勝身心輕安嗔處不嗔喜處不喜世間八法所不能動至于衣服飲食等心不貪著但以諸善功德為貴得初禪已進求二禪二禪厭患覺觀何以故如欲界五欲五蓋令心散亂初禪覺觀亂定心亦復如是即用無漏初禪呵責覺觀內得清淨定生喜樂入于二禪問云何是二禪相答曰以無覺觀動故內心清淨如水澄清無有風波星月諸像悉皆照見定生喜樂妙勝初禪喜樂從離欲生此中喜樂從初禪定生得二禪大喜然心變著喜生諸結使以是喜故為煩惱本況喜為粗樂今欲捨粗而求細樂故言離喜更入深定以求妙樂問云何是第三禪樂答世間最樂無有過者粗者為喜根細者為樂根譬如極熱得清冷水持洗手面是名為喜入清凉地舉身沐浴是名受樂既得三禪之樂一心守護常恐退失則為是惱是故樂復為患當求離樂譬如人求富貴之樂求時既苦得之無厭則復為苦得已守護亦復為苦行者患樂亦復如是蓋初禪樂以覺觀亂故捨二禪大喜動故捨三禪知樂無常難守故捨以是故當捨此樂進求四禪安隱地前依禪定樂捨于欲樂今依何等而捨禪樂且捨禪樂得何利益答曰依涅槃樂能捨禪樂而得三利所謂羅漢辟支佛佛道以三乘道隨意而入清淨涅槃問云何是第四禪相答曰斷樂斷苦無喜無憂故念清淨初禪覺觀未定二禪喜大發動三禪樂心多亂並皆念不真清淨雖有定心出入息故令心難攝四禪純清淨故無出入息故心則易攝是為真禪譬如善御良馬隨意所至欲行四無量心四無色定等隨意皆得欲得六通求之亦易前三禪粗相清淨心第四禪細相清淨心障不得自在神通飛騰隱顯遍至十方諸佛淨土聽法之煩惱或隱或顯迅速無礙山崖墻壁直過如空凌虗往來猶如飛鳥地中出沒如出沒水可以遍至十方即此神境通也障學安那般那數息不淨因緣觀等諸煩惱安那云出息般那云入息習坐禪者有止觀法門天台小止觀云數息觀對治游思之病先數入息後數出息從一至十終而復始不令散亂亦有數入不宜數出數出不必數入雙數反恐有病故耳不淨觀者對治貪欲謂觀身不淨也如上卷三十六等所明盡此乾慧一信住行向各十共四十一清淨心次成四種妙圓加行四種妙行此即暖地頂地忍地世第一地也障學暖頂忍第一法七方便等諸煩惱所諸暖頂忍第一法者謂以佛覺用為己因地心若出未出猶如鑽火欲燃其水名為暖地又以己心成佛所履若依非依如登高山身入虗空下有微礙名為頂地心佛二同善得中道如忍事人非懷非出名為忍地數量消滅迷覺中道二無所目名世第一義七方便者小乘七賢一五停心位二別相念位三總相念位四暖位五頂位六忍位七世第一義位也五停心者數息停散心不淨停貪心慈悲停瞋心因緣停癡心念佛停障心謂之圓五品停五心別教云忍位有五一伏忍證十信二柔順忍證十行十向三信忍證十住四無生忍證十地五寂滅法忍證妙覺障學慈悲喜捨聞思修等諸煩惱慈悲喜捨即四無量心發菩提心論云聞思修為三慧一聞慧如所聞法心常愛樂無有厭足二思慧思念觀察一切有為法如實相謂無常苦空無我不淨念念生滅不久敗壞即生厭離趨佛智慧三修慧謂離欲不善法漸次修入障學空平等中道解三觀義諸煩惱空者一念無相因緣所生法我說即是空平等者無法不備亦名為假中道者不一不異亦名為中空與平等中道是為三觀習觀者要解此三觀義此出中輪障學助道品念處正勤根力如意足諸煩惱助道品者即上卷三十七助菩提法中四正念處四正勤五根五力四如意足是也四念處者一觀身不淨謂染緣有故二觀受是苦謂執取增縛三觀心無常謂念念遷滅四觀法無我謂無有定相四正勤者已生惡時勤令斷未生惡時勤令不生未生善時勤令生已生善時勤令增長五根者一信根能入法海信于業報消除疑網二念根住持不忘三精進根念茲在茲四定根湛寂虗通修心不亂五慧根明辨實諦以慧照了五力者一信力一念萬年魔不能壞二念力純清絶點煩惱不能壞三進力塵劫無怠天人不能壞四定力須彌堅固無有能動五慧力摧邪顯正知世間出世間法無一法能壞四如意足者即四神足也一定根如意足謂深固幽遠此得也二定覺如意足謂寂而常照此念也三定力如意足謂魔不能動此進也四正定如意足謂入佛三昧此慧也障學八正道示相之煩惱八正道者無盡意經云一正見道謂不起斷常見二正思惟道謂思不起于貪等而思戒定慧解脫解脫知見也三正語道凡所演說除口邪命故四正業道順理而修清淨業故五正命道以無漏智除三業五種邪命無諸奸諂故六正精進道勤修涅槃善入正諦七正念道進向涅槃繫心不忘故八正定道決定不亂故八正道即八聖道總是依法而修為有法可得義故曰示相障學七覺支不示相煩惱七覺支者無盡意經云支者分也一念覺分謂觀一切法自性皆空故二擇法覺分謂能分別了義不了義故三進覺分謂勤修不退故四喜覺分謂所修法喜故五除覺分謂除諸煩惱故六定覺分謂如所入定覺了諸法故七捨覺分謂不為世法所牽無著無礙故七覺支即七菩提分總是觀一切法空為無法可得義故曰不示相障學八解脫九空定煩惱八解脫者大集云一內有色觀外色解脫背棄色愛心此謂初禪二內無色觀外色解脫背棄色愛心此謂二禪三淨勝解心作證具足住背棄不淨心此為三禪四超一切色想滅有對想不思惟種種想入無邊空處定具足住棄下地法此為四禪五超一切空無邊處入無邊識處定具足住非棄下地法亦為四禪六超一切處識無邊處入無所有處定具足住非棄下地法此為四空七超一切無所有處入非想非非想定具足住非棄下地法亦為四空八超一切非想非非想處入滅想受定具足住背棄一切有緣心此為過三界解脫者離縛之義也九空定者初門云一次第定初禪喜樂二次第定二禪妙喜生三次第定三禪妙樂四次第定四禪浮盡五次第空處定空能普入六次第識處定識能明了七次第無所有處定無有即有八次第非非想定無想即想九次第滅受想定心滅無滅障學於十智三三昧煩惱十智者華嚴云一三世智二佛法智三法界無智智四法界無邊智五充滿一切世界智六普一切世界智七住持一切世界智八知一切衆生智九知一切法智十知無邊諸佛智三三昧者有覺有觀為空三昧無覺無觀為無相三昧無覺有觀為無作三昧三昧者此云正受不受諸受乃為正受又云正覺即具自在神通之意也又圓覺注云言佛入于神通三昧之謂也障學三明六通四無礙煩惱三明者一天眼智明謂聲聞辟支菩薩三乘諸佛于天勝妙得彼天眼二宿命智明佛于三世境界無有不知不同二乘三漏盡智明證見道時遠離四漏謂欲漏有漏見漏無明漏不同二乘所證又大經云一菩薩般若明二諸佛天眼明三無明畢竟空六通者般若云一神境通能起種種神變震動十方變一為多變多為一或隱或顯迅速無礙山崖墻壁直過如空凌虗往來猶如飛鳥地中出沒如出沒水身出煙焰如燎高原體注衆流如消雪嶺日月神德威勢難當以手𢪛摩光明隱蔽轉身自在此即身如意通二天耳通過人天耳能如實聞十方各殑伽沙界情非情類種種音聲三他心通能知十沙界諸有情類一切心心所法謂貪嗔癡等心或著或離乃至聚散小心大心寂靜否心解脫否心皆如實知四宿命通能知十方有情一心十心百千心若一日二日至百千年劫如是時處如是姓名死此生彼若自若他若廣若略等事五天眼通能見十方情非情種種色像或粗或妙死時生時善趣惡趣復知彼隨善業惡業受生勝劣等報六漏盡通能知十方有情若自若他漏盡不盡此通斷諸障習方得圓滿菩薩得漏盡通得不退轉不墮聲聞獨覺之地四無礙者四無礙智一義無礙智知諸法義了了通達二法無礙智諸法名字分別無滯三詞無礙智辨說無礙令各得解四者樂說無礙智十二部經隨其根性為說也障學六度四等煩惱六度者一布施二持戒三忍辱四精進五禪定六智慧也四等者楞伽經字語身法四者與我同等字等者一切如來佛名字無別語等者六十四種梵音無差身等者諸佛法身相好是同法等者我彼同得菩提分法四者等無差別故云四等障學四攝法廣化之煩惱四攝法者妙玄云一布施攝法謂樂財者以財施樂法者以法施二愛語攝法謂以軟語隨順安慰一切衆生三利行攝法謂隨起身口意行令各沾利益四同事攝法謂和光同事令其各得沾益故得廣化障學大乘心四弘誓願之煩惱大乘四弘誓者行願品云衆生無邊誓願度煩惱無盡誓願斷法門無量誓願學佛道無上誓願成誓願弘深故為大乘障學十明十行之煩惱十明者華嚴云一知一切衆至業報二知一切衆生寂滅三知一切惟是實相四能以無量聲壞染著五能以方便受生六捨離一切想受七知一切法非想八知一切法非無想九知一切有法本無有生十濟度一切衆生十行者一歡喜行謂始入法界不為邪動二饒益行謂常化衆生使得法利三無嗔恨謂常修善法謙下恭敬四無屈撓謂行大精進令一切至究竟涅槃五無礙亂謂不為無明之所失亂六善現謂生生常在佛國中生七無著謂于我我所一切皆空八尊重行謂成就難得善根九善法行謂說法授人成佛軌則十真實行謂二諦非如亦非非相障學十回向十願之煩惱十回向者別教云一救護衆生離衆生相回向謂以無想心常行六道而入果報不受而受二不壞回向謂觀一切法有受有用念念不住三等一切諸佛回向謂三世佛法一切時行四至一切處回向謂以大願力入一切佛土供一切佛五無盡功德藏回向謂以常住法授與前人六入一切平等善根回向謂行無漏善善而不二七等觀隨順一切衆生回向謂觀善惡無二一相八真如相回向謂心得自在等三世佛常照有無九無縛無著解脫回向謂以般若照三世諸佛是一合相十入法界無盡回向謂覺一切法中道無相十願者行願品云一者禮敬諸佛無限善根願二者稱讚如來愛法增上願三者廣修供養親近增上願四者懺悔業障護法神通願五者隨喜功德自證正智願六者請轉法輪令他解了願七者請佛住世攝受正法願八者常隨佛學廣利羣生願九者恆順衆生荷負衆生正法願十者普皆回向如說修行願障學初地二地三地四地明解之煩惱障學五地六地七地諸知見煩惱障學八地九地十地雙照之煩惱初地菩薩見自身真如佛性名見道位從二地至七地是修道位猶有功用而修其行從八地至十地名究竟位十一地等覺位中普賢行方終十二地是妙覺佛果別教云一歡喜地達佛境界二離垢地身心清淨三發光地淨極明生四焰慧地明極覺滿五難勝地功行超越六現前地性淨明露七遠行地隨方應化八不動地一真如心忍智自如九善慧地發真如用道力自在十法雲地慈陰妙雲大智圓明也又由證聖位故歡喜身心清淨名離垢智已生明名發光妙解廓然名焰慧功行超越名難勝通達真俗名現前隨方應化名遠行忍智同如名不動道力自在名善慧大智圓明名法雲已履佛境種種功德從此發生故名地雙照者永嘉集云無即不無有即非有有無雙照妙悟蕭然又有真俗二諦注云空智照真為實假智照俗為權此真俗二諦空假二智雙照權實雙顯故名雙照地者蘊積前法至于成實一切佛法依此發生故謂之地障學佛果百萬阿僧祇諸行之煩惱阿此云無僧祇此云數合言無數如釋迦歷三祇又九十一劫方成佛果若障學諸行未免煩惱一切業障懺悔俱完又伸發願如是行障無量無邊今日致禱稽懇向十方佛尊法聖衆慚愧懺悔願皆消滅發願總懺已竟下承前申願願藉此懺悔障於諸行一切煩惱所生功德願在在處處自在受生不為結集業行之所回轉以如意通於一念頃遍至十方淨諸佛土攝化衆生於諸禪定甚深境界及諸知見通達無礙心能普周一切諸法樂說無窮而不染著得心自在得法自在方便自在令此煩惱及無知結習畢竟永斷不復相續無漏聖道朗然如日身如意通見前六通內攝化衆生即說法廣化也以下直至方便自在等俱是具足神通力修諸小乘善法人天小果是為有漏之因于聖道尚有滲漏故也若為了生死而行菩薩道修無餘涅槃妙果是為無漏聖道無漏者于大乘法更無遺漏之謂朗然者開悟無漏之義也又無漏聖道正指上文見佛聞法值賢聖僧乃至于十地等妙阿僧祇等悉皆名為無漏聖道以懺悔故煩惱既盡聖道朗然如杲日麗于中天無幽不燭者也發願已歸命禮諸佛禮佛結願南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔某等略懺煩惱障竟今當次第懺悔業障上文三障總分三大段一曰煩惱二名為業三是果報今懺煩惱已畢故云云此處懺悔業障夫業者能莊飾世趣在在處處不復思惟求離世解脫所以六道果報種種不同形類各異當知皆是業力所作能莊飾者但能莊嚴光飾于六道所以在在處處莊者莊嚴飾者修飾此句言凡夫作業繁多勤勤無怠似有莊嚴修飾之象也世者如造三毒十惡等之罪業莊嚴地獄三塗之世趣也縱行五戒十善等之善業生于天上人間猶為世趣未能出世而超三界故也不復思惟者不修戒定慧乃至不求無上菩提故云業力所作即莊飾世趣之所感也力造惡業故云業力者衆生之業力也與下文業力甚深不同業力甚深乃佛之業智力也佛十力中業力甚深凡夫之人多於此中好起疑惑佛十力者謂佛應正等覺有十種實智見力也詳見後十力無畏處業力甚深一句引例凡夫業力之甚深也六道衆生自家業力不同諸佛無上菩提莫非善業功德智力之所成就故云甚深當知凡夫不得聖道皆是惡業惑力之所障蔽故亦是甚深可知之也所以若好若歹無不于此善惡業力之所惑衆生不知故起疑惑也下先舉疑惑之由何以故爾現見世間行善之人觸向轗軻何以者征起何以起惑下釋成坎險也坎險多迍之貌觸向轗軻所為之事多不如意也為惡之者是事諧偶謂言天下善惡無分肉眼凡夫不能了知三世事故所以便言善惡無分云云如此計者皆是不能深達業理即下三世善惡因緣果報等謂之業理何以故爾經中說言有三種業何等為三一者現報現生之報二者生報來生之報三者後報多生後不定之報下出意現報業者現在作善作惡現身受報現受苦樂等報生報業者此生作善作惡來生受報來生受苦樂等後報業者或是過去無量生中作善作惡於此生中受或在未來無量生中受引經言三種業有現報有生報有後報正見過去有業所以有後報總歸重下文云過去既有如此惡業一句觀上文當知皆是業力所作一句可見經言至或在未來無量生中受止若今行惡之人現在見好者此是過去生報後報善業熟故所以現在有此樂果豈關現在作諸惡業而得好報若今行善之人現在縈苦者此是過去生報後報惡業熟故現在善根力弱不能排遣是故得此苦報豈關現在作善而招惡報若今者詳明上文若如也若今云云行惡之人行善之人二段正發明經中現報生報後報義意而釋之此段文理甚妙世人正當此處著眼此全重在業字看不必重在報上看當知有二義若就前生善業已熟今受樂果是過去生報若或多生已前善業已熟現得受樂必非現作惡因而反得善果也下行善一節例上可知此釋上行善行惡等二種之疑也現在善根力弱不能勝過去極重惡業苦報豈能除滅故曰不能排遣所以然者現見世間為善之者人所讚歎人所尊重故知未來必招樂果過去既有如此惡業所以諸佛菩薩教令親近善友共行懺悔見善知識於得道中則為全利是故今日至誠歸依於佛此正釋前意過去既有如此惡業一句正與上文六道果報種種不同形類各異當知皆是業力所作等語照應所以此處只重在業不重在報報特帶言之耳且此處原是懺悔業障後面另有懺悔報障文理顯然可見矣某等無始以來至於今日積惡如恆沙造罪滿大地捨身與受身不覺亦不知此下廣舉業相而求懺悔與上七種方便之心反觀照應細玩可知梵語殑伽此云天堂來又云恆河從高處流下故廣一由旬長不知其數沙細如如佛說法有多數者即以恆河為喻云耳捨身受身者謂生生死死捨此一身又受一身也身世間隔不啻醉夢即此所捨所受之身且不自覺其來因又安知過去所作惡業故曰不覺亦不知前文云過去既有如此惡業是一句總話下文正一一說出人身中過去諸惡業如作五逆造闡提等皆是也或作五逆深厚濁纏無間罪業或造一闡提斷善根業輕誣佛語謗方等業破滅三寶毀正法業深厚濁纏極重莫解之意闡提者一向修證因疑惑而生惡相惡法除去善心故名闡提梵語一闡提此云信不具撥無因果之人所以謗佛謗法也不信罪福起十惡業迷真反正癡惑之業不孝二親反戾之業輕慢師長無禮敬業朋友不信無義之業或作四重八重障聖道業不信直至下文俱是斷善根之罪業也十惡者身三口四意三惡業是也迷真反正謂之迷真心反正道也四重者殺盜淫妄波羅夷根本罪有四也波羅夷此云極重罪比丘有四波羅夷比丘尼有八羅夷前四重與比丘同第五男身觸六于染心男捉手捉衣入屏處共立共話共行身相依相期七覆他重罪八隨所舉大僧供給衣食波羅夷又云棄若犯此四重八重者永棄佛邊地外猶如大海不受死尸故云棄是之謂波羅夷毀犯五戒破八齊業五篇七聚多缺犯業五戒有在家出家二種五戒者一不殺生二不偷盜三不犯淫四不妄語五不飲酒破此五禁謂之毀犯八齊者每月有八齊日五篇七聚者戒律之篇目也僧祇云五篇者一夷二殘三提四尼五言為五篇夷者四波羅夷重罪比丘四條比丘尼八條殘者十三僧殘比丘十三條比丘尼十七條提者三十尼薩耆九十波逸提比丘百二十條比丘尼一百八條尼者四提舍尼比丘四條比丘尼八條吉者突吉羅即一百衆學比丘一百條比丘尼一百條突者惡也吉羅者作也七聚者一棄二衆殘三醜惡四墮五可呵六惡作七惡說破此等戒則為多缺犯業優婆塞戒輕重垢業或菩薩戒不能清淨如說行業前後方便汙梵行業優婆塞此云近事男謂在俗親近三寶盡壽持五戒者也五戒者一不殺生二不偷盜三不邪淫四不妄語五不飲酒食肉又報恩經云優婆塞有五戒一不得販賣畜生二不得販賣弓箭刀杖三不得沽酒四不得壓油天竺麻有蠱故五不得大色染業外國染皮傷蟲四分云前四波羅夷法十三僧伽婆尸妙法二不定法三十尼薩耆波逸提法九十波逸提法四波羅提提舍尼法一百衆學法七滅諍法比丘所受此皆屬比丘戒若菩薩十重四十八輕戒出梵網經前後方便即大小便利或不依律規所行故也梵行淨行也汙穢清淨之行安得無業月無六齊懈怠之業年三長齊不常修業每月六齊日初八二十三日天王使者巡案善惡十四二十九日天王太子巡十五三十日天王親巡年三齊月正五九月是也天以大寶鏡照四大部洲正五九此三月正照南贍部洲故宜持齊修福三千威儀不如法業八萬律儀微細罪業不修身戒心慧之業纂要云三千者四重十三僧殘二不定三十尼薩耆九十波逸提四提舍尼一百衆學七滅諍共成二百五十戒各有行住坐臥四威儀合為一千循三世為三千八萬律儀首楞云四威儀中各有二百五十戒成一千對三聚戒各一千成三千配身口七支成二萬一千復配貪嗔癡等分為八萬四千細行亦即此但言其八萬者舉大數耳春秋八王造衆罪業行十六種惡律儀業於諸衆生無愍傷業不矜不念無憐愍業不不濟無救護業心懷嫉妒無度彼業於怨親境不平等業八王日提謂云立春春分立夏夏至立秋秋分立冬冬至此八日天地鬼神陰陽交代故言八王四天王案行以比諸天民𨽻有福增壽有罪減算若冒冥無知不預作善收付地獄如來苦勸修齊戒令其得樂十六種惡律儀業者一屠兒二魁膾三養猪羊四捕魚五獵師六網鳥七捕蛇八養雞狗九呪龍十作賊十一捕賊十二獄吏十三淫女家十四沽酒家十五洗染家十六壓油家嘉善而矜不能即愛老憐貧之事也乃至濟救護等事一總不為者此皆不善業力之深故也耽荒五欲不厭離業或因衣食園林池沼生蕩逸業或以盛年放恣情欲造衆罪業或作有漏善回向三有障出世業五欲者財色名食睡也不厭離正是耽荒所以為業作善而回向三有是修人天福報福盡還應墮落便非大乘因果故曰障出世業故曰有漏善三有者欲有色有無色有即三界之因果不忘故名有既謂之有安得無漏有者謂因屬有漏果係有為有生有死故如是等罪無量無邊今日發露向十方佛尊法聖衆皆悉懺悔如上廣舉業相懺悔已竟下文發願誓不更犯而求成福慧等如文願某等承是懺悔無明等罪諸不善業盡皆消滅所生福善願生生世世滅五逆罪除闡提惑如是輕重諸罪惡業從今已去乃至道場誓不更犯闡提業從惑而起故曰闡提惑常習出世清淨善法精持律行守護威儀如渡海者愛惜浮囊浮囊即今涉海者繫葫蘆帶于腰以渡海者相類也浮囊本非我身然為愛我身故不得不愛惜浮囊如修涅槃者我身亦非我有然必借身以修性則不得不為性以檢束身心故須精持律行守護威儀愛惜浮囊者似之育王譬喻經云昔行人見彼路傍有一死人天神下來散華尸上以手摩之行人問其故天神答曰是我故身前生之日孝順父母忠信事君奉敬三寶受師父教令我生天良由其恩故來報耳前行又見一死人惡鬼鞭之亦問其故鬼言是我故身在生之日不忠不孝種種非為令我惡報故來鞭耳觀此故身為浮囊詎可不慎六度四等常標行首戒定慧品轉得增明六度四等為萬行之首故云常標行首戒生定定生慧故曰轉得增明又戒定慧謂之三學修惑戒如去捉賊定如去縛賊慧如殺賊也速成如來四字直管至八自在我句三十二相三十二相者一足下平安二足下千輻輪相三手足指長勝餘人四手足柔軟五手足指合縵網六足踉滿足七足趺高好八伊尼延鹿王腨九立手摩膝十陰藏如馬王十一身縱廣等十二身毛上生青色柔軟十三毛向上右旋十四金色光十五身光面各一丈十六皮膚細滑不停塵水十七兩足下兩手肩七滿處十八腋下滿十九身如師子王二十身端直二十一肩圓好二十二四十齒具足二十三齒白淨齊密根深二十四牙大而白二十五頰車如師子二十六得味中上味二十七舌薄覆面至髮際二十八梵音深遠如頻伽鳥二十九眼色如金精三十眼睫如牛王三十一眉間白毫如兜羅綿三十二頂上肉髻成八十種好如來身有八十種好一無見頂相二鼻高孔不現三眉如初月四耳輪輻相理成五身堅固如那羅延六骨際如鈎鎖七身一時回如象王八行時足去地四寸印文現九爪如赤銅色十膝骨堅著圓好十一身清淨十二身柔軟十三身不曲十四指長懺圓十五指文藏覆十六脉深不現十七踝不現十八身潤澤十九身自持不逶迤二十身滿足二十一容儀備足二十二容儀滿足二十三住處安無能動者二十四威振一切二十五一切樂觀二十六面不長大二十七正容白不撓色二十八面具滿足二十九唇如頻婆果色三十言音深遠三十一臍深圓好三十二毛右旋三十三手足滿三十四手足如意三十五手文明直三十六手文長三十七手文不斷三十八一切惡心衆生見者和悅三十九面廣殊好四十面淨如滿月四十一隨衆生意和悅與語四十二毛孔出香氣四十三口出無上香四十四威儀如師子四十五進止如象王四十六行法如鵝王四十七頭如摩陀那果四十八一切聲分具足四十九四牙白利五十舌香赤色五十一舌薄廣五十二毛紅色五十三毛軟淨五十四廣長眼五十五孔門相具五十六手足赤白如蓮華色五十七臍不出五十八腹不現五十九細腹六十身不傾動六十一身持重六十二其身大六十三身長六十四手足軟滑六十五四邊光各一丈六十六光照身而行六十七等視衆生六十八不輕衆生六十九隨衆生音聲不增不減七十說法不著七十一隨衆生語言說法七十二發音報衆聲七十三次第有因緣說法七十四一切衆生不能盡觀相七十五觀無厭足七十六髮長好七十七髮不亂七十八髮旋好七十九髮色青珠八十手足有德相十力無畏大悲三念佛十力者寶雲謂一是處非處如實力知善惡因緣果報定相二業智力知一切衆生過現未來諸業諸受果報三定力知一切諸禪解脫三昧四根力知他衆生諸根上下五欲力知他衆生種種欲樂六性力知世間種種性七至處力知一切道至處相八宿命力知一世乃至百千世中姓名苦樂壽命長短等九天眼力知衆生生時死時善惡道等十漏盡力自知我生已盡不受後有四無畏者智論云一總持一切智無畏二知根漏盡無畏三決疑說障道無畏四答報說苦盡道無畏于大衆中廣說自他智斷既決定無所失則無恐懼之相三念者寶藏云一得供不高無忘失法二逢毀不下永習氣三不供不毀不生慚感一切種妙智常樂妙智八自在我歸依諸佛願垂護念即此十力無畏大悲三念便是常樂妙智八自在我涅槃經云一能示一身多身數如微塵二以塵身滿大千界三以大身輕舉遠到四觀無量常居一國五諸根互用六得一切法如無想七說一偈經無量劫八身如虗空存沒隨宜不窮某等前已總相懺悔一切諸業今當次第更復一一別相懺悔此承前啓後前文總懺諸業後復別相懺悔身三口四六根業以至佛法僧間餘障若總若別若粗若細若輕若重若說不說品類相從願皆消滅此又別中總舉別相懺者先懺身三次懺口四其餘諸障次第稽顙此懺身三業殺盜淫是為身三業也身三業者第一殺害如經所明恕己可為喻勿殺勿行杖雖復禽獸之殊保命畏死其事是一若尋此衆生無始以來或是我父母兄弟六親眷屬以業因緣輪回六道出生入死改形易報不復相識而今興害食噉其肉傷慈之甚第一殺害者即就身中第一殺業為重故先言之梵網經云佛言佛子若自殺教人殺方便讚歎殺見作隨喜乃至呪殺殺因殺緣殺法殺業乃至一切有命者不得故殺菩薩應起慈悲心救護而恣意殺者是波羅夷罪恕己可喻者人多自恕既知恕己便知恕他故曰可為喻即將心比心之謂也是故佛言設得餘食當如饑世食子肉想何況食噉此魚肉耶饑世易子而食極為不得已正見饑世之苦今得食有餘時便當念饑饉之苦勿使過度可也餘食尚不敢過分多用況食衆生肉而不痛念哉且衆生往世安知非我父母兄弟六親眷屬而乃食之耶究極于此大可流涕又言為利殺衆生以財網諸肉二俱是惡業死墮號呌獄此文出楞伽經為利殺者屠兒販賣或宰夫之流殺以求利財網肉者不敢自殺而恃財廣買逞口腹貪叨無厭者也二意互參故知殺害及以食噉罪深河海過重丘嶽故知下先明殺業之果報而後懺悔殺業之罪然我等無始以來不遇善友皆為此業是故經言殺害之罪能令衆生墮於地獄餓鬼受苦若在畜生則受虎豹豺狼鷹鷂等身或受毒蛇蝮蠍等身常懷惡心或受麞鹿熊羆等身常懷恐怖經言至多病短命出華嚴經殺害食噉本因惡心而然故感狠毒身報而常懷惡心熊獸其形似豕古云大秦之國出玄熊赤熊類黃白者是也好殺者令衆生恐怖故受恐怖報上畜生報下人中苦報若生人中得二種果報一者多病二者短命殺害食噉既有如是無量種種諸惡果報多病者殺害衆生痛苦之報短命者殺害衆生未盡天年之報是故至誠求哀懺悔上略明殺業果報懺悔已竟下廣舉殺業之罪而重求懺悔有四章云云某等自從無始以來至於今日有此心識常懷𢡖毒無慈愍心或因貪起殺因瞋因癡及以慢殺或興惡方便誓殺願殺及以呪殺此種種殺之殺因也或破決湖池焚燒山野畋獵漁捕或因風放火飛鷹放犬害一切如是等罪今悉懺悔決者行流也破也破決湖池令其乾竭焚燒山野令其光淨可以畋獵漁捕無藏躲處因風放火即焚燒之意飛鷹放犬即畋獵之意或以禽獸略知逃死故又言之也或以檻弶坑撥扠戟弓弩彈射飛鳥走獸之類或以𮊁網罾釣撩漉水性魚鱉黿鼉蝦蜆螺蚌溼居之屬使水陸空行藏竄無地籠閉為檻露置為弶坑者上陷撥者機械扠戟者鐵黏戈矛之屬𮊁者網之總名撩者撩理漉者竭也水性撩理使竭黿鱉之大者鼉長一丈其聲如鼓蜆小蛤蚌長蛤水陸空行者魚族水行走獸陸行飛鳥空行一切各有斂藏使之逃竄無地者由乎掩取百計殺害多方使之恐怖而然也所以云網于山𮊁于淵多方掩取曲而鈎直而矢百計搜羅誠為苦切也或畜養雞猪牛羊犬豕鵝鴨之屬自供庖厨或賃他宰殺使其哀聲未盡毛羽脫落鱗甲傷毀身首分離骨肉銷碎剝裂屠割炮燒煮炙楚毒酸切橫加無辜上舉傷殘水陸空行罪業已竟下舉故畜家豢自供等業而懺悔之自供庖廚即烹庖之所也賃借也剖割之謂宰但使一時之快口得味甚寡不過三寸舌根而已然其罪報殃纍永劫如是等罪今日至誠皆悉懺悔得味寡而受報多可為猛省古云吾食衆生肉形殊體不殊一般同性命只是別形軀苦楚令他受肥甘為我需不須閻老判自揣道如何義亦在斯矣古云飲食于人日月長精粗隨分塞饑瘡才過三寸成何物勿用將心細較量修道之人宜以此為警戒又復無始以來至於今日或復興師相伐疆場交爭兩陳相向更相殺害或自殺教殺聞殺歡喜或習屠儈賃為刑戮烹宰他命行於不忍或恣暴怒揮戈舞刃或斬或刺或推著坑塹或川水沉溺或塞穴壞巢或土石磓磹或以車馬𨎿轢踐踏一切衆生如是等罪無量無邊今日發露皆悉懺悔疆場疆界之謂也屠儈殺人儈手之謂上言傷殺物命固為不忍此則傷殺人類猶為𢡖惡故曰行于不忍坑塹陷阱也巢鳥獸所居有意壞之磓磹聚石塞之又云以石投之之謂𨎿轢即輘轢車陵踐也此下俱是傷殺微細諸蟲罪業又復無始以來至於今日或墮胎破卵毒藥蠱道傷殺衆生墾土掘地種植田園養蠶煮繭傷殺滋甚墮胎者用藥墮人胞胎及殺母羊而取羔之類破卵者今人食雞鴨之卵及毀巢墮卵皆是毒藥用藥毒人及藥蟲魚狗鼠鳥獸皆是蠱道者如川廣中下蠱傷人此皆名蠱道又蠱者惑也又穀久積變為飛蠱墾掘種植螻蟈蚯蚓之類繭煮熟抽絲或打撲蚊蚋掐嚙蚤蝨或燒除糞掃開決溝渠枉害一切蚋小飛蟲即蠛蠓糞掃乃腐爛之物皆有蟲蟻決通也開決必有戕害故枉屈也冤抑也或噉果實或用穀米或用菜茹橫殺衆生或然樵薪或露燈燭燒諸蟲類或取醬醋不先搖動或瀉湯水澆殺蟲蟻果實穀米菜茹皆生蟲故然樵薪即是燒然一切柴草露燈燭暑天時夜見燈飛集又云憐蛾不點燈如是乃至行住坐臥四威儀中恆常傷殺飛空著地微細衆生凡夫識暗不覺不知今日發露皆悉懺悔四威儀即指行住坐臥而言佛觀一鉢水八萬四千蟲又空中充滿微細諸蟲惟天眼能見凡夫肉眼茫無所見故不覺不知又復無始以來至於今日或以鞭杖枷鎖桁械壓拉拷掠打擲手腳蹴踏拘縛籠繫斷絶水穀如是種種諸惡方便苦惱衆生今日至誠向十方佛尊法聖衆皆悉懺悔即今囹圄中柙牀等刑之類是也掠者笞也打擊也擲拋也蹴蹴踘踏踐踏此俱傷殘害物之象也用方法機智巧便而行惡謂之惡方便即鞭杖枷鎖以至斷絶水穀皆是苦毒陷害之方法故如上披陳發露懺悔已竟下發願成德云云願承是懺悔殺害等罪所生功德生生世世得金剛身壽命無窮永離怨憎無殺害想於諸衆生得一子地若見危難急厄之者不惜身命方便救脫然後為說微妙正法使諸衆生覩形見影皆蒙安樂聞名聽聲恐怖悉除此發願總懺苦與樂殺害之罪當得多病短命等報所以懺悔之後願得金剛身願無怨憎殺害之想金剛身堅固之謂故云壽命無窮非真得金剛神之身也當知得而無得是真得也得一子地者如佛視衆生等同一子故地字即作位字解說方便者智術權巧以救之謂之方便救脫為說微妙正法即今放生時對生說三歸五戒稱佛為師不墮三惡道不墮邪見之類是也衆生常懼殺害以故覩形見影不得安樂聞名聽聲悉皆恐怖今願救護一切且為說微妙正法令知佛道皆蒙安樂恐怖悉除此真慈悲發願之致也我今稽顙歸依於佛南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔上懺殺業已竟下文次懺盜業劫盜之業經中說言若物屬他他所守護於他物中一草一葉不與不取何況竊盜但自衆生惟見現利故以種種不道而取致使未來受此殃纍梵網經云若佛子自盜教人盜方便盜呪盜盜因盜緣盜法盜業乃至鬼神有主物劫賊劫一針一草不得故盜而菩薩以慈悲心常助一切人生福生樂而反盜人物波羅夷罪屬字當訓實字頗通此物實是他人之所有故云屬他詳之可見不與不取者言雖一草一葉之微人不與我不得取況竊盜乎竊取之物決不止一草一葉之間其過極重于前故況而比之也衆生泛舉一切兼之于己意云我及衆生有如是業不道者非理強取是故經言劫盜之罪能令衆生墮於地獄餓鬼受苦若在畜生則受牛馬驢騾駱駝等形以其所有身力血肉償他宿債先明劫盜之果報而後懺悔劫盜之業畜生償宿債不止于牛馬等看等形二字可見凡人間豢養之畜如猪羊犬豕之類取而販賣殺食皆是身力血肉償他宿債之故也如細分更有二意如文可見若生人中為他奴婢衣不蔽形食不充口貧窮困苦人理殆盡劫盜既有如是苦報縱不墮于三塗以貪盜故生在人中其苦如此可不慎哉是故今日至誠求哀懺悔某等自從無始以來至於今日或盜他財寶興刃強奪或自奮身逼迫而取或恃公威或假勢力高桁大械枉壓良善吞納姦貨拷直為曲為此因緣身罹憲網上文總懺盜業罪報已竟下六節別懺盜業廣明罪相之文興刃一句似明火劫盜等事自恃等者倚頑奪取人物公威有司貪酷之徒勢力豪宦圖謀之類云云倚官托勢豪貴自強之類或自製刑具枉害于人也或吞估而納之或奸欺而售之乃至屈打成招無所不至者也罹遭也憲即險也或任邪治領他財物侵公益私侵私益公損彼利此損此利彼割他自饒口與心吝竊沒租估偷渡關津私匿公課藏隱使役如是等罪皆悉懺悔任邪治者不行正事妄取之徒侵益者或因己在私故侵公或己在公故便侵私割即損也饒即益也如云何知割他肉不念他貧只念己富者是也吝鄙也慳也租田賦估市稅偷渡者于關津渡口公漏輸稅私匿渡錢也亦可以偷渡即是私匿關津便是公課公課者朝廷之官稅國課侵匿而私用也藏隱使役者民間而躲避差徭軍中而走背調戍是也又復無始以來至於今日或是佛法僧物不與而取或經像物或治塔寺物或供養常住僧物或擬招提僧物或盜取誤用恃勢不還或自借或貸人或復換貸漏忘或三寶物混亂雜用要集問云何故盜僧物罪偏重耶答曰施主本捨一毫一粒擬十方鼓鐘一響遐邇同聞聖凡受用俱成道業冥資施主得福無邊今見愚癡衆生或食噉僧食或受用華果或將僧奴隨逐或以僧畜乘騎或私借貸僧物不還或以官勢伺求僧過等具列難盡有道高僧守護不與者豈惟愍白衣後受苦報亦及知事未來生處同受其殃莊樁録云盜常住一文錢一日一夜長三分七𨤲利第二日夜利上又長利來世作牛馬償之所以云作一生之容易為萬劫之艱難若捨一文錢入常住一日一夜長福亦爾梵語招鬪提奢唐言四方僧物訛云招提即十方常住之所也古云住常一根草勸君休要討佛地有伽藍陰司有閻老慎諸混亂雜用者如施栴檀塑像混而焚燒或放生錢混而齊僧齊僧錢混而造寺皆犯罪業而況私自利己乎罪福決疑經或施主本作釋迦改作彌陀本作大品改充涅槃本造僧房改供僧食本施二衆改入一衆本擬十方回入現前皆違反施主又許此處乃與彼處皆犯罪也準此文檢校佛像有餘彩色不得作菩薩聖賢等形以師徒位別故不得互用五百問事律云用佛彩色作鳥獸形得罪除在佛前供養不犯矣或以衆物穀米樵薪鹽豉醬醋菜茹果實錢帛竹木繒綵幡蓋香華油燭隨情逐意或自用或與人或摘佛華果用僧鬘物因三寶財物私自利己如是等罪無量無邊今日慚愧皆悉懺悔或以衆物句直貫下香華等六句皆指衆物而言隨情隨人之聲逐意逐己之意鬘華鬘纓絡也看因字自他俱不可亂用如造像造經造塔造寺及僧家諷經拜懺錢糧以至檀越齊僧布施放生錢皆三寶財物也倘不能酬三寶因而藏匿取用謂之私自利己也又復無始以來至於今日或作周旋朋友師僧同學父母兄弟六親眷屬共住同止百一所須更相欺誷同志曰朋遞相恭敬曰友和尚曰師清衆曰僧姑姨伯叔等曰六親如斯等類或共一處得有周給即百分之一所須之物而或彼此互相欺詐誣誷而私用之或於鄉鄰比近移籬拓墻侵他地宅改標易相虜掠資財包占田園因公託私奪人邸店及以屯野如是等罪無量無邊今悉懺悔拓推也移拓即侵之意標記也改易即移拓之意虜掠者明火持杖劫奪之謂因公者藉公事而狥己私邸舍也至也言所歸至也店肆也所以置貨鬻物也屯者聚也或山野屯聚之所也又復無始以來或攻城破邑燒村壞柵偷賣良民誘他奴婢或復枉壓無罪之人使其形殂血刃身被徒鎖家緣破散骨肉生離分張異域生死隔絶如是等罪無量無邊今悉懺悔枉即屈也殂殞也死也緣因也亦可作園異域他鄉也又復無始以來至於今日或商估博貨邸店市易輕稱小斗減割尺寸盜竊分銖欺誷圭合以粗易好以短換長欺巧百端希望毫利如是等罪今悉懺悔商行商估論價博貨兌換貿易也市易以其所有易其所無尺寸丈尺之數分銖者稱與𨤲等之星斤兩之數二十四銖為一兩四分一兩七毫為一銖六粟為圭十圭為撮十撮為抄十抄為勺十勺為合十合為升言其少極之微物亦不可欺誷而取之此處皆言市井貿易一涉欺誷便類偷盜又復無始以來至於今日穿窬墻壁斷道抄掠抵捍債息負情違要面欺心取或非道陵奪鬼神禽畜四生之物或假托卜相取人財寶如是乃至以利求利惡求多求無厭無足如是等罪無量無邊不可說盡今日至禱向十方佛尊法聖衆皆悉懺悔穿窬墻壁窺竊也斷道抄掠即今攔路要截劫掠之類也抵捍債息負情違要者抵借不還而乃欺負實情違背舊約也要約也面欺者覿面相欺心取者私心謀取皆偷盜之類鬼神享際血肉故有禽畜四生之物當知鬼神等亦俱各有所得之物人見之即欺凌而奪之也以利求利即利上加利也惡求多求恃勢逼迫也願承是懺懺上廣懺悔盜業已竟下發願求成功德劫盜等罪所生功德生生世世得如意寶常雨七珍上妙衣服百味甘饌種種湯藥隨意所須應念即至一切衆生無偷奪想皆能少欲知足不耽不染常樂惠施行給濟道捨頭目髓腦如棄涕唾回向滿足檀波羅蜜七珍八寶金銀琉璃等妙寶珍服美味湯藥應念即至者即如佛國自然化現在前偷奪之業多起于貧窮或不知足而然今願種種所須如意自然無偷奪想且能少欲知足布施滿足發願宜然檀波羅蜜正布施到彼岸也上懺盜業已竟某等次復懺悔貪愛之罪此下懺悔身淫欲業經中說言但為欲故關在癡獄沒生死河莫知能出衆生為是五欲因緣從昔以來流轉生死一切衆生歷劫生中所積身骨如王舍城毗富羅山所飲母乳如四海水身所出血復過於此父母兄弟六親眷屬命終哭泣所出目淚如四海水是故說言有愛則生愛盡則滅故知生死貪愛為本梵網經云若佛子自淫教人淫淫因淫緣淫法淫業乃至畜生女諸天鬼神女及非道行淫菩薩應淨法與人而反起一切人淫波羅夷罪欲即色欲癡獄者耽滯愚癡而不省如繫牢獄而無所逃恩愛生死深如河海云五欲者財色名食睡此處正言淫欲五欲特帶言之耳歷劫生中身骨乳血目淚如此之多正見歷劫生死之多其苦亦多流轉生死無窮無盡無非以貪愛為本故淫心一滅則生死亦滅耳所以經言淫欲之罪能令衆生墮於地獄餓鬼受苦若在畜生則受鴿鴛鴦等身若在人中妻不貞良得不隨意眷屬淫欲既有如此惡果是故今日至誠求哀懺悔此處先明淫欲之果報以下方懺悔淫欲之罪貞真潔也不隨意眷屬一切不廉不潔愚蒙難化暴悍難馴之類皆是又復無始以來至於今日或偷人妻妾奪他婦女侵凌貞潔汙比丘尼破他梵行逼迫不道濁心邪視言語嘲調或復恥他門戶汙賢善名上先懺淫欲罪報竟下廣舉淫欲罪相而復懺悔之梵行此云淨行即淨戒也心多淫穢故曰濁心色目行淫名同欲火故曰邪視因懷淫穢之心故云濁心常觀不正之色故云邪視正修行之人目不觀邪色可知之也嘲戲謔之謂也或於男子五種人所起不淨行如是等罪無量無邊今日至誠皆悉懺悔男子者疑是梨園子弟及歌僮之類法華云不樂畜年少弟子沙彌小兒是也又彈考唱令家作音樂人也西方謂之尋香人五種人者生劇妒變半五種不男之人上懺悔已竟下發願成德云云願承是懺悔淫欲等罪所生功德生生世世自然化生不由胞胎清淨皎潔相好光明六情開朗聰利明達了悟恩愛猶如桎梏觀彼六塵如幻如化於五欲境決定厭離乃至夢中不起邪想內外因緣永不能動懺悔發願已歸命禮三寶或生西方或生十方淨土常得蓮華化生不同五濁惡世胞胎受生也六情開朗六根通利也在足曰桎在手曰梏如腳鐐手肘之類故云耳前已懺悔身三業竟今當次第懺悔口四惡業上懺身三下懺口四科文自明此懺口四業惡口妄言綺語兩舌是也經中說言口業之罪能令衆生墮於地獄餓鬼受苦若在畜生則受鵂鶹鴝鵅鳥形聞其聲者無不憎惡若生人中口氣常臭有所言說人不信受眷屬不和常好鬪諍先明口業之惡果以下次第懺悔口四惡業梵網經云若佛子自妄語教人妄語方便妄語妄語因妄語緣妄語法妄語業菩薩常生一切衆生正語正見而反起一切人邪語邪見等者波羅夷罪鵂鶹怪鳥所云怪鴟是也鴟之名多一名鵂鶹一名鵋䳢一名鵅鵅晝無所見夜出飛噉蚊虻鴝鵅或即是鵅鵅亦未可知若云鴝鵒今之八哥非怪非惡何為憎惡又云惡聲多淫之鳥也若生人中若字縱不至墮畜生云云口業既有如此惡果是故今日至誠歸依三寶皆悉懺悔此結上罪報懺悔某等自從無始以來至於今日以惡口業於四生六道造種種罪出言粗獷發語暴橫不問尊卑親疏貴賤稍不如意便懷瞋怒罵詈毀辱猥褻穢惡無所不至使彼銜恨終身不忘連禍結讎無有窮已上總懺口業惡報竟此廣舉口四惡業而次第懺之其文有四可見惡口者怨恨罵詈呪咀惡毒皆是犬不可附曰獷即醜惡粗強之語不堪聽聞者是也猥褻者亦即醜惡不堪之謂故云無所不至連禍結讎者即殃纍永劫之謂故云無有窮已又或怨黷天地訶責鬼神貶斥聖賢誣污良善如是惡口所起罪業無量無邊今日至誠皆悉懺悔怨黷訶責今有瞋天罵地呪雨呵風等類是也貶斥者抑也擯也誣污者以惡言醜語虗誣污其清名故云誣污良善云又復無始以來至於今日以妄語業作種種罪意中希求名譽利養匿情變詐昧心厚顏指有言空指空言有見言不見不見言見聞言不聞不聞言聞知言不知不知言知作言不作不作言作欺誷賢聖誑惑世人至於父子君臣親戚朋舊有所談說未嘗誠實致使他人誤加聽信亡家敗國咸此之由妄語者全無影嚮設為欺誑故曰匿情指有言空直至如是妄語俱是匿情變詐昧心厚顏處瞞昧己心面目可羞故曰昧心厚顏成假妖幻每自稱讚謂得四禪四無色定安那般那妖幻者假借外道邪術以惑人也每自稱讚直管下旋風土鬼皆至我所句皆是自稱讚處得四禪謂得二字直管下十六觀故得須陀洹等得四禪者謂得四禪天定也初禪三天二禪三天三禪三天四禪九天色界共十八天也宗敬録云一作異計欣上厭下而修是外道禪二正信因果亦以欣厭而修是凡夫禪三了生空理證偏真道而修是小乘禪四達人法二空而修是大乘禪四無色定者謂得四空天之禪定也一空無邊處定二識無邊處定三無所有處定四非想非非想處定此四無色界空天故云四無色定安那般那見前十六行觀得須陀洹至阿羅漢得辟支佛不退菩薩十六行觀者論曰初根處名為暖法是總緣共相法念住差別如是所修能燒煩惱薪聖道火前相如鑽火位初暖相生能具觀察四聖諦境由此具修十六行相觀苦聖諦修四行相一非常若有還無故謂非常二苦隨逐相惱故謂之苦三空觀空本無故謂之空四非我不自在故謂之非我次觀集聖諦修四行相一因生相似果故謂之因二集能生流轉故謂之集三生能牽生死故謂之生四緣能相和合故謂之緣次觀滅聖諦修四行相一滅生死相違故謂之滅二靜除煩惱火故謂之靜三妙勝一切法故謂之妙四離能捨生死故謂之離又次觀道聖諦修四行相一道能至非品故謂之道二如不顛不倒故謂之如三行聖足所履故謂之行四出永超生死故謂之出總上觀四聖諦修四行相名為十六行觀行者修此暖已次起頂法猶如山頂人不久住若無諸難必過此山至于彼山若遇諸難即便退還若無諸難必到于忍既入忍位于四諦境極堪忍故次起世第一法世中絶勝故如是觀四諦境總修十六行相漸近見諦善根無即緣欲界若聖諦境而生無漏法忍此之忍故名為法智得四禪四無色安般那十六行觀是謂得行向得須陀洹中間該括斯陀含阿那含以至阿羅漢得辟支佛不退菩薩是謂得果以學入者須陀洹斯陀含阿那含無學入者阿羅漢辟支佛有學者謂學意未滿故學無學者謂阿羅漢辟支佛諸自利行修學以成惟應作他利益事故金剛經云須陀洹名為入流斯陀含名一往來阿那含名為不來阿羅漢有三義謂應供殺賊無生辟支佛謂獨覺出無佛世菩薩具云菩提薩埵華言覺有情天來龍來神來鬼來旋風土鬼皆至我所顯異惑衆求其恭敬四事供養如是妄語所起罪業無量無邊今日至誠皆悉懺悔天龍神鬼不能常見旋風即今所謂鬼陳風土鬼者鄉土中鬼也求其恭敬二句正照應上希求名譽利養之意四事供養即飲食衣服臥具醫藥涅槃名為四愛又復無始以來至於今日以綺語業作種種罪言辭華靡翰墨艷麗文過飾非巧作歌曲形容妖冶摸寫淫態使中下之流動心失性耽荒酒色不能自返或恣任私讐忘其公議彼雖忠臣孝子志士仁人強作篇章文致其惡後世披覽遂以為然令其抱恨重泉無所明白如是綺語所起罪業無量無邊今日至誠皆悉懺悔綺語者文飾裝點即巧言善謔翰華文藻淫詞艷曲皆是華靡美而文秀艷麗新而光明所以能飾其非令人信伏看巧作形容摸寫無非好作聰明小奸小詐矯現聲色至于歌曲小說令人好樂致使耽荒迷戀而不能自返也恣任私讐者恣意任性不念正人君子移是掇非設陷防而必染污之無處伸解致使重泉抱恨無所明白也又復無始以來至於今日以兩舌業作種種罪面譽背毀巧語百端向彼說此向此說彼惟知利己不顧害他讒閒君臣誣毀良善使君臣猜忌父子不和夫妻生離親戚疏曠師資恩喪朋友道絶至於交扇二國渝盟失歡結怨連兵傷殺百姓如是兩舌所起罪業無量無邊今日至誠向十方佛尊法聖衆發露求哀皆悉懺悔兩舌者面是背非彼此搆釁者也猜忌疑惑懼恨之辭也此只因其讒毀故五倫之道二國之好使之各各疑惑不明乃至于懷冤結恨無由解釋者皆在于斯如惟知利己不顧害他云云願承是懺悔口四惡業上來披誠懺悔已竟下發願而求口四善業之功德所生功德生生世世具八音聲得四辨才常說和合利益之語其聲清雅一切樂聞善解衆生方俗言語若有所說應時應根令彼聽者即得解悟超凡入聖開發慧眼懺悔發願已歸命禮三寶佛有八音顯揚論云一極好音二柔軟音三和適音四尊慧音五不女音六不誤音七深遠音八不竭音四辨才者一義辨顯了諸法之義二法辨稱說法之名字三詞辨能說名之語言四樂說必須樂說前三出光明大辨往昔所有口業由于無智慧無辨才故今求常說和合利益等語發願宜爾方俗言語四方風俗華夷土音鄉語各各不同善解衆生者如九天禽語九地獸言亦在其內前云先懺身三次懺口四其餘諸障次第披陳故下六根次第披陳之文也前已懺悔身三口四業竟今當次第懺悔六根所作罪障某等無始以來至於今日此下先舉六根罪相而懺悔也或眼為色惑愛染玄黃紅緑朱紫珍玩寶飾或取男女長短黑白之相姿態妖艷起非法想此列眼根相或耳貪好聲宮商絃管伎樂歌唱或取男女音聲語言啼笑之相起非法想列耳根相宮商絃管之聲不出五音宮商角徵羽也或鼻藉名香沉檀龍麝金蘇合起非法想列鼻根相麝香狸也或舌貪好味鮮美甘肥衆生血肉資養四大更增苦本起非法想列舌根相四大者一地大謂堅凝質礙二水大謂潤下滋愛三火大謂炎上生瞋四風大謂鼓籥操動又六大云五空大謂不見邊表六識大謂萬法本源殺食衆生血肉而資養四大來生益多苦報故曰更增苦本或身樂華綺錦繡繒縠一切細滑七珍麗服起非法想列身根相或意多亂想觸向乖法列意根相由此六根所造罪業無量無邊今日至誠向十方佛尊法聖衆皆悉懺悔已懺六種罪相竟下發願求成六種功德願以懺悔眼根功德願令此眼徹見十方諸佛菩薩清淨法身不以二相不二相者無眼色二相也淨名云有佛世尊得真天眼常在三昧見諸不以二相什曰不為色作精粗二相肇曰真天眼謂法身無相之目萬色彌目有若目前未嘗不定未嘗不見故無眼色之二相也願以懺悔耳根功德願令此耳常聞十方諸佛賢聖所說正法如教奉行願以懺悔鼻根功德願令此鼻常聞香積入法位香捨離生死不淨臭穢維摩經云上方界分過四十二恆河沙佛土有國名衆香佛號香積其國香氣比于十方人天之香最為第一香積如來無文字說法但令菩薩各各坐香樹下聞斯妙香即獲一切德藏三昧故願聞香積入法位香又香積如來一切菩薩身諸毛孔皆香願以懺悔舌根功德願令此舌常餐法喜禪悅之食不貪衆生血肉之味泥洹經云佛問福罽得何法喜對曰比丘力藍坐于樹下時五百乘車過人問曰見羣車否答曰不見又問聞車聲否答曰不聞曰時臥耶言我不臥時在道耶其人歎曰車聲𭰔𭰔覺而不聞用心何專難有乃爾深嘉其志遂得法喜參禪入悟則妙法自怡禪理悅心是為法味飽滿故齊儀云當願衆生禪悅為食法喜充滿者以此蓋曰以法喜禪悅為食也維摩云雖復飲食而以禪悅為味增一云出世五食一禪悅食二願食三念食四解脫食五法喜食也孟子云既飽以德言飽乎仁義也所以不願人之膏粱之味也空門以法喜禪悅為食不以飲食為味當與此參看願以懺悔身根功德願令此身披如來衣著忍辱鎧臥無畏牀坐法空座法華經法師品云入如來室著如來衣坐如來座爾乃應為四衆廣說斯經如來室者一切衆生中大慈悲心是如來衣者柔和忍辱心是如來座者一切法空是修如來寂滅法有佩服義故云衣忍辱為堅固義故云鎧鎧者金甲也處衆無畏為安樂義故云牀四空禪為靜定義故云座願以懺悔意根功德願令此意成就十力洞達五明深觀二諦空平等理從方便慧入法流水念念增明顯發如來大無生忍五明者大論云一聲明謂釋詁訓字銓目流別二工巧明技藝機關陰陽歷數三醫方明禁呪間邪藥石針灸四因明考定邪正研核真僞五內明究暢五乘因果妙理此五明必願洞達二諦者一世俗諦二第一義諦也世俗諦者佛事門中不捨一法如勸臣以忠勸子以孝勸國以治勸家以和弘善示天堂之樂治惡顯地獄之苦皆依俗諦第一義者彰本寂之理一性渾然實際理地不受一塵指萬有為真如會三乘歸實際此依第一義諦也此二諦及空平等理俱願深觀具足十力五明二諦空平等理則為方便慧而非乾慧矣由此方便慧而起十妙行云云十妙行者一色心不二境妙行二內外不二智妙行三修性不二行妙行四因果不二位妙行五染淨不二法妙行六依正不二感應妙行七自他不二神通妙行八三業不二說法妙行九權實不二說法妙行十受潤不二利益眷屬妙行此十妙行也因不二故為妙行十妙行總是方便慧處而生起入法流水者楞嚴云欲愛乾枯根境不偶純是智慧乾有其慧名乾慧地欲習初乾未與如來法流水接即以此心流入圓妙妄想滅盡中道純真名信心住便能起十妙行便是與如來法流水接境界即所謂流入圓妙是也大無生忍無生者即不生不滅之法而曰忍者此法將證未證如忍事人非懷非出故名為忍大無生忍者此如來一乘無上之法也故曰大發願已歸命禮常住三寶發願總懺之結懺也慈悲水懺法卷中西蜀九隴有泌其泉厥名三昧滌冤愆迦諾啓真源清淨通玄其法廣流傳音釋復應後文應於京切音英後凡應當之應俱平聲觀行上古玩切音貫下胡孟切去聲遠離上於怨切音淵遠之也去聲下力地切音利漸相遠也凡遠之離之皆去聲王四王于放切音旺據其身臨天下而言曰王則去聲長養上止兩切音掌下以兩切陽上聲障學文般北末切音鉢數息數所主切上聲樂說樂魚教切去聲觸向文轗軻上苦感切音坎下口我切音可縈于平切音營排步皆切音牌一闡提文闡齒善切音憚毀呼對切去聲忌其人而毀之則去聲戾力濟切音利八王去聲粗倉胡切音粗殺害文已字巳書正體不釋尋徐心切為于貴切音位蝮蠍上方六切音福下許竭切音歇虎螫人麞止兩切音張麋大于鹿有角麞小于鹿無角熊羆上胡容切音雄下布眉切音𢍉弶其亮切強去聲撥北末切般入聲彈射射常亦切音石若射物而言則入聲𮊁公土切音古網之總名蜆呼典切音顯蚌步頃切音棒又去聲亦同竄七亂切場夷益切音亦儈古外切音膾推通回切退平聲著直略切坑塹上丘更切同坑下七艷切籤去聲壞古外切音怪凡物不自敗而毀之則音怪磓磹上都回切音堆下徒念切甜去聲𨎿轢上查無此字或是輘下郎狄切音歷轣車陵踐也亦未可知蠱公土切音古蚋儒稅切音芮掐嚙上苦洽切嵌入聲下五考切音咬桁械上胡剛切音杭下胡戒切音懈桎梏也拉落合切音蠟掠力灼切音略打字義當音都領切音頂從手從丁不知因何轉為丁雅切然俱解擊也二音俱可從蹴子六切音足踏達合切談入聲劫盜文不道之道杜到切去聲治也言也與道德之道音杜稿切者不同罹力之切音離估公土切音古豉時吏切音示六書從叔繒慈陵切音情摘側格切音窄取也誷文紡切音網誣也拓他各切音托推開也殂叢租切音徂銖尚朱切音殊合古沓切音閣斷徒管切團上聲常雨之雨羊遇切去聲自上下曰雨淫欲文嘲陟交切爪平聲桎梏上職日切音質足械也下百祿切音谷手械也口四文鴝鵅上居侯切音鈎下各𪃭切音格僧惡之惡烏故切去聲獷古勇切公上聲詈力地切音利正斥曰罵旁及曰詈銜胡嵓切音鹹黷杜谷切音讀斥昌石切音尺擯也文過文致二文無悶切去聲飾也摸莫胡切音模強丘兩切羌上聲抑人使從我也披篇夷切音批渝容朱切音俞變也六根文鼻皮意切音避今讀入聲者非麝神夜切音射縠胡谷切音斛注音釋觀因緣文注餌如至切去聲釣啖魚者繭吉典切堅上聲觀果報注汩古忽切音骨沒也紺古暗切甘去聲除障注盲眉庚切音萌易以智切音異迅思晉切音信疾也殑渠京切音擎楞盧登切音冷平聲差初加切音嗏撓乃交切音鐃聖道注滲所禁切森去聲漏也杲古老切高上聲日出也業力甚深注歹多改切戴上聲好之反也迍與屯同迍邅另力正切音令莫見切音面販方諫切翻去聲賤買貴賣耳三十二相注輻方六切音福縵謨官切滿平聲跟古痕切音根腨上演切善上聲足肚也腋夷益切音亦頰古協切音劫面旁睫即涉切音接八十好注纖思亷切音暹細微也踝戶瓦切華上聲足兩旁內外曰踝逶迤上烏魁切音威下延知切音夷臍前西切音齊殺業注逞丑郢切稱上聲矜而自呈也叨也刀切音滔躲丁可切多上聲黏魚占切音嚴竄七亂切豢胡慣切音宦揣楚委切吹上聲阱疾正切音淨蟻語綺切音疑囹圄上離呈切音陵下偶許切音語笞抽知切音鴟鞭笞也踘居六切音掬盜業注酷枯谷切音哭售除留切音酬戍色豫切音恕訛五禾切音囮傳謬也鬻余六切音欲賣也殞羽敏切音允歿也淫業注悍侯幹切音翰強狠也馴詳均切音巡鐐連條切音聊肘止酉切周上聲口四注鵋䳢上忌寄切音忌下去其切音欺咀再呂切睢上聲釁許慎切欣去聲六根注籥弋灼切音藥罽吉器切音記𭰔許容切音胸詁公土切音古通古今之言而明其故也銓丑緣切音詮衡也量也度也
