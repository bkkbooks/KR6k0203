front:
  text: 慈悲道場水懺原敘凡謂聖教制作未有無所感而為之者也昔唐懿宗時有悟達國師知玄者邂逅迦諾尊者於京師叢林尊者化身示迦摩羅疾眾皆嫌惡惟知玄師殷勤顧問略無厭色欲分袂尊者感其風義祝之曰向後有難可往西蜀彭州九龍山相詣其山有松為誌無何知玄師以道德昭著懿宗親臨法席稱為國師復賜沉香為座恩渥甚厚自爾忽生人面瘡於膝上眉目口齒俱備每以飲食餧之則開口吞啖與人無異徧召名醫皆不能治因記昔日尊者之語入山相尋果見二松於煙雲間即趍其所崇樓廣殿金碧交輝尊者顧接甚歡遂以所苦告之尊者曰無傷也巖下有泉濯之當愈命童子引至泉所方掬水間其瘡大呼曰且未可洗師曾讀漢書袁盎晁錯傳乎師曰曾讀既曾讀寧不知盎斬錯於東市其冤為何如哉累世求報於師而師為十世高僧戒律精嚴報不得其便今師受人主寵遇過奢名利心起於德有損故能害之師即袁盎吾即晁錯也適蒙迦諾尊者洗我以三昧法水自此不復與師為冤矣國師凜然魂不住體其痛徹髓絕而復甦瘡亦不見回顧殿宇忽然如失師遂卓菴於所修懺文三卷由歷劫因果之不昧舉世受報之有徵葢取三昧水洗冤業為義故名曰水懺緣起文恭聞水懺僧寶建言迦諾尊者澍三昧中之法流悟達國師洗十生前之罪垢觀心空處隨形孽影全消掬水灌時劇報惡瘡尋滅已釋生生莫解之冤必懺佛佛無赦之罪譬如藥中服其善見是病皆瘳照中耀其神光無幽不燭者矣玄公既感遇聖師願施仁末世由是錄諸佛之洪名采羣經之玄義俾展演者轉冤家如眷屬敬禮者變罪藪為福田茲者要祈業海波平仰叩覺王必蒙加被例言六經之有註疏內典之有譯解由來久矣顧註經多而註懺少此何說歟竊以竺乾立教既開懺悔一門則懺從何懺悔從何悔必當使懺文大義綱舉目張肌分擘解然後四眾聞之心地頓開言言有會科註之役師正欲如上所說肩仔勿辭也至其寒暑罔間既竭苦心而證據則援引諸經攷究又悉本大藏即或有未註或云再考者皆係闕疑初非忽略講過又講之疵固無庸其重複杜撰臆見之陋絕未敢為私增懺文文有長短註亦詳略不齊今科註長段處既依總科分為段落其短段註法恐前後繙檢猝難理會槩遵藏本諸品經典少指頭緒覽者徐可得之以云挂一漏萬則不敢辭若言飾智炫奇失之遠矣憶師業儒授經即留心內典後因家難洊至拋棄世緣禮超凡大師於金峨授記為賢首法嗣雖常隨大師之請都講執事如陳婆渡與江心定橋洎今龍住皆躳自陞座者也科註之成師固夙有弘願然起於某年某月者嚮未前聞竣於丁卯年臘月者因師病篤絕筆註懺高閣未及啟講不無遺哀但素衷少遂而法寶流通繼往開來亦窺見一斑矣懺文三卷首簡俱有贊佛偈四句今首兩卷不註獨註末卷師遵古本科註仍註末卷不及註者病篤而止識者幸勿附和忌嫉吾師者翻前刻心經脫略之案妄肆譏評要當自具重瞳萬母為彼魔嬈內典難字向俱音註極易攷詳然亥豕魯魚舛譌正復不免今科註悉本字彚細心訂核繕寫工梓既便唪持亦通書法一切音韻筆畫務歸典雅並不侏𠌯捐資剞劂固佛祖之光明隨力捨施亦檀那之福慧卷內如心蓮湯子首先頓施外其四眾兩錢分計咸各彚登刻之卷首洵與受報酬之盛舉矣若師高足唯一匍匐善門錙銖不爽總期龍象永耀貝葉常榮勞不可忘名應均附旹在康熈己巳初秋穀旦傳人龍伯寅倪培基筦生湯建章心蓮楊靈伊即中徐行睿二魯周嗣炳旦如聞靈瑞璘友同識釋本生契山寂乾行觀成式蓮因重隆祖定同校水懺總科水懺科大分分二初總出懺名二正陳懺文二初敘述分二初證信二初序說懺由一切引經證成良以二發起四初略序罪因凡夫二泛指罪相不信三約懺三世過去四求證佛聖是故二正說分二初懺悔門三初標章總示三障三初顯益勸歸禮諸二示相令懺是故三略陳罪相二初起障之因今日二除障之緣三初列數定名然其二勸修獲益所以三運心審滅四初另標七種是故二徵名列類何等三牒名別釋七初慚愧三初牒第一二釋自惟三結此實二恐怖三初牒第二二釋此是三結如此三厭離三初牒第三二釋相與三結生死四發心三初牒第四二釋經言三結欲得五平等三初牒第五二釋於一三結以分六報恩三初牒第六二釋如來三結我等七性空三初牒第七二釋罪無三結故知四結上勸誡二初勸如法之得生如二誡不如法之失三初反明誡怠若復二引喻誡迷且復三引經誡覆經中二追前略釋三障二初由藉所言二結懺是故三分章廣釋三障三初煩惱障六初推煩惱根本四初標障所起第一二因申三毒意業三果感五趣是故四結令懺悔是故二出煩惱過患二初諸聖所呵夫此二結令懺悔是故三明煩惱造罪二初列數分懺六初三數四初明時處某等二列相或因三結罪如是四陳懺今日二四數四初明時又復三結罪如是二列相或因四陳懺今日三五數四初明時又復二列相或因三結罪如是四陳懺今日四六數四初明時又復二列相或因三結罪如是四陳懺今日五七數四初明時又復二列相或因三結罪如是四陳懺今日六總數四初明時又復二列相或因三結罪惱亂四陳懺今日二發願總懺二初承前申願願某二禮佛結願發願四示煩惱懺悔四初承前起後禮諸二立懺之意五初牒名夫論二釋義本是三出過人之四誡覆但智五獲益若能三行懺之法二初策三業若欲二發二心三初標舉生二二念無常一者三念正法二初不修善二者二復造惡五初諸聖難瞞而今二怨證莫解夫論三業無可隱如經四報無人代於是五策勵及時我等四結令懺悔是故五列煩惱名目六廣煩惱行障二業障三報障二迴向門五列煩惱名目二初列數分懺二初原因某等二列數五初懺十使二初列相或躭二陳懺今日二懺十三隨又復三懺三乘於苦四結罪無量五陳懺今日二發願總懺二初承前申願二初離過某等二成德修八二禮佛結願懺悔已竟六廣煩惱行障五初承前起後禮諸二策修觀行三初及時勉進某等二徵名標觀何等三疊名別釋四初觀因緣三初牒名第一二釋義知我三結觀以是二觀果報三初疊名第二二釋義所有三結觀此亦三觀自身三初疊名第三二釋義雖有三結觀我今四觀如來三初疊名第四二釋義無為三結觀雖復三總念懺悔生如四沓陳名數三初原因某等二列障六初三寶起障二三世起障三人天二初三界障受二六結障不四二乘六初七方便障安二心慧慈悲三三觀空平四道品助道五禪定八解六智定于十五菩薩七初說通三三二六度六度三四攝四攝四四弘大乘五明行十明六向願十𢌞七十地初地六佛果障佛三懺如是五發願總懺二初承前申願二初成德四初成勝報願藉二廣修行以如三得定慧於諸四善說法樂說二斷惑二初永斷令此二頓悟無漏二禮佛結願發願二業障二初顯業報四初承前起後禮諸二示不明業力夫業三因不達業理五初正明何以二標徵何以三疊釋現報四詳明若今五引證所以四令行懺獲益過去二列業相二初總相懺三初懺悔三初列相四初總明某等二犯重或作三犯輕優婆四雜舉於諸二結罪如是三陳懺今日二發願二初離過某等二成德常習三結願歸依二別相懺二別相懺三初承前起後某等二別中總舉若總三別中別列二初總標別相二分列二初牒標身三二分釋五初身業三初殺二初列罪分懺六初食噉二初引經證罪二初傷慈第一二苦報二初略明苦報二初明報又言二悔罪然所二備明苦報二初三塗是故二人類若生二結懺令除二初結罪殺害二陳懺是故二種種殺四初殺因某等二殺業或破三結罪如是四陳懺今日三畜類三初傷生或以二苦相使其三警迷但使四人類三初列相二初人類又復二雜類或塞二結罪如是三陳懺今日五微命三初列罪又復二無知凡夫三陳懺今日六刑獄三初列罪又復二陳罪如是三陳懺今日二發願總懺三初拔苦願承二與樂然後三結懺我今二盜三初承前起後禮諸二列罪分懺二初總舉以勸四初出過經中二顯報致使三結罪劫盜四陳懺是故二別釋令懺六初官民物二初列罪自從二陳懺如是二三寶物二初列罪又復二陳懺如是三親隣物二初列罪又復二陳懺如是四百姓物二初列罪又復二陳懺如是五交易物二初列罪又復二陳懺如是六雜舉物二初列罪又復二陳懺如是三承懺發願二初四緣不缺願承二檀度同修一切三婬二初列罪分懺二初訶欲三初誡欲習次復二示苦報所以三陳懺悔婬欲二列罪二初出罪相又復二陳懺悔如是二發願總懺三初感勝報願承二修觀行了悟三結懺懺悔二口業三諸根四三寶五諸惡二口業三初承前起後前已二列相分懺二初總舉二初引經示報經中二結懺令除口業二別列四初惡口三初列相某等二結罪如是三陳懺今日二妄語三初列相又復二結罪如是三陳懺今日三綺語三初列相又復二結罪如是三陳懺今日四兩舌三初列相又復二結罪如是三陳懺今日三發願總懺二初感勝益願承二結懺懺悔三諸根三初承前起後前已二列相分懺三初列相或眼二結罪由此三陳懺今日三發願總懺二初感勝報願以二結懺發願四三寶三初承前起後禮諸二列相分懺二初總明三初引經證成經中二示苦令修于其三結懺令滅是故二別列五初慢佛三初列相某等二結罪如是三陳懺今日二輕法三初列相又復二結罪如是三結懺皆悉三紊法三初列相或眠二結罪如是三陳懺皆悉四蔑僧三初列相又復二結罪如是三結懺皆悉五攪眾三初列相或裸二結罪凡如三陳懺今日三發願總懺四初供養願生二勸請若有三修行于眾四結懺如上五諸惡五初承前起後今當二總舉誡勸二初引經誡罪如經二如法勸誡是故三列相分懺八初邪倒二初列相無始二陳懺如是二傲慢二初列相又復二陳懺如是三穢濁二初列相或嗜二陳懺如是四暴戾二初列相或貢二陳懺如是五貪誑二初列相或臨二陳懺如是六殘忍二初列相或捶二陳懺如是七放逸四初列相或放二結罪致使三示報墮大四陳懺是故八結懺向十四躡前結懺二初總舉向來二陳懺今日五發願總懺三初世界法願承二出世法遠離三結懺發願三報障二初承前起後禮諸二列相分懺二初總明九初引經示勸經中二指事作證何以三舉報警迷但凡四人命無常眾等五世事虗假但五六天福有盡天上七取譬世事如今八勸離罪報眾等九結懺令除是故二分列三初地獄二初列相分懺二初正獄四初總標某等二略說如經三結報如是四陳懺今日二餘獄四初列懺次復二示苦此中三憶苦南無四陳懺今日二發願總懺三初離苦願承二得樂等受三結懺懺悔二惡道三初承前起後禮諸二列相分懺四初人道三初列相經中二結報致使三陳懺是故二畜生三初列報次復二結報如是三陳懺今日三餓鬼三初列報次復二結報如是三陳懺今日四鬼神三初列報次復二結報如是三陳懺今日三發願總懺二初解脫二初分釋願承二總明願從二示現惟除三人天二初承前起後已懺二列相分懺二初略懺過現三初促命相與二原因如此三陳懺是故二廣懺現未三初列報無始二結報如是三陳懺某等二迴相門三初承前起後前已二正名迴相三初總舉前文某等二普及眾生二初現生得益二初感樂果現生二植善因正信二當來得益六初近佛捨此二遠魔願得三感勝又願四尚善又願五值聖又願六二利又願三上同諸聖如諸三統結迴相三初反明四法有盡虛空二正明修行無盡我此三總結歸敬三寶發願水懺總科終
