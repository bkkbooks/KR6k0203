body:
  text: 龍住寺成簡西宗集注讚文大慈大悲愍衆生大喜大捨濟含識相好光明以自嚴衆等志心歸命禮佛稱大慈悲父慈能與樂悲能拔苦慈悲而言大者世間父母亦有慈悲愛惜兒孫止在一世若子不孝背恩違義者心生恚恨慈心薄小不名為大諸佛菩薩慈心不爾見苦衆生悲心益重乃至入於無間地獄大火輪中代諸衆生受無量苦如是慈悲過於父母無量無邊故稱為大愍即哀愍憐念之謂也衆生指六道四生而言父精母血己靈種子乃至五陰四大衆法相生故曰衆生喜者慶他衆生離苦得樂捨者冤親平等無憎愛心濟者拔濟拯接之謂也含識抱識含靈之類即上六道衆生也此二句讚佛四無量心也佛之報身應身皆有三十二相八十種好八萬四千光明此讚佛之莊嚴也歸命者梵語南無此云歸命見佛悲願弘深即以身命竭誠而歸投之故云志心等禮者敬禮又禮即履也進也進退有度尊卑有分以卑敬尊故名曰敬禮先以此四句稱揚讚美於佛者總表發覺初心虔懇至誠之謂也慈悲水懺法卷下一切諸佛愍念衆生為説水懺道場總法今當歸命一切諸佛南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩普超三昧經佛言我今得佛皆文殊之恩本是我師過去無央數佛皆其弟子當來者亦是恩力所致文殊乃佛道中父母也爾時衆念文殊既在佛前何不成佛耶佛言文殊深入善權廣化衆生故未成道而又當知文殊三佛分三世成成佛已久誰曰不成過去龍種上尊王佛已成者是見在歡喜藏摩尼寶積佛亦算已成未來普見佛當成者是此出諸經亦非臆説也而今逆流度生故稱菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩南無大莊嚴菩薩南無觀自在菩薩菩薩受記經德藏菩薩白佛言觀世音得大勢至二大士於何國土成等正覺佛答阿彌陀佛正法滅後觀世音成等正覺號普光功德山王如來彼佛國土號曰衆寶善集莊嚴般涅槃後得大勢即於其國成等正覺號善住功德寶王如來勢至永不入滅更無所補也禮諸佛已次復懺悔上來已懺身三口四竟今當懺悔佛法僧間一切諸障此承前起後上懺三業中所造之罪已竟下懺悔佛法僧間業障三寶分中所造之業如下文云云然而三業六根乃至於三寶分中若福若業莫不出於自心自心清淨虔懇至誠珍敬無怠則無罪不滅無福不生否則雖云禮懺唱和相資欲求罪滅福生者亦恐未必然也思之經中佛説人身難得佛法難聞衆僧難值信心難生六根難具善友難得而今相與宿植善根得此人身六根完具又植善友得聞正法於其中間復各不能盡心精勤恐於未來長溺萬苦無有出期是故今日至誠求哀懺悔經中佛與阿難遊行歇息間以爪取土問阿難言爪上土多大地土多阿難答言爪上之土少許之甚大地之土無窮佛言得人身者如爪土之上失人身者如大地之土又云佛行偶至爪園取土喻之亦爾嗚呼我與衆等觀此人身難得之一言便應大生恐懼慚愧交心二六時中當觀得人身是何法得耶如是始與懺法相應正法念處經云五戒不持人天路絶五戒堅持人天交接正在於斯慎毋忽也所以人身難得今已得佛法難聞今正聞者盡皆宿德之所感當生慶幸必也盡心精勤至敬毋得因循怠惰而招下文種種之過𠎝也慎之上略明起障之由懺悔已竟下廣舉起障之由而盡情懺悔此由皆在不能盡心精勤一句直貫下文不能盡心恭敬乃至於三寶中種種過患無出於斯臨文自見某等自從無始以來至於今日常以無明覆心煩惱障意見佛形像不能盡心恭敬輕蔑衆生殘害善友破塔毀寺焚燒經像出佛身血或自處華堂安置尊像卑猥之處使煙熏日暴風吹雨露塵土污坌鼠毀壞共住同宿曾無禮敬或裸露像前初不嚴飾遮掩燈燭關間殿宇障佛光明如是等罪今日至誠皆悉懺悔初懺慢佛業障不能盡心恭敬者今人於三寶像前不肯禮拜供養正在於此也焚燒經像者如一切印造佛馬所造紙作皆是焚燒今道場事畢火化一切皆所不宜故雲棲法禁之不用也出佛身血者如調達推山之類今之佛面刮金之類亦是華堂岑樓邃閣之中卑猥者不淨之所塵翳也坌埲塕也埲塕塵起貌禮敬者禮佛一拜罪滅河沙無禮敬者安得無業也裸露裸身露體縷線不挂如是等皆不能盡心精勤以至如此下皆倣此又復無始以來至於今日或於法間以不淨手把捉經卷或臨經書非法俗語或安置牀頭坐起不敬或開閉箱篋蟲蠧朽爛或首軸脫落部帙失次或挽脫漏誤紙墨破裂自不修習不肯流傳如是等罪今日至誠皆悉懺悔次懺悔輕法業障法者即三藏十二部一切諸經教典之佛法也言不淨手者每於晨朝或未梳洗或大小行乃至執捉一切穢污之物者皆應洗盥如不洗盥總名不淨必須以清淨水而盥其手方許捧持經典所以教中有洗手偈呪詳明他處不引非法等者間言雜語以至惡俗粗談俱為非法俗語也金剛經云若是經典所在之處即為有佛汝既不敬豈無罪乎篋箱匣也或全卷或數卷為部一套為帙失次者顛倒無序之謂也挽脫漏誤者遺落不全之謂也破裂者字句殘缺也流傳流通人間為流傳傳轉也展轉無盡日流傳也或眠地聽經仰臥讀誦高聲語笑亂他聽法或邪解佛語僻説聖意非法説法法説非法非犯説犯犯説非犯輕罪説重重罪説輕或抄前著後抄後著前前後著中中著前後綺飾文詞安置己典或為利養名譽恭敬為人説法無道德心求法師過而為論義非理彈擊不為長解求出世法或輕慢佛語尊重邪教毀呰大乘讚聲聞道如是等罪無量無邊皆悉懺悔此紊法也眠地仰臥以下種種紊亂不敬之甚法即世出世間之正法非法即世出世間之邪法也非法説法六句正是邪解僻説處乃至云天堂是妄造地獄非真説酒肉不礙菩提淫欲不妨正性等言俱是邪解僻説之意也重即戒律中四棄八棄十波羅夷等輕即戒律中三十九十乃至四十八等輕也抄等四句可就上文輕重二句三等分之如律中前篇至重中篇稍重稍輕後篇純輕邪解者即以抄之將輕重等事混亂於後人者可知之矣智者詳之綺飾文詞安置己典者工於法語莊飾己意而竄入經典也求法師過至讚聲聞道正是為利養名譽無道德心處諸經要集云不以悲心利益衆生貪取財物或用飲酒或與女人共飲食自賣求財如是法施其果甚少生於天上作智慧鳥能説偈頌是名下品法施若為名聞為勝餘法師故而為人説法得報亦少生於天中受中異報或生人中是名中品法施若以清淨心為欲增長衆生智慧及令住正法不為財利如是法施自利利人無人最勝乃至涅槃其福不盡是名上品法施至於慳吝佛法不肯開示衆生障他慧明後生邊地無佛法處猶為過咎又復無始以來至於今日或於僧間有障殺阿羅漢破和合僧害發無上菩提心人斷滅佛種使聖道不行或剝脫道人鞭拷沙門楚撻驅使苦言加謗或破淨戒及破威儀或勸他人捨於八正受行五法或假託形儀窺竊常住如是等罪今悉懺悔次懺蔑僧業障五分律云調達不能害佛欲破其和僧佛語調達曰若僧已破能和合者其人生天若僧和合而破之者墮地獄中僧衆和合而故為誹謗離間謂之破阿羅漢和合僧無上菩提心人皆佛種也而弒之而破之而害之故曰斷滅佛種道人者是有道有德之人故曰道人亦即沙門之等類也破諸魔經佛云菩提有三種若人雖發菩提心但樂自利以求解脫故名聲聞菩提又雖發菩提心於大乘法不樂修習但起心念觀諸緣法隨所觀察而行故名緣覺菩提若復有人發生阿耨多羅三藐三菩提心已復勸他人發如是心於輪回身不生厭倦樂欲利樂一切衆生皆令解脫以己善利普施一切故名為無上菩提以上至此文同七逆可知梵語阿羅漢此云殺賊應供無生此三號也梵語沙門又云桑門三門等此云勤息勤修戒定慧息滅貪瞋癡攝心達本原故號為沙門云云八正見前五法者涅槃五種世法名世句世縛世法世執著是名世諦五法窺竊者瞰伺之謂也或裸露身形輕衣唐突在經像前不淨腳履踏上殿塔或著屧屐入僧伽藍涕唾堂房污佛僧地乘車䇿馬排揬寺舍凡如是等於三寶間所起罪障無量無邊今日至誠向十方佛尊法聖衆皆悉懺悔裸露赤體也赤身露體謂之裸露輕衣小衣小衣輕跳謂之唐突又唐突即搪𠊲不遜也比丘不著三衣禮拜亦名輕衣唐突屧屐也又履中薦也屐木屐又履為無跟涼履屐為腳靸而套經云著屐見佛生馬蹄國梵語僧伽藍此云衆園清衆所居之處也排揬推排衝突輕觸之謂也願生生世世常值三寶尊仰恭敬應有厭倦天繒妙綵衆寶纓絡百千伎樂珍異名香華果鮮明盡世所有常以供養若有成佛先往勸請開甘露門若入涅槃願我常得獻最後供上懺悔竟下發願成德説法度人是為甘露開甘露門即轉法輪也甘露名不死藥食之長生不死喻若得佛法即證不生不滅常住之法故云甘露云爾門通出入義令人出生死入佛法門故也獻最後供考經律異相云佛臨入滅有拘尸城工巧之子名曰純陀泣告世尊我等從今無主無救貧窮困苦欲從如來求將來食惟願哀憐攝受我等微供然後涅槃佛言我今為汝斷除貧窮以無上法雨雨汝身田令生法芽令汝具足檀波羅蜜純陀號哭復白大衆同共禮勸佛莫涅槃佛告純陀諸佛法爾有為亦然速辦所施不宜久停是時天人皆來奉供佛悉不受大衆唱言善哉純陀成就大福我等供具則為唐捐世尊欲滿衆望一一毛孔化無量佛一一諸佛各有無量諸比丘僧悉皆受供釋迦如來自受純陀所奉設者食滿八斛以佛神力皆悉充足一切大衆於衆僧中修六和敬得自在力興隆三寶上弘佛道下化衆生六和者一身和同住二口和無諍三意和同悅四戒和同修五見和同解六利和同均修此六和匪敬弗得故曰修六和敬所以云無不敬者亦此意也如上所説於三寶間輕重諸罪皆以懺悔其餘諸惡上結懺下結前起後之文其餘諸惡蓋謂如上所説説所不盡故又言其餘今當次第復更懺悔承前起後如經中説有二健兒一者自不作罪二者作已能悔又有二種白法能為衆生滅除衆障一者慚自不作惡二者愧不令他作有慚愧者可名為人若不慚愧與諸禽獸不相異也是故今日至誠歸依於佛如法懺悔此引經文如法勸誡健者精進自強之謂白者潔白純淨之詞顯密圓通云白法功德只須慚愧二種能為衆生滅除衆障不須財寶而自成就此功德故云白法慙愧二字亦即智信之意也無始以來至於今日或信邪倒見殺害衆生解奏魑魅魍魎鬼神欲希延年終不能得或妄言見鬼假稱神語如是等罪皆悉懺悔此邪倒列相懺悔下皆因無智不信無慙無愧故有邪倒等種種過惡直貫下文正懺上若不慚愧等二句魑魅者老物之精山澤之怪魍魎大力鬼也欲希延年當知非但不得延年抑且難免地獄之苦妄言見鬼假稱神語者如關亡捕鬼重子女巫開堂附體及關神亂語之類如是等罪者陳懺也後同又復無始以來至於今日或行動傲誕自高自大或恃種姓輕慢一切以貴輕賤用強凌弱或飲酒鬬亂不避親疏惛醉終日不識尊卑如是等罪今悉懺悔此傲慢列相懺悔傲者慢也倨也誕者放也種姓者種族尊勝自恃高貴自高自大等以貴輕賤二句釋上輕慢一句經云飲酒者過失無量若持酒器與人飲者五百世中無手何況自飲何況鬬亂等云云乃至教人飲者犯輕垢罪飲酒犯三十六種失大藏一覽云不孝父母輕慢長上不敬三寶不信經法誹謗沙門訏露人罪恆説妄語誣人惡事傳言兩舌惡口傷人致病之根鬪諍之本惡名流布人所憎嫌排斥聖賢怨黷天地廢忘事業破散家財恆無慚愧不知羞恥無故捶打奴婢橫殺衆生姦淫他妻偷人財物疏遠善人狎近惡㕛常懷恚怒日夜憂愁牽東引西持南著北倒溝臥路墮車墮馬逢河落水持燈失火暑月熱亡寒天凍死此是三十六種失也或嗜飲食無有期度或食生鱠或噉五辛熏穢經像排揬淨衆縱心恣意不知限極疏遠善人狎近惡友如是等罪今悉懺悔此穢濁列相懺悔嗜欲也好也鱠魚鱠生鱠或鯹羶之物五辛梵網經云一大蒜二茖蔥即韭薤三慈蔥即家蔥四蘭蔥即小蒜五興蕖即胡荽為之五辛附食辛有五失一多過熟食發淫生噉增恚二天遠縱能説法諸天遠離三鬼近鬼舐神𠯳常與鬼住四福消福德日消長無利益五魔集魔來説法非毀禁戒排揬淨衆者臭氣觸穢一切齋戒善友等衆故也或貢高矯假偃蹇自用跋扈抵揬不識人情自是非他希望僥幸如是等罪今悉懺悔此暴戾列相懺悔矜滿才能為貢高矯情飾詐為矯假怠緩率意為偃蹇自用自強自逞肆無忌憚為跋扈抵揬總是不隨順之意也凡其所有不當得而濫叨得者謂之僥幸或臨財無讓不廉不恥屠肉沽酒欺誑自活或出入息利計時賣日聚積慳尅貪求無厭受人供養不慚不愧或無戒德空納信施如是等罪今悉懺悔此貪誑列相懺悔屠刳也殺也屠者割肉知牛之長少沽者買也梵網經云若佛子自沽酒教人沽酒沽酒因沽酒緣沽酒法沽酒業是酒起罪因緣菩薩應生一切衆生明達之慧而反生衆生顛倒之心者波羅夷罪出入息利者放債盤折積算子母錢謂之出入利息本為父母利即如子故云息也而今世人放債取利月不過五等説謂之計時賣日尅積貪求也無淨戒之德而納受檀信之布施則信施難消故曰空納信施淫殺盜妄飲酒昏迷乃至上文臨財無讓欺誑自活等者一總名為無戒無德也或捶打奴婢驅使僮吏不問飢渴不問寒暑或發撤橋梁杜絶行路如是等罪今悉懺悔此殘忍列相懺悔或放逸自恣無記散亂摴蒱圍棊羣會屯聚飲酒食肉更相擾餞無趣談話論説天下從年竟歲空喪天日初中後夜禪誦不修懈怠懶惰尸臥終日於六念處心不經理見他勝事便生嫉妒心懷慘毒備起煩惱致使諸惡猛風吹罪薪火常以熾然無有休息三業微善一切俱焚善法既盡為一闡提墮大地獄無有出期是故今日至禱稽顙向十方三寶皆悉懺悔此放逸列相懺悔摴蒲博戲也即賭賽之具圍棊堯造丹朱善之酒者儀狄作酒醪杜康作秫酒食肉者梵網經云斷大慈悲犯輕垢罪又食肉有十過一覽云一一切衆生無始以來皆是己親二食肉人衆生見即驚怖三壞他信心四慈心薄少五增惡羅剎習氣六令學呪術不行七衆生身命於己無別八諸天賢聖遠離惡神恐怖九不淨所出十死墮惡道擾者亂也攪也餞送行之燕初中等者欲求無上菩提宜應晝夜禪誦精勤不可暫時怠惰而無空喪可也故遺教經云汝等比丘晝則勤心修習善法無令失時初夜後夜亦勿有廢中夜誦經以自消息無以睡眠因緣令一生空過無所得也禪者梵語禪那此云息寂息慮忘緣體究自心頓悟無生之理即今謂之參禪也誦者持呪誦經念佛等是也因不修習而墮昏沉散亂生死二病之中豈非空喪天年虗延歲月者乎見他勝事者即念佛參禪持誦等事六念者念佛為慈悲導師念法為三世佛母念僧為人天福田念天為長壽安樂念戒為清淨身心念施為普濟貧窮是為六念心不經理者於此處懈怠毫無警醒可知惡業屬風煩惱怒氣屬火因積習業風所扇罪火熾焰燒斷菩提徑路故曰一切俱焚三業微善者上言諸惡不出十惡等業今之微善不出五戒十善惡勝善微故曰俱焚此乃嫉妒煩惱之所害也梵語一闡提此云退沒善心亦云信不具向來所有一切衆罪若輕若重若粗若細若自作若教他作若隨喜作若以勢力逼迫令作如是乃至讚歎行惡法者今日至誠皆悉懺悔總指上文其餘罪業重求懺悔而發露之願承是懺悔一切諸惡所生功德生生世世慈和忠孝謙卑忍辱知廉識恥先竟問訊修良正謹清潔義讓遠離惡友常遇善緣收攝六情守護三業捍勞忍苦心不退沒立菩提志不負衆生發願已歸命禮諸佛上來總申懺悔已竟願承下發願成德慈和至義讓是世界法遠離至衆生是出世法下結懺經云謙下諸比丘遠離自高心道生於卑退德生於安和故云爾知恥近乎勇其意亦在斯矣修良正謹修順良導不生違忤之心正直謹莊了無恣情偏曲等也惡友行十惡之人善緣五戒十善之行回光反照攝念歸真故云收攝等六情眼耳鼻舌身意六根之識稱為六情識情分別起貪愛等故也捍即勇猛精進之謂也若依文看來中卷宜此處完以懺悔業障竟故也南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩寶積文殊云願我成佛之時以恆沙諸佛世界為一佛剎名為普見諸菩薩言文殊所得佛剎與彌陀佛剎等不世尊告言譬如有人析一毛為百分以一分於大海中取一滴水喻彌陀佛剎莊嚴彼大海水喻普見佛剎莊嚴復過於是南無普賢菩薩南無大勢至菩薩南無地藏菩薩南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔向來已懺悔煩惱障已懺悔業障所餘報障今當次第披陳懺悔上懺煩惱業障已竟此處懺悔果報障果報之中有地獄報畜生報餓鬼報阿修羅報更有人天之中無量餘報皆為果報從此逐一次第懺悔經中説言業報至時非空非海中非入山市間無有地方所脫之不受報唯有懺悔力乃能得除滅此引經言以示勸四不可得經云兄弟四人學仙得五神通宿對來至自知壽盡各自念神足飛騰所至無礙各以神通力而自避死於是一踊空中藏形一入市中人多無覓之處一入大海三百三十六萬里下不至底至於其中一劈開山隱形石間自謂無常之對無從而覓以後死俱不免入空者死墮於地如果熟落入市者死於衆中入海者死為魚鱉所食隱山者死為禽獸所噉佛既觀知謂此四人欲捨宿對三毒未除安脫此患何以知然釋提桓因五衰相現恐懼切心歸誠三寶五相即滅得延天年如是等比經教所明其事非一故知懺悔實能滅禍此指一事以作證驗譬喻經云有帝釋天五德離身自知福盡甚大憂愁念三界中濟人苦厄唯有佛耳往到佛所時佛坐禪入普濟三昧大帝作禮伏地志心三歸佛法聖衆未起之間其命忽出便至陶家驢母腹中作子時驢自解走瓦壞間踐壞坯器其主打之尋時傷胎其神復反還為天帝佛三昧覺讚言善哉能於殞命之際歸命三尊罪對已畢更不勤苦佛為説法得須陀洹道涅槃經云諸天五衰相一頭上華萎二腋下汗出三衣常垢染四身體臭穢五不樂本座此大五衰必死之相又俱舍云衣服絶香身光忽滅浴滴沾身本性囂馳兩目眴運此小五衰遇勝緣猶可解非定死相也今得延天年必是小五衰釋提桓因即釋帝也故知懺悔等直至文盡皆是䇿發激勵後昆必自知其業障重深定應懺悔而滅之免其後悔難追之患也但凡夫之人若不值善友獎導則靡惡而不造致使大命將盡臨窮之際地獄惡相皆現在前當爾之時悔懼交至不預修善臨窮方悔悔之於後將何及乎殃禍異處宿預嚴待當獨趣入到地獄所但得前行入於火鑊身心摧碎精神痛苦如此之時欲求一禮一懺豈可復得此舉報以警迷人獎勸也稱譽也又助也導引也啓迪也窮極也究竟也殃禍猶言災害異處者輕重各異其報也人未命終一生宿業冥府已預分明故罪業之報宿預嚴待宿者宿昔預先嚴者嚴明以待罪人之至也趣疾也又督迫也鑊鼎鑊釜屬火鑊即地獄之所也此下䇿進激勵於後人也衆等切莫自恃盛年財寶勢力懶惰懈怠放逸自恣死苦一至無問老少貧富貴賤皆悉摩滅奄忽而至不令人知夫人命無常喻如朝露出息雖存入息難保云何忽此而不懺悔此言人命無常正云臨窮方悔悔無所及處當知無常迅速生死難期無常忽到欲懺無及乘此無病正宜精進切勿以少年且得自寬致令後悔先賢有云莫待老來方學道孤墳盡是少年人摩滅即消滅也奄忽即倏忽也息一呼一吸為一息故有出入息甚言其速也金剛經云一切有為法如夢幻泡影如露亦如電應作如是觀云何忽此句懺主痛責之詞學人母得種種放過而不解之也慎夫哉慎夫哉但五天使者既來無常殺鬼卒至盛年壯色無得免者當爾之時華堂邃宇何關人事高車大馬豈得自隨妻子眷屬非復我親七珍寶飾乃為他玩以此而言世間果報皆為幻化此言一切世事皆是虗假五天據增一阿含經云須彌山半有四種天毗沙門天王將諸夜叉毗留波叉天王將諸鬼神毗留勒天王將諸魔鬼提頭賴吒天王將諸乾沓和等又婆沙論云自四天王已下有日月天星宿天常憍天持鬘天堅首天此為五天上天所敕為天使冥司所遣為殺鬼又閻羅王請問經云生老病死刑為五天使者其文甚詳古云三寸氣在千般用一日無常萬事休縱有華堂等用與我了不相關故曰何關人事亦指自言也到此地位世間樂事皆非我有迷者不思厭離而求出世反生貪戀更增苦本非復我親者先賢俚語云夫妻一似同林鳥大限來時各自飛七珍金玉珠寶珊瑚琥珀瑪瑙等玩弄也戲也好也他玩於己無益徒為他有幻化幻者西域幻術之法依草木等幻作人畜宛似往來動作之相須臾法謝還成草木法喻各開五法喻中五者如結一巾幻作一馬一所依巾二幻師術法三所幻馬四馬有即無五癡執為馬法中五者一真性二識心三依他起四我法即空五迷執我法一切世間有為之法無不例然故云幻化也天上雖樂會歸敗壞壽盡魂逝墮落三塗是故佛語須跋陀言汝師頭藍弗利根聰明能伏煩惱至於非非想處命終還作畜生道中飛狸之身況復餘者故知未登聖果已還皆應輪轉備經惡處如不謹慎忽爾一朝親嬰斯事將不悔哉此云天福有盡梵語須跋陀羅此云好賢唐言善賢梵語頭藍弗此云猛喜又云極喜仙人之名也頭藍弗果報智度論云陀羅伽仙人得五神通飛到王宮王夫人接足而禮夫人手觸即失神通從王求車駕而出更修五通一心專志而鳥鳴以亂其意次詣水邊求定復聞魚鬬即生瞋恚曰我當盡殺魚鳥此人久後得定生非非想天後彼壽盡下生報為飛狸殺諸魚鳥作無量罪墮三惡道狸之伎倆止可殺魚今為飛狸併殺飛鳥以遂其惡致墮惡道嗔時一念可不慎哉聖果即無上涅槃妙果嬰受也又觸也如今被罪行詣公門已是小苦情地障惶眷屬恐懼求赦百端地獄衆苦比於此者百千萬倍不得為喻此以世事小苦喻大陽間官府小苦尚知可畏地獄衆苦比之無量而反不畏不預修善豈不大愚而更大錯者也豈不懼哉豈不畏哉下舉衆發歎已上大槩言罪報必不可免故須懺悔力方得除滅已下正言地獄中一切惡相惡報今日至誠求哀懺悔衆等相與塵劫以來罪若須彌云何聞此安然不畏不驚不恐令此精神復嬰斯苦實為可痛此苦勸脫離罪報云人生無有無罪豈可不謹慎而不懺悔可傷可痛是故至誠求哀懺悔結懺令除已上懺悔業障已竟下文懺悔報障有四先懺地獄罪報某等從無始已來至於今日所有報障然其重者第一唯有阿鼻地獄地獄衆苦説不可盡至於阿鼻猶為極重阿者言無鼻者言遮阿者言無鼻者言救合言無遮無救即無間地獄也下正説阿鼻獄中惡相惡報受苦無量如經所明今當略説其相此獄周匝有七重鐵城復有七重鐵網羅覆其上下有七重鐵刀為林無量猛火縱橫八萬四千由旬罪人之身遍滿其中罪業因緣不相妨礙上火徹下下火徹上東西南北通徹交過如魚在𨫼脂膏皆盡此中罪苦亦復如是經楞嚴經地獄中無非是銅是鐵是石是火阿鼻獄乃八大獄之一謂斬活黑繩石磕叫喚大叫喚焰熱大焰熱阿鼻獄前七者各濶五百由旬唯阿鼻獄三十二萬里前七者各壽千歲唯阿鼻獄王壽二萬歲俱治第一根本極重罪謂弒父母弒阿羅漢破和合衆逼姦淨尼出佛身血而阿鼻之罪所犯猶重人間六十小劫此獄方為一晝夜故曰甚重者第一阿鼻地獄故謂阿鼻獄王即此直為縱橫為廣梵云由旬此云限量猶言此方之驛大者八十里中者六十里小者四十里為一由旬因本經佛告諸比丘於四大洲八萬小洲諸餘大山須彌山王之外外有一山名日鐵圍高六百八十萬由旬縱廣亦爾彌密牢固金剛所成難可破壞此鐵圍外復有一重大鐵圍山高廣正等兩山之間極大黑暗無有光明日月具有八大地獄謂活大地獄黑大地獄合大地獄叫喚大地獄大叫喚大地獄熱惱大地獄大熱惱大地獄阿鼻至大地獄此八大地獄各各復有十六小地獄周匝圍繞而為眷屬皆縱廣五百由旬謂黑雲沙地獄糞屎泥地獄五叉地獄飢餓地獄燋渴地獄膿血地獄一銅釜地獄多銅釜地獄鐵鎧地獄函量地獄雞地獄灰河地獄斫截地獄劍葉地獄狐狼地獄寒冰地獄除上八大獄復有十次地獄文長難録又次之則有孤獨地獄此獄在閻浮提諸處或曠野山間或海畔廟中有八萬四千座苦報轉輕壽亦不定所攝有情上下品十惡來生其中偈曰閻浮地濶七千旬處處皆有孤獨獄或在山林曠野中或在大海江河畔或在城隍社廟間所攝上品下惡罪湯火刀兵雖各具時日年月減前科隨因感果苦多端眷屬八萬如經説地獄猛火等相大抵如十習因中淫習之所感更兼瞋習之所招後楞嚴經可知如魚者引喻法而人難受可知鏊餅鏊槃脂膏戴角者脂無角者膏又曰凝者脂釋者膏總皆身中潤澤之物而可盡乎上來根本地獄如州司牢獄邊處地獄如縣道牢獄孤獨地獄如場鎮鎖杻之屬其城四門有四大銅狗其身縱廣四千由旬牙爪鋒長眼如掣電復有無量鐵嘴諸鳥奮翼飛騰噉罪人肉牛頭獄卒形如羅剎而有九尾尾如鐵叉復有九頭頭上十八角角有六十四眼一一眼中皆悉迸出諸熱鐵丸燒罪人肉然其一瞋一怒哮吼之時聲如霹𮦷此明獄中獸類形狀甚可怖畏掣電者言其紅光閃爍故如掣電奮者勇也發忿騰躍之勢耳復有無量無邊刀輪空中而下從罪人頂入從足而出於是罪人痛徹骨髓苦切肝心如是經無數歲求生不得求死不得如是等報今日皆悉稽顙慚愧懺悔此皆惡業所感之報不可不知也今皆稽顙慙愧者懺悔已上阿鼻獄報已下乃是懺悔其餘諸獄如刀山劍樹以至八萬四千鬲子地獄之類如是等報即同經中十因六報大略相同楞嚴經云一切衆生自業所感造十習因受六交報云何十因一者淫習交接發於相磨故有猛火鐵牀銅柱諸事二者貪習交計發於相吸故有寒冰吒吒波波諸事三者慢習交陵發於相恃馳流不息故有血河灰河銅灌諸事四者瞋習交衝發於相忤忤結不息心熱發火鑄氣為金故有刀山劍樹斧越諸事五者詐習交誘發於相調引起不住故有繩木絞校杻械諸事六者誑習交欺發於相罔誣妄不止飛心造姦故有塵穢沒溺諸事七者恐習交嫌發於䘖恨故有擒捉擊射諸事八者見習交明發於邪業薩迦耶見邪悟諸業故有王吏推鞫諸事九者枉習交加發於誣謗故有合山耕磨諸事十者訟習交喧發於覆藏故有業鏡對驗諸事云何六報一切衆生六識造業所招惡報從六根出一者見報招引惡果此見業交則臨終時先見猛火滿十方界亡者神識飛墜乘煙火入無間獄發明二相一者明見見種種惡生無量畏二者暗見寂然不見生無量恐如是見火燒聽能為鑊湯煬銅燒息能為黑煙紫焰燒味能為燋丸鐵糜燒觸能為熱灰爐炭燒心能為星火迸灑二者聞報此聞業交則臨終時先見波沒天地神識乘流入無間獄發明二相一者開聽種種閙亂二者閉聽寂無所聞如是聞波注聞則能為責為詰注見則能為雷為毒注息則能為雨為蟲注味則能為膿為穢注觸則能為畜為鬼注意則能為電為雹推碎心魄三者嗅報此嗅業交則臨終時先見毒氣充塞神識從地涌出入無間獄發明二相一者通聞惡氣熏心二者塞聞不通悶絶如是嗅報衝息則能為質為履衝見則能為火為炬衝聽則能為沒為溺衝味則能為餒為爽衝觸則能為綻為爛衝思則能為灰為瘴四者味報此味業交則臨終時先見鐵網周覆神識下透挂網倒懸入無間獄發明二相一者吸氣結冰凍裂二者吐氣為火燋爛如是嘗味歷嘗則能為承為忍歷見則能為然金石歷聽則能為利兵刃歷息則能為大鐵籠歷觸則能為弓為箭歷思則能為熱鐵雨五者觸報此觸業交則臨終時先見四山來合無復出路神識被驅入無間獄發明二相一者合觸合山逼體二者離觸身心屠裂如是合觸歷觸則能為廳為案歷見則能為燒為熱歷聽則能為撞為擊歷息則能為拷為縛歷嘗則能為耕為鉗歷思則能為煎為炙六者思報此思業交則臨終時先見惡風吹壞神識被吹上空旋落墮無間獄發明二相一者不覺迷極荒走二者不迷覺知則苦如是邪思結思則能為方為所結見則能為鑒為證結聽則能為冰為霜結息則能為火車火檻結嘗則能為叫為喚結觸則能為大為小為一日中萬死萬生是名地獄十因六果皆是衆生迷妄所造自業之所招感也次復懺悔刀山劍樹地獄身首脫落罪報懺悔鑊湯爐炭地獄燒煮罪報懺悔鐵牀銅柱地獄焦然罪報懺悔火車地獄劈礫罪報懺悔拔舌犁耕地獄楚痛罪報刀山等者亦即十習之中瞋習之所招感也云云爐炭者亦是六交報中見火之所招感也礫小石也研碎之意也懺悔吞噉鐵丸煬銅灌口地獄五內消爛罪報懺悔鐵磨地獄骨肉灰粉罪報懺悔黑繩地獄肢節分離罪報懺悔灰河沸屎地獄惱悶罪報懺悔鹹水寒冰地獄皮膚拆裂裸凍罪報五內即五臟也灰粉者以繩牽扯如世間分尸之例也懺悔豺狼鷹犬地獄更相殘害罪報懺悔刀兵距爪地獄更相搏撮斫刺罪報懺悔火坑地獄炮炙罪報懺悔兩石相磕地獄形骸碎破罪報懺悔衆合黑耳地獄解剔罪報或豺害於犬犬害於豺故云更相等距爪者雞距爪鷹之類雞距凡刀鋒有倒刺皆曰距趙廣漢善為鉤距鉤之有距吞之則順吐之則逆使人入其術中而不能出以鉤索其隱情也搏手擊斫刀斬搏撮斫刺皆受苦之狀磕石相築聲衆合黑耳者或有衆物相合黑暗耳目更有鋸解刀剔之苦懺悔暗冥肉山地獄斬銼罪報懺悔鋸解釘身地獄斷截罪報懺悔鐵棒倒懸地獄屠割罪報懺悔焦熱叫喚地獄煩冤罪報懺悔大小鐵圍山間長夜冥冥不識三光罪報懺悔阿波波地獄阿婆婆地獄阿吒吒地獄阿羅羅地獄自上至下種種地獄受如是苦各各之所不同者皆有牛頭獄卒馬面夜叉等各以大力追逐驅逼而使之然也然而皆衆生業力之所招感本非天降亦非人與當自知之而莫自昧也波波婆婆吒吒羅羅俱寒獄中忍寒之聲也如是八寒八熱一切諸地獄中復有八萬四千鬲子地獄以為眷屬如是者總上地獄而言八熱即八獄阿鼻即其一也惟阿鼻獄至大故云獄之王八寒獄一頞部陀二尼剌部陀此二從寒逼身皰裂立名三頞折吒四嚯嚯婆五唬唬婆此三從寒苦痛發聲立名六嗢鉢羅七鉢特摩八摩訶鉢特摩此三從身裂如三種蓮華立名一青蓮二紅蓮三大紅蓮此為八寒獄無遊增八熱獄一等活謂斬刺磨搗吹活等二黑繩謂以黑繩綳量後方斬鋸三衆合謂苦具衆至合黨相殘四嘷叫謂衆苦所逼悲嘷發聲五大叫極苦所逼謂大叫稱怨六炎熱謂炎逼身轉極苦難堪七極熱內外自他身出猛火互相燒害八阿鼻趣果受苦時命及形五皆無間此八熱獄每一獄各有四門每門各有四獄謂煻煨尸糞鋒刃烈河增也一獄既有十六則八獄總有一百二十八皆名遊增連八大獄其成一百三十六座有情遊彼其苦增苦故名遊增自行十惡五逆感八大地獄教他行逆惡感十六眷屬遊增獄八萬等者鬲子地獄梁皇懺略見八萬四千未曾具陳以為眷屬者以為同類之謂謂八寒八熱大地獄中總有一百二十八遊增獄即此一切諸地獄中復有八萬四千鬲子地獄正與大獄相為表裏互為分屬合此衆苦而成大獄故曰眷屬正與大獄小獄相合而成之如人之有大小眷屬然耳非真有眷屬也諸地獄中者以其為主以為眷屬者如主有從者故云眷屬此中罪苦炮煮楚痛剝皮刷肉削骨打髓抽腸拔肺無量諸苦不可聞不可説南無佛刷者刮也掃也削者刮削皆剮剔之意懺悔至此寧不駭汙南無佛心心念念早辦資糧急為改革勿致此苦資糧即所修福智是也人間五百歲地獄方為一晝夜壽命一千歲則無始已來經生父母倘受重罪者竟不知其凡幾矣此尚小獄為然況阿鼻獄王人間六十小劫此獄方一晝夜壽命二萬歲受苦何所窮極更有無量無邊不可思議之長時難以説盡可不痛惜也哉不為預辦資糧不速為漸愧改革地獄之苦宿預嚴待可不懼哉經云念佛一聲滅八十億劫生死重罪懺主敘至於此稱南無佛者以至極悲深痛地獄之中一切苦惱衆生無非無始惡業因緣以至於此然而非唯一切或我無始以來未必不然所以總申懇禱念佛發露求哀懺悔願乞除滅離諸苦惱得解脫樂也今日在此中者或是我等無始以來經生父母一切眷屬我等與彼命終之後或當復墮如此獄中今日洗心懇禱叩頭稽顙向十方佛大地菩薩求哀懺悔令此一切罪報畢竟消滅已上憶苦懺悔地獄報竟下即發願離苦得樂願承是懺悔地獄等報所生功德即時破壞阿鼻鐵城悉為淨土無惡道名其餘地獄一切苦具轉為樂緣刀山劒樹變成寶林鑊湯爐炭蓮華化生牛頭獄卒除捨暴虐皆起慈悲無有惡念地獄衆生得離苦果更不造因等受安樂如第三禪一時俱發無上道心懺悔已至心信禮常住三寶離喜妙樂為三禪人間最樂無有過者三禪謂三禪天一少淨天二無量淨天三遍淨天此三天已無男女淫欲以禪定法喜為食所以説更不造因等受安樂如第三禪也發無上道心即發阿耨多羅三藐三菩提心也梵語阿耨云云者華言無上正等正覺南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛南無袈裟幢佛南無師子吼佛南無文殊師利菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔已懺地獄報竟今當懺悔三惡道報承前啓後此下懺悔果報中三惡道報即下畜生道餓鬼道修羅道是也兼上地獄名四惡道經中佛説多欲之人多求利故苦惱亦多知足之人雖臥地上猶為安樂不知足者雖處天堂猶不稱意但世間人忽有急難便能捨財不計多少而不知此身臨於三塗深坑之上一息不還便應墮落此懺人道出其多求不足慳吝之苦代為懺悔此處三塗且指地獄餓鬼畜生而言文義不在修羅故也忽有知識勸營功德令作未來善法資糧執此慳心無肯作理善知識者憐其罪苦故來勸彼令修善法使之滅罪乃至於修戒修定修慧作種種福德者亦俱可稱善法資糧也夫如是者極為愚惑何以故爾經中佛説生時不賫一文而來死亦不持一文而去苦身積聚為之憂惱於己無益徒為他有無善可恃無德可怙致使命終墮諸惡道賫即齎裝也送也行道所用也既不益己縱是自有還成他有因慳貪故無善無德故生惡道也是故今日歸命三寶至誠懺悔上總明慳貪苦報懺悔竟下別開三道次第披誠懺悔先懺畜生道次復懺悔畜生道中無所識知罪報懺悔畜生道中負重牽犁償他宿債罪報懺悔畜生道中不得自在為他斫刺屠割罪報懺悔畜生道中無足二足四足多足罪報懺悔畜生道中身諸毛羽鱗甲之內為諸小蟲之所唼食罪報如是畜生道中有無量罪報今日至誡皆悉懺悔此懺畜生道畜生道如楞嚴經云是諸衆生若於本因貪物為罪遇物成形名為怪鬼物銷報盡生於世間多為梟類酬足為人參合頑類貪色為罪遇風成形名為魃鬼風銷報盡生於世間多為咎徵酬足為人參合異類貪惑為罪遇畜成形名為魅鬼畜死報盡生於世間多為狐類酬足為人參合庸類貪恨為罪遇蠱成形名蟲毒鬼蠱滅報盡生於世間多為毒類酬足為人參合狼類貪憶為罪遇衰成形名為癘鬼衰窮報盡生於世間多為蛔類酬足為人參合微類貪傲為罪遇氣成形名為餓鬼氣銷報盡生於世間多為食類酬足為人參合柔類貪罔為罪遇幽成形名為魘鬼幽銷報盡生於世間多為服類酬足為人參合勞類貪明為罪遇精成形名魍魎鬼精銷報盡生於世間多為應類酬足為人參合文類貪成為罪遇明成形名役使鬼明滅報盡生於世間多為休徵酬足為人參合明類貪黨為罪遇人成形名傳送鬼人亡報盡生於世間多為循類酬足為人參合達類次復懺悔餓鬼道中長受飢渴百千萬歲不聞漿水之名罪報懺悔餓鬼食噉膿血糞穢罪報懺悔餓鬼動身之時一切肢節火然罪報懺悔餓鬼腹大咽小罪報如是餓鬼道中無量苦報今日稽顙求哀皆悉懺悔上懺畜生道竟次懺餓鬼道餓鬼道者如正法念處經云餓鬼險惡之業由心貪嫉欺誑於人貪惜積聚欲望長富廣積衆惡不行布施沙門婆羅門及諸病瘦盲瞑貧窮有來乞求心生慳嫉不肯施與不作功德不持禁戒以是因緣墮餓鬼中復次若有衆生受他寄物抵拒不還生於彼處一者人中住若人夜行則有見者二者在閻浮提下五百由旬有住海中有住海渚惡道眷屬其數無量略言有三十六種且舉七八種一者炬口口出猛火肢節煙生二者針咽腹大如鼓項頸如針形狀苦瘦三者臭口口氣臭惡臭不可聞四者大癭頸生癭瘤噉彼膿血五者針毛出毛如針轉刺身體六者臭毛身毛臭穢而不堪聞七者得棄食人所棄以充飢餓八者得失物失不堪方得就喫一日一夜比人間十年如是五百歲名為一生腹大咽小者針咽鼓腹之徒焰口焦身之輩即此類也次復懺悔一切鬼神修羅道中諛諂憍詐罪報懺悔鬼神道中擔沙負石填河塞海罪報懺悔鬼神羅剎鳩槃茶諸惡鬼神生噉血肉受此醜陋罪報如是鬼神道中無量無邊一切罪報今日稽顙向十方佛大地菩薩求哀懺悔悉令消滅次懺阿修羅道阿修羅此云非天由前因中雖願得天身而不信正業福田力故智度論云欲界衆生三種善根上分天道果報中分人道果報下分修羅果報修羅結使腹心心多邪曲得道甚難諸天雖隨結使直心信道修羅雖則與天相似以其近道難故故在人下天之怨敵名阿修羅王於欲界中化身大小隨意能作楞嚴經云阿修羅有四種若於鬼道以護法力成通入空此阿修羅從卵而生鬼趣所攝若於天中降德貶墜其所卜居鄰於日月此阿修羅從胎而出人趣所攝有修羅王執持世界力洞無畏能與釋梵四天爭權此阿修羅因變化有天趣所攝下劣修羅生大海心旦遊虗空暮歸水宿此阿修羅因濕氣有畜生趣攝前阿修羅王住大海底須彌山側所住之城名曰光明縱廣八千由旬壽五千歲一日一夜比人間五百歲諛諂面從曰諛侫言曰諂憍恣也逸也縱肆也詐偽也詭譎也羅剎是食人鬼亦是噉精氣鬼人心中有七滴甜水和養精神鬼噉一滴令人頭痛三滴悶絶七盡即死一心持呪者即脫此難鳩槃茶是可畏鬼願承是懺悔畜生等報所生功德生生世世滅愚癡垢自識業緣智慧明照斷惡道身上懺三報已竟此發願求成三道之功德滅惡生善必承懺法而入也因愚癡無慧故受畜生身報今得智慧一念醒悟即可斷畜生惡道身而生人天善道愚垢既除畜生報盡或生天上或生人間慧性開明自識業緣果報必不更受於畜生者莫非懺悔之功亦自知之也願以懺悔餓鬼等報所生功德生生世世永離慳貪飢渴之苦常餐甘露解脫之味願以懺悔鬼神修羅等報所生功德生生世世質直無諂離邪命因除醜陋果福利人天梵語阿修羅此云非天有天福而無天行故又云無酒等其形極醜常與諸天鬬戰力不勝故但彼縛故又云具縛有四如上所明為利養故現奇特相或高聲現威令人畏敬此則心多邪曲皆邪命因也今既質直無諂是即離邪命因修正因緣自然除醜陋果得端正報乃至於自利利他亦承懺法之力而得如是也願從今以去乃至道場決定不受四惡道報唯除大悲為衆生故以誓願力處之無厭鬼畜修羅兼前地獄故云四惡道報此下懺果報中人天餘報已懺三塗等報今當復次稽懇懺悔人天餘報相與稟此閻浮壽命雖曰百年滿者無幾於其中間盛年夭枉其數無量但有衆苦煎迫心形愁憂恐怯未曾暫離已懺云云者承前起後相與稟此云云分懺過現促命閻浮具云南閻浮提此云穢樹盛年夭枉者或少年橫死之流是也此皆有業而未及懺悔之報如此皆是善根微弱惡業滋多致使現在凡有所為皆不稱意當知悉是過去已來惡業餘報所致是故今當懺悔此分懺過現原因善根微弱故有盛年夭枉等苦也以下一切罪報正明凡有所為皆不稱意處人間惡報無非衆苦煎逼心形者是無始以來至於今日所有現在及以未來人天之中無量餘報上先明餘報之由竟下正舉無量餘報罪業總申懺悔也懺悔人間流殃宿對癃殘百病六根不具罪報懺悔人間邊地邪見三惡八難罪報懺悔人間多病消瘦促命夭枉罪報懺悔人間六親眷屬不得常相保守罪報懺悔人間親友凋喪愛別離苦罪報此廣懺現未列報流者流落殃即災殃此因無始宿業縱修善法而得人身惡業未盡猶有流落餘剩之殃故曰流殃宿對等云耳六根眼耳鼻舌身意不能完具三惡者惡大惡惡中惡惡者人以惡加己還以惡報之大惡者人不侵己無故加害於人惡中惡者人來恭敬供養不念報恩而反害之八難者生於邊地邪見之家便不知三寶一地獄二餓鬼三旁生此又名三惡道亦在八難數中四盲聾瘖啞五世智辨聰六佛前佛後七北俱盧洲此四者在人道中八無想天此八者有一于此不得見佛聞法總名八難出淨名疏不得常相保守者父母兄弟妻子中有一死別生離便是凋瘁也焦瘁也懺悔人間冤家聚會憂愁怖畏罪報懺悔人間水火盜賊刀兵危險驚恐怯弱罪報懺悔人間孤獨困苦流離波迸亡失國土罪報懺悔人間牢獄繫閉幽執側立鞭撻拷楚罪報懺悔人間公私口舌更相羅染更相誣謗罪報幼而無父曰孤老而無子曰獨流離波迸亡失國土無家可歸困苦非常幽執側立在牢獄之中不得自在而鞭撻也彼此互相綺飾文詞乃至彼此惡言加謗故曰更相等懺悔人間惡病連年纍月不差枕臥牀席不能起居罪報懺悔人間冬瘟夏疫毒癘傷寒罪報懺悔人間賊風腫滿否塞罪報懺悔人間為諸惡神伺求其便欲作禍祟罪報懺悔人間鳥鳴百怪飛尸邪鬼偽作妖異罪報差病瘳也毒癘秋間瘧癘春患傷寒此言四季之中嘗懷病苦者如法華云水腫乾痟疥癩癰疽如是等病以為衣服者是也痞氣隔不通也邪風漲滿痞塞纏綿等病直至下文種種罪報無非過去之餘殃也伺偵候也探伺也崇神禍也尸死者在牀曰尸飛尸即怪異百怪等者或即毗陀羅起尸之類便是懺悔人間為彼虎豹豺狼水陸一切諸惡禽獸所傷罪報懺悔人間自縊自刺自殺罪報懺悔人間投坑赴火自沉自墜罪報懺悔人間無有威德名聞罪報懺悔人間衣食資生不能稱心罪報懺悔人間行來出入有所運為值惡知識為作留難罪報如是現在未來人天之中無量禍橫災疫厄難衰惱罪報虎猛獸豹似虎圜文豺狼屬狼似犬皆惡獸也縊絞也自經死也刺穿也傷也聞聲譽也皆不稱其所為故云留難已上等報正所謂但有衆苦煎逼心形愁憂恐怯未曾暫離者此也人間有此許多不稱意正緣善根微弱惡業滋多故有此等苦報可不生大慙愧大恐怖以哀求懺悔也某等今日至誠向十方佛尊法聖衆求哀懺悔願皆消滅上來懺悔三障已竟下文總申發願求成功德前已懺悔三業六根一切煩惱障一切業障四生六道一切報障今當次第發願回向承前起後下正名回向某等願以此懺悔三障所生功德悉皆回向施與一切衆生俱同懺悔願與一切衆生現生之內身心安樂三災八難不吉祥事咸悉消除衣食豐饒此普及衆生現生感樂果飢饉疾疫刀兵為三小災火劫水劫風劫為大三災此特以小三災言之耳八難見前毗婆沙論云人能一日一夜持不殺戒於未來世決不逢刀兵災若以一訶梨勒果起殷淨心奉施病僧於當來世決不逢疾疫災若一摶之食起殷淨心奉施僧衆於當來世決定不逢飢饉災正信三寶捨此報身皆得往生極樂世界親覲彌陀得授記莂當來世中見彌勒佛聽聞正法如教進修正信三寶句亦普及衆生現生植善因信此一乘無上之法為正信也捨此以下是普及衆生當來近佛捨此者前生所作惡業善業今生此身正為來受苦樂之報故為報身死即捨此形命而往故曰捨此報身彌陀佛國清淨人民種種快樂皆是阿跋致不比五濁惡世也見小彌陀經莂者禾稻秧種字義從草從別禾秧為草中別一佳種故曰莂以喻授記即作佛秧故曰得授記莂也彌勒佛國其地平正無有山陵溪谷人民衆多少貪淫瞋恚愚癡壽皆八萬四千歲面目桃華色彌勒龍華三會説法初會度九十六億萬人二會度九十四億萬人三會度九十二億萬人彌勒佛住世六萬歲正法如是像法亦復如是願得生生世世在在處處常值國王興降三寶不生外道邪見之家此普及衆生當來遠魔外道邪見即不得興隆也又願生生世世在在處處蓮華化生種族尊勝安隱快樂衣食自然此普及衆生當來感勝從此懺法功勳更加一心念佛以淨其心在處佛土悉皆清淨所以不受父母胞胎常在蓮華托質耳若必蓮華化生種族不止豪貴高門若據此二句劣者猶在化樂天宮勝者必生十方淨土更觀下文可見也又願生生世世在在處處慈仁忠孝等心濟物不生一念逆害之心此普及衆生當來尚善也又願生生世世在在處處常為諸佛之所護念能降魔怨及諸外道與諸菩薩俱會一處菩提道心相續不斷此普及當來值聖也淨印法門經云以無所為心即能降諸魔當知有四知苦能降蘊魔斷集能降煩惱魔證滅能降死魔修道能降天魔婆沙論云斷慧命故名魔復次常行放逸而害自身故名魔魔者殺也華嚴會上第二十一位知識遍行外道告善財言閻浮提內九十六種外道各起異見而生執著我悉於中方便調治令其捨離所有諸見乃至普及十方世界悉亦如是楞嚴注云悟道之人一生衆裏與道相應不作三業所以不受三界死生又一乘人常入生死度生實由道力所資不染三界根本煩惱來往自由又願生生世世在在處處興顯佛法修行大乘分身無量救度衆生直至道場無有退轉此普及當來自利利他華嚴云雖復現身於世中生而於世法心無所著不同凡夫永沒三界又不同二乘求出三界方知學佛人能免生死義在於斯乃無生死可免無三界可出觀四生如一子等三界於同仁故也分身無量如法華經云我分身謂佛在於十方世界説法者今應當集云云如諸佛菩薩所發誓願所修福智所行回向我亦如是發願修集回向此上同諸聖發誓願者如四弘誓願等修福智即福慧雙修回向有十一者救護一切衆生離衆生相回向度無所度二者不壞回向壞其可壞遠離諸離故三者等一切佛回向覺齊佛覺四者至一切處回向發明無地五者無盡功德藏回向身土涉入六平等善根回向同於佛因七等觀一切衆生回向性同衆生八真如相回向不即不離九無縛解脫回向十方無礙十等法界無量回向性得圓成虗空界盡衆生界盡衆生業盡衆生煩惱盡統結回向反明四法有盡我此修行回向終無有盡正明修行無盡發願回向已至心信禮常住三寶總結歸敬三寶已上如是十種回向楞嚴廣明茲不繁引然而人回向者回因向果回小向大乃至回向真如實際莊嚴無上佛果菩提經云回己施衆生皆共成佛道正此意也此中言如是回向虗空界盡等言如懺悔文云乃至虗空世界盡衆生及業煩惱盡如是四法廣無邊願今回向亦如是所以説我此回向終無有盡也發願已而更信禮常住三寶者當知前來一部懺文所説無量無邊一切罪業欲求懺滅者畢竟全憑十方常住三寶廣大威德神通之力己躬一念竭誠之力始得罪業消融福慧增長直至成就無上菩提無出於此故也我衆等欲求懺法當於三寶己躬之處宜盡心焉慎毋忽耳慎毋忽耳倘或稍有一念輕微便是虗搆文言非但不能益於理亦恐不能益於事也思之慈悲水懺法卷下終懺如浣滌以水為名至心頂禮罪根清罪滅福由生慧日昭靈覺海性圓澄音釋佛法僧間後文毀亦去聲曝步木切音僕坌步悶切盆去聲裸魯果切羅上聲赤體也篋乞協切音怯軸直六切音逐帙直質切音姪書衣經套也挽武綰切音晚引肯苦等切同肯抄楚交切同鈔謄寫也著直略切附也置也呰祖此切音子殺式吏切音試下殺上曰弒著職略切音灼屧悉協切音燮屐竭戟切音極其餘文魑抽知切音鴟摴抽居切音摳蒱蓬晡切音匍相見上息亮切去聲下形甸切音縣殺所界切音曬疾也卒蒼沒切村入聲忽也速也邃須兌切音歲鼻皮意切音避無入聲掣敕列切音徹礫即狄切音力搏伯各切音博手擊也磕充合切石相築聲斫職略切音酌鬲各鵅切音格同隔讀力者曲腳之鼎三惡道文營于平切音刑賫俗齎字𦎗西切音韲今書此字已久不可改矣唼色洽切音霎鳧雁聚食也人間文差楚懈切音蠆病瘳也聞無悶切音問聲譽曰聞莂必列切音別注音釋讚佛偈分無悶切去聲卑猥注埲蒲孔切塕烏孔切翁上聲盥古玩切音貫以盆洗手曰盥套他到切滔去聲紊文運切音問亂也窺竊注瞰苦濫切音闞俯視曰瞰伺息恣切音四察也靸悉合切糝入聲乩堅溪切音雞卜以問疑飲酒注黷杜谷切音讀黑也垢也生鱠注羶尸連切扇平聲羊臭也蒜蘇貫切音算茖各鵅切音格山蔥也韭薤上居有切音九下下戒切音械荽蘇回切音綏亦葷也舐上紙切侍上聲吻武粉切音刎口脣邊曰吻屠沽注刳空胡切音枯醪郎刀切音牢秫食律切音術稷之黏者衰相注壞鋪梅切音丕未燒陶瓦殞羽敏切音允歿也萎烏胃切音穢飯牛也眴輸慎切音舜目動搖也地獄注皰披教切嚯忽郭切音霍唬虗交切音哮嗢與喔同音屋喉咽也搗都稿切刀上聲綳補耕切音崩煻煨上徒即切音堂下烏魁切音威煨燼盆中物也剮剔上占華切寡平聲剔肉置骨也下他力切音惕解也鞫居六切音掬推窮罪也嗅許救切休去聲畜生注魃蒲末切音旱神魅莫佩切音妹蛔于媯切音為魘於檢切音掩餓鬼注癭瘤上庚頃切音頴下力求切音留肉起病也懺悔注剩時正切音盛餘也八難之難去聲瘁秦醉切音萃瘳丑鳩切音抽痞普弭切音披氣隔不通偵候上丑正切稱去聲下與矦同崇須兌切音歲神禍也圜于權切音圓
