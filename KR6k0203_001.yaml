body:
  text: 龍住寺成簡西宗集註讚文天上天下無如佛十方世界亦無比世間所有我盡見一切無有如佛者啟運慈悲道場懺法啟運者啟懺時便要一心運想道場者修道之場也此慈悲道場懺法方能利益眾生葢建此慈悲道場以有慈悲懺法故又道場二字有事有理事則於阿蘭若以香華燈燭等事而施設莊嚴等處者是也理則虔懇至誠清淨心中者是也懺者梵語懺摩此云悔過懺謂止斷未來非悔謂已恥心於往犯故云已作之罪願乞消除未起之惡更不敢造故名懺也法者軌持為義軌則軌生物解持則任持自性亦總不出自利利他之道謂之法也一心歸命三世諸佛一純潔精專之謂也人雖自能懺悔又必求佛濟故要一心歸命諸佛過去未來現在是為三世以下八佛正三世佛也南無過去毗婆尸佛梵語毗婆尸又名維衛此云勝觀釋迦於是佛出世初種相好故為七佛之首作付法偈曰身從無相中受生猶如幻出諸形像幻人心識本來無罪福皆空無所住乃過去莊嚴劫第九百九十八尊佛南無尸棄佛梵語尸棄此云持髻作付法偈曰起諸善法本是幻造諸惡業亦是幻身如聚沫心如風幻出無根無實性乃過去莊嚴劫第九百九十九尊佛也南無毗舍浮佛梵語毗舍浮此云徧一切自在偈曰假借四大以為身心本無生因境有前境若無心亦無罪福如幻起亦滅乃是過去莊嚴劫第一千尊佛也南無拘留孫佛梵語拘留孫此云所應斷偈曰見身無實是佛身了心如幻是佛幻了得身心本性空斯人與物何殊別乃現在賢劫第一尊佛也初減人壽六萬歲時出成佛道為賢劫千佛之首也南無拘那含牟尼佛梵語拘那含牟尼此云金寂仙偈曰佛不見身知是佛若實有知別無佛智者能知罪性空坦然不怖於生死此現在賢劫第二尊佛次減人壽四萬歲時出成佛道南無迦葉佛梵語迦葉此云飲光偈曰一切眾生性清淨從本無生無可滅即此身心是幻生幻化之中無罪福此現在賢劫第三尊佛也人壽減至一萬歲時出成正覺賢劫中第九小劫南無本師釋迦牟尼佛梵語釋迦牟尼此云能仁寂默仁慈化導利他之號寂默證真利己之名自利利他故云能云云偈曰法本法無法無法法亦法今付無法時法法何曾法是賢劫第四尊佛也人壽百歲時出現於世若言劫者人壽八萬四千歲過一百年減一年又過百年減一年減至十歲而又過百年增一年乃至增至八萬四千歲如是一增一減為一小劫二十增減為一中劫八十小劫為一大劫亦有云八十增減為一中劫不知孰是當知一增一減一千六百八十萬年住劫初至第九劫人壽百歲時該一萬五千一百一十九萬年減至十歲猶有一萬年在後可知南無當來彌勒尊佛梵語彌勒一譯梅怛麗此云慈氏姓也又云阿逸多此言無能勝名也現在兜率天宮說法後降生於翅頭末國城中大婆羅門家托胎長成身長三十二丈胸廣十丈面長五丈人民年壽皆八萬歲人長一十六丈相貌端嚴衣食化生不須勞苦金銀七寶滿藏無人視之無有災患寒暑盜賊諸不吉祥事住劫內第十小劫人壽八萬四千歲減至八萬歲時出開經偈無上甚深微妙法佛法最上更無一法與之齊佛法最深更無一法窮其底理趣幽微不可思議故云無上云云百千萬劫難遭遇經云諸佛興出世懸遠值遇難正使出於世說是法復難又云無量無數劫空過無有佛既無有佛亦無有法故云百千云云我今見聞得受持今以釋迦世尊留傳聖教於諸方故得見聞受持幸之極矣見聞可解受持者領納前境曰受操執不捨曰持依義修行之謂也今權將禮誦曰受持亦可願解如來真實義今本有作願解如來懺法義者亦可依古願解如來真實義不必改作古無改故而此懺中諸佛洪名原出如來金口況懺文亦引佛經無非如來真實之義故不必改也此四句即是讚法亦表志心虔懇之意也佛法難聞今幸得聞惟願解了如說修行慈悲水懺法卷上此一部懺文但略解義趣若依古科判文繁不盡法見上義卷者對舒而言葢西域法寶非梵本非方冊但以一軸而莊成欲覽則舒之覽畢則卷之捲舒不定故云卷此經三卷故云上志心禮懺須先識懺悔兩字義懺者懺除已往悔者從今改悔故惟能悔者乃能為懺曰慈悲者慈能與樂悲能苦祖師立懺法正起大慈悲心所以救眾生苦而與眾生之樂故曰慈悲懺法也水懺者因三昧水以解怨故取立名詳見前緣起中一切諸佛愍念眾生為說水懺道場總法發語之端良以眾生垢重何人無罪何者無愆凡夫愚行無明闇覆親近惡友煩惱亂心立性無知恣心自恃因垢重所以多諸罪𠎝垢者身心不淨三毒流穢染汙妙明如塵坌汙于寶鏡使之不明故云垢也無明闇覆至恣心自恃正言垢重處無明者不明也執迷而不知自己之過非也暗覆者因無明故迷暗而覆蔽其真性也凡夫之人彼此皆然而言親近等者有二義一者互相競造故云親近二者宿無信種善根不能親近善友反交惡人總被貪嗔癡等昏迷煩惱亂于真心以至如此文中自明貪嗔癡慢疑邪見六種根本并二十種隨煩惱等文無知亦即無明也云云不信十方諸佛不信尊法聖僧不孝父母六親眷屬盛年放逸以自憍倨於一切財寶一切歌樂一切女色心生貪戀意起煩惱親近非聖媟狎惡友不知悛革或復殺害一切眾生或飲酒昏迷無智慧心恒與眾生造逆破戒過去諸罪現在眾惡今日至誠悉皆懺悔未作之罪不敢更作不信諸佛至飲酒昏迷正言罪愆之多所以要披誠懺悔信三寶是出世福田十方者東西南北四維上下也佛者覺也覺即對迷而言自覺覺他覺行圓滿法者正也即三藏經律論是也僧者淨也即菩薩聲聞緣覺及西方東土歷代祖師是也盛年壯盛之年血氣之勇故一者普及為言切者盡際為義總該統攝故云一切貪財長其傲貪樂助其婬貪色亂其正心等之言據相宗說集起名心屬賴耶即第八識籌量為意即第七末那了別為識即前六等識今云心生意起大抵重在前六等識動身發語乃至起惑造業皆由六識以為殊勝故可知之矣戀執著之義也不正邪狎之徒故曰非聖復乃至害人命等智是當人性體慧是當人照用智慧對識性而言轉識成智則能斷惑證真因迷無智故造如是等罪云云悉皆懺悔即是改往修來之意所以向佛說未作之罪不敢更作這纔是真懺悔三卷懺文此二句為大旨畢竟如此真為改惡從善之人真能消釋往罪真能一拜斷除不但地獄無分抑且成佛何難倘凡心私心自恃有懺悔之法便謂日日造罪亦是無妨則是懺法反開罪于人而非度人矣日日禮懺日日造罪以求滅罪生福無有是處譬如酒灌漏巵終不能滿故是故今日至心歸依十方盡虗空界一切諸佛諸大菩薩辟支羅漢梵王帝釋天龍八部一切聖眾願垂證鑒十方見前盡虗空界者無窮無盡也上上品十善清淨冤親平等乃至修四無量心者即得成佛無量法門不出于十善不可不知華嚴云上品十善修治清淨心廣無量故具足大悲廣修六度行願廣大故成菩薩辟支者從上品十善清淨不從他教故大悲方便不具惟自覺悟解了甚深因緣法故成獨覺乘羅漢四果從上品十善以智慧修習心狹劣故怖三界故闕大悲故從他聲聞解了四諦法故為聲聞乘達磨論云向者趨向果者證果四果四向有八補特伽羅此云數趨謂數數往來生死也謂行四向及住四果梵王即色界天主大梵天王是也帝釋即欲界天主釋提桓因是也八部者禪考云一天二龍三夜叉四乾闥婆即天樂神也五阿修羅不飲酒常與帝釋鬬六迦樓羅即金翅鳥神七緊那羅似人頭有角八摩睺羅伽即大蟒神人首蛇身腹行是也舍利問經云八部鬼神以何因緣生于惡道而常聞正法佛言以二種業一以惡故生于惡道二以善故受于快樂又問善惡二異可得聞耶佛言亦可得耳一天神者先以車輦舍宅飲食供養三寶父母賢聖之人猶懷慳嫉故二虗空龍神修德行檀不依正念急性好嗔故三夜叉神者好大布施或先損害後加饒益隨功勝負在天上空中地下四乾闥婆者好施有嗔獻伎樂故五阿修羅神者志強喜捨不隨善友所作淨福好逐幻偽作諸邪福故六迦樓羅神者先修大捨高心凌物故七緊那羅神者昔好勸人發菩提心未正其志逐諸邪行故八摩睺羅迦神者布施護法性好嗔恚故如是皆由依附邪師以邪亂正俱謂是道以自建立有頌云由作二因善不善乃為八部人非人南無毗盧遮那佛毗盧佛即清淨法身是也梵語毗盧遮那此云徧一切處謂毗盧性海煩惱體淨眾德悉備身土相稱徧一切處也南無本師釋迦牟尼佛釋迦佛為娑婆教主三界大師故曰本師即千百億化身是也釋迦牟尼此云能仁寂嘿謂其德仁濟羣類其道寂嘿無為南無阿彌陀佛梵語阿彌陀此云無量謂無量壽無量光一切無量故為樂教主今人求生淨土正生彼佛國土也南無彌勒佛彌勒下生時萬億閻浮皆以真金為地地平如掌秔稻自生衣食自至無量快樂男女五百歲乃婚姻賢愚經佛云彌勒三會度人無數悉我遺法種福眾生然後乃化同緣之徒南無龍種上尊王佛龍種上尊王梵語那伽此云龍勇健之謂也種是種族義必是姓氏也上尊者言其乃是種族中之最上最尊故以上尊而彰其聖號也王者自在之稱佛乃五住究盡二死永亡往來無礙故云自在云云南無龍自在王佛龍自在王王即自在義同上解隨德彰名大同小異云云南無寶勝佛寶勝者譬如摩尼超勝于眾寶之上如來至寶超出乎眾聖之寶故云云南無覺華定自在王佛覺華定此必是定名約理而言覺是果覺表本智華即是因表始智始本不二理智一如不可思議故云覺華定彼常居此定故以此為號也自在王亦同上解南無迦裟幢佛迦裟幢大淨法門經云迦娑晉名去穢又大集經名離染如云福田離塵蓮華等言亦可又教中有迦裟幢世界或以世界而立名未可知也幢表其正佛乃催邪顯正建大法幢等又幢者喻法無上故稱迦裟幢也南無師子吼佛師子吼者譬如師子出窟百獸潛蹤佛師子出羣魔竄伏故又云大師子一吼小師子勇健佛師一吼諸菩薩等悉皆勇猛精進故云爾然而十方諸佛不過以德彰名隨義解釋別無奇巧南無文殊師利菩薩文殊師利此云妙德經云了了見佛性猶如妙德等為諸菩薩中上座故首稱文殊又號曼殊室利此云妙吉祥又號滿殊尸利此云妙首南無普賢菩薩普賢菩薩梵語邲輸䟦陀或云三曼䟦陀此云普賢行彌法界曰普位鄰極聖曰賢菩薩中行願第一故云普賢又觀經大論並翻徧吉餘繁不引南無大勢至菩薩大勢至梵語摩訶那鉢此云大勢至思益云我投足之處震動三千大千世界及魔宮殿故云大勢至觀經云以智慧光普照一切令離三塗得無上力故云爾南無地藏菩薩地藏誓願云地獄不空誓不作佛為幽冥教主地藏經云若未來世聞是菩薩名字或讚歎或瞻禮或稱名或供養乃至彩畫刻鏤塑漆形像是人當得百返生于三十三天南無大莊嚴菩薩大莊嚴菩薩此菩薩雖未確查其出載必以六度萬行種種功德莊嚴法身而立聖號亦可知之矣南無觀自在菩薩觀自在者心經行深般若波羅蜜多時照見五蘊皆空照見便是觀皆空便是自在至下文是故空中無色無受想行識乃至于菩提薩埵依般若波羅蜜多故而得遠離顛倒夢想究竟涅槃安得不為觀自在又永嘉集云無法可得即如來方得名為觀自在禮諸佛已次復懺悔承上啟下之辭夫欲禮懺亦發語之端必須先敬三寶所以然者徵釋上意三寶即是一切眾生良友福田若能歸向者則滅無量罪長無量福此明福田之徵驗也能令行者離生死苦得解脫樂良友之驗也佛法僧是為三寶三寶能令人背塵合覺開示悟入佛之知見寧非良友喻如世間良朋善友令人入于善道故非但此也又能作眾生之廣大福田福田者三一既知三寶便能敬信謂之敬田二能報父母恩謂之恩田三能悲愍貧苦謂之悲田三寶中能種一切福故總名之曰福田若能以下正顯益處文可見是故歸依十方盡虗空界一切諸佛禮懺行人必以三歸為入道之因一歸依佛佛者覺也即大覺也尊也歸依佛終不墮地獄覺即對迷而言自覺覺他覺行圓滿十方虗空一切見前歸依十方盡虗空界一切尊法二歸依法法者正也即三藏經律論是也歸依法終不墮餓鬼又法即上軌持之義教中所詮四諦十二因緣六度四等之法依此修行得成正覺故云法也歸依十方盡虗空界一切聖僧三歸依僧僧者淨也即菩薩聲聞緣覺及西方東土歷代祖師是歸依僧終不墮旁生三寶有三此是十方三寶更有住持三寶泥龕塑像黃金雕彩等是佛寶黃卷赤軸方冊梵莢等是法寶圓頂方袍戒律精嚴等是僧寶更有一體三寶人人本具者是自性常覺不昧等是佛寶自性軌持不失等是法寶自性清淨和合等是僧寶如上俱稱寶者獨尊獨貴無比無儔自非世間奇珍異物之所及故稱為寶三寶每須頂禮一拜今人好簡不禮非也某甲等今日所以懺悔者凡言某等必當稱自己名下皆倣此正為無始以來在凡夫地莫問貴賤罪相無量或因三業而生罪或從六根而起過或以內心自邪思惟或藉外境起諸染著如是乃至十惡增長八萬四千諸塵勞門無始已來過去生生世世直從未有天地以前無量劫來所起罪業如下文所云此身俱是罪業根本身口意為三業者身有殺盜婬業口有妄言綺語兩舌惡罵業意有貪嗔癡業總言為三業分之為十惡不行十惡即是十善善業惡業由起故名三業六根者眼耳鼻舌身意此六為妄緣之根內心思惟屬意想所緣外境染著屬感觸而動經云以心生故種種法生以法生故種種心生此即內邪外染等意也八萬四千塵勞如華嚴所謂眾生于色聲香味觸境約五根對五塵謂內煩惱五百外煩惱五百則有一千此約見惑十使論見惑十使謂貪嗔癡慢疑身見邊見邪見見取戒取也復約身三口四七支各有一千則成七千更約三世成二萬一千復約貪行多者二萬一千嗔行多者二萬一千癡行多者二萬一千等分行者二萬一千共成八萬四千矣以八萬四千律儀對治之則成八萬四千法門也然其罪相雖復無量大而為語不出有三一者煩惱二者是業三者果報此三種法能障聖道及以人天勝妙好事是故經中目為三障人身罪業雖有千萬然三障所染以為深重故知身口意為罪障之根本而三障者直為塵勞之渠魁耳障者礙也蔽也有此三種便障礙掩蔽一切聖道及人天勝事譬如今人平素極有善念一遇感觸遂生煩惱興起惡業因緣致使阻退許多善心非障而何況入三惡道報又安知有聖道及人天勝事哉要知有業必有障人生俱必有業故知懺悔諦緣六度等為聖道十善五戒等是人天好事也所以諸佛菩薩教作方便懺悔除滅此三障者則六根十惡乃至八萬四千諸塵勞門皆悉清淨方者方法便者取便下云興七種心為懺悔而滅除罪障之方法便道者即與此相應一部水懺前後止說三障中間將貪嗔癡配入煩惱障將身三口四六根三寶間罪配入業障將地獄鬼畜人天餘報配入報障演為三卷懺文以世人俱受此三障重累所以不能出離生死苦惱故必懺悔然懺必心懺故當興七種心以為懺悔方可除滅也是故眾等今日運此增上勝心懺悔三障欲滅三障者當用何等心可令此障滅除此正起下出意先當興七種心以為方便然後此障乃可得滅何等為七下立名一者慚愧二者恐怖三者厭離四者發菩提心五者怨親平等六者念報佛恩七者觀罪性空阿毗達磨原有七種懺法所謂興七種心以為方便本此正與上諸佛菩薩教作方便句相應慚愧者如相宗云慚者依自法力崇重賢善為性對治無慚止息惡行為業自即自身法謂教法言我如是身解如是法敢作諸惡也愧者依世間力輕拒暴惡為性對治無愧止息惡行為業謂世人譏訶名世間力輕有惡者而不親拒惡法業而不作故曰輕拒等其餘下文懺中自明第一慚愧者自惟我與釋迦如來同為凡夫而今世尊成道以來已經爾所塵沙劫數而我等相與躭染六塵輪轉生死永無出期此實天下可慚可愧可羞可恥一以不得作佛為恥葢聖凡同體不成聖道終墮輪迴作是想可為愧死無地自惟者當自思惟思惟過去久遠劫前世尊未得道時亦是凡夫但言世尊今生成佛已來似乎未久追論前因即如逢事古釋迦等七萬五千佛滿第一阿僧祇劫乃至逢事然燈如來七萬七千佛滿第二阿僧祇劫乃至逢事勝觀如來滿第三阿僧祇劫此後復經九十一劫修妙相業直至逢事迦葉波佛方得圓滿其間上生為天帝下生為轉輪聖王各三十六返又或間為仙人為比丘為小王為婆羅門不可稱數度生無量故曰成道以來塵沙劫數然而如是三祇等事惟法華壽量品中猶為方便非真實也其實世尊成佛已來而更無量無邊不可思議塵沙劫數故云爾也如經所明茲不繁解六塵即色聲香味觸法為六種坌污妙明為塵如上八萬塵勞等所明如是慚愧思惟而已必須竭誠懺悔改往修來勇猛精進直得一生取辦速脫輪迴乃至得成無上菩提與佛無異方得滿我懺悔之弘願始得除我愧恥之初心也下文恐怖厭離發菩提心等六章大意例推可知第二恐怖者既是凡夫身口意業身三口四意三惡業未能免故常與罪相應以是因緣命終之後應墮地獄畜生餓鬼受無量苦如此實為可驚可恐可怖可懼如是恐懼怖畏之處畢竟不能免也如是驚怖思惟而已必須竭誠懺悔同前云云二恐入三惡道地獄餓鬼畜生是也作是想者可為凜凜恐者恐懼怖者怖畏如是驚怖等者如上第三厭離者相與常觀生死之中惟有無常苦空無我不淨虗假如水上泡速起速滅往來流轉猶如車輪生老病死八苦交煎無時暫息眾等相與共也但觀自身從頭至足其中但有此句是總三十六物髮毛爪齒眵淚涕唾垢汗二便大小行皮膚血肉筋脉骨髓肪膏腦膜脾腎心肺肝膽膓胃赤白痰癊生熟二藏如是九孔常流是故經言此身眾苦所集身即是積聚義故云云一切皆是不淨何有智慧者而當樂此身生死既有如此種種惡法甚可患厭三當厭離此身無常也苦也空也無我也不淨虗假也作是想者直教骷髏墮地此乃先自以觀察智而照之了知生死中事如是虗幻而不實下文令眾亦爾推廣之義相與者亦是思惟自知之意也如來一代時教三藏十二部並不出于無常苦空等句因空故畢竟無我亦無我所下文自明水泡起滅流轉車輪正喻無常虗假生老病死三句正言苦空八苦者謂生苦老苦病苦死苦求不得苦愛別離苦冤憎會苦五陰熾盛苦如是八種皆言苦者生如活剝牛皮死如落湯螃蟹老者眼暗耳聾腰跎背曲乃至疾患呻吟無能療治如是等事恒常逼迫煎熬無暫停息故云苦也眾等相與者亦令一切行人思惟而共知此事并觀下文等意而修行之三十六物正言不淨無我修不淨觀者當依此三十六等而行不可免也眼耳口鼻有七水道穀道是二故曰九孔常流不淨可知餘當例推指經言以證上文苦空無我不淨虗假之意所以當厭離經指涅槃經有智慧者信心清淨了知此身四大合成八苦所集如斯穢惡不堪總是生死根本豈當好樂而貪著乎如是厭患思惟而已同上云云第四發菩提心者經言指涅槃經當樂佛身佛身者即法身也從無量功德智慧生從六波羅蜜生從慈悲喜捨生從三十七助菩提法生從如是等種種功德智慧生如來身欲得此身者當發菩提心求一切種智常樂我淨薩婆若果淨佛國土成就眾生於身命財無所悋惜因上慚愧恐怖厭離等故發菩提心當捨不淨之幻身樂求清淨之法身也所以謹取經中當樂一句而為修行之本樂即願也求也欲求佛法等身當發菩提心及廣大行願以無量智慧修無量法門而始得生下明菩提法身之生處從無量等一句是總從六波羅蜜等是別六波羅等即六度也布施持戒忍辱精進禪定智慧是為六波羅蜜是梵語此云彼岸到即是到彼岸也修此六度萬行去了貪嗔愚癡等惑直至涅槃妙果故云到彼岸又云度慈悲喜捨四無量心也三十七等隨機設化方便法門故云助三十七助菩提法即下文三十七品謂四念處即四念位也四正勤即煖位也四如意足即頂位也五根即忍位也五力即世第一位也七覺支係修道八正道係初果共為三十七助道品也四念處者謂觀身不淨觀受是苦觀心無常觀法無我是也四正勤者謂已生惡令斷未生惡令不生未生善令生已生善令增長是也四如意足者得如意足念如意足進如意足慧如意足是也五根者謂信根進根念根定根慧根是也五力者謂信力進力念力定力慧力是也七覺支者謂念覺支擇法覺支精進覺支喜覺支輕安覺支定覺支捨覺支是也八正道者謂正見道正語道正思惟道正業道正命道正精進道正念道正定道是也從如是下結上六度四等三七之文意謂有如是功德妙行始得生如來身如來身即上佛身法身此身若非菩提智等則不能生故云當發菩提心等云云求一切種智者智有三種內法內名外法外名能知能解者名一切智即聲聞緣覺之智也能用諸佛一切道法發起眾生一切善種差別分別而無謬者名道種智即菩薩之智也能知一切道知一切種名一切種智即佛果智也常樂我淨涅槃四德也常者即真常之體也不遷不變萬古恒如故言常非對斷而言常也樂者安穩寂滅離二生死苦樂雙融故云樂非對苦而言樂也我者有主宰義具八自在得大安樂即我無我不二之真我非凡夫外道邪妄等我而言我也淨者三業清淨三惑永斷如大圓鏡了無纖翳故云淨非對染而言淨也薩婆若梵語薩婆若多又云薩雲若秦言一切智相因名般若果名薩婆大品云此是聲聞辟支佛智非後二智今據果字而言亦應該後一切種智其理不妨詳之可了淨佛等二句初句上求佛果心淨即佛土淨故也二句下化眾生若得自利則能利他故如是上求下化當於檀度為先故云無悋於身命財也此為修行慳悋者以為警不可不知也第五怨親平等者於一切眾生起慈悲心無彼我相一有彼我即不平等故何以故爾何以必須平等下出不平之過若見怨異於親即是分別分別是親非親以分別故起諸想著想著是彼是此想著因緣生諸煩惱憎愛煩惱由是而生煩惱因緣造諸惡業十惡五逆因茲而作惡業因緣故得苦果三塗苦報即自當之五以不平等故直至造諸惡業而得苦果所以必要平等作如是想自然四相俱空怨者冤讐親者親愛怨親一體不起憎愛是為平等圓覺云觀冤家如己父母既發菩提心求無上道必當冤親平等若不平等道無由成文中自明欲求出世樂因反招於苦果者皆因一念憎愛之心忘失菩提之正智以至如此所以云至道無難惟嫌揀擇但莫憎愛洞然明白此乃申明第四發菩提心六度等文之餘行也果能如是思惟觀察始得一理而貫通焉禮懺行人宜當自揣云云第六念報佛恩者下出念報之意如來往昔無量劫中捨頭目髓腦支節手足國城妻子象馬七珍為我等故修諸苦行此恩此德實難酬報下引證是故經言法華若以頂戴兩肩荷負於恒沙劫亦不能報下明念報之法我等欲報如來恩者當於此世勇猛精進離諸懈怠不得避懶偷安捍勞忍苦不惜身命建立三寶弘通大乘廣化眾生同入正覺至此可報佛恩萬分之一也六如來為度我等一切眾生故修諸苦行此恩當報作是想者當為如來肩所荷負作佛長子此承上文如上慚恐厭離發菩提心六度等法皆出於佛教我依佛教修行庶使當來成佛所以佛恩難報當念報之如來苦行不為自求但求一切眾生同入正覺俱出生死故我等當體佛心如佛所願酬佛所望是名真報佛恩是真一乘無上之道也頂戴荷負於恒沙劫之久亦不能報極言佛恩深重第七觀罪性空者罪無自性此下出無自性之所以從因緣生顛倒而有因緣和合虗妄由生生即無生既從因緣而生亦從因緣而滅因緣別離虗妄名滅滅亦無滅何自性之有哉從因緣而生者此下重出生滅之相狎近惡友造作無端無生而妄有其生也從因緣而滅者即是今日洗心懺悔下引經直顯洗懺之要是故經言此罪性不在內不在外不在中間故知此罪從本是空結上罪性本空了無所得如是用心無罪不滅也如下云云向下結前生後七觀罪性空無有實相作是想者從來熱水即寒水法苑珠林云觀罪性空罪從心生心若可得罪不可無我心自空空云何有善心亦然罪福無主非內非外亦無中間不常自有但有名字名之為心但有名字名為罪福名字即空還原返本畢竟清淨是為觀罪性空永嘉集所謂了即業障本來空是也然而了之一字正好思量若非斬釘截鐵之根基說時似悟觸境即迷淨名云無造無作無受者善惡之業亦不忘此句大半對虗搆文言者說慎之哉宗鏡云洗心者洗濯身心清淨無餘毫無邪念乃為真懺悔若能如此罪性便空若不洗心而求懺悔祇為自欺罪相宛然安能除滅洗之一字深有意焉不在內外中間正謂從本是空無有實相之意非真有在有不在而分別之也古云罪性本空由心造心若滅時罪亦忘罪忘心滅兩俱空是則名為真懺悔此非易事宜當扞勞忍苦而行之可也生如是等七種心已緣想十方諸佛賢聖起假想觀如親覩聖容故云爾合掌更加胡跪即表恭敬之至也擎拳合掌披陳致禱盡情發露之謂也慚愧改革革者革去亦即改意舒瀝心肝舒瀝亦即洗滌之謂也洗蕩腸胃如此懺悔何罪不滅何福不生若復不爾下文反顯不及之過悠悠怠墮之貌緩緩放逸之貌情慮躁動心神散亂徒自勞形於事何益修行人著眼看此舒瀝心肝洗蕩腸胃二句分明要脫皮換骨却將從前所為盡情改換從前知見著實傾倒一番此時汗泣交流若將愧死無地直見本來面目決不復惡此真心懺悔佛必哀憐攝受方有利益心肝即意腸胃指識情可也凡人懺悔倏俯倏仰形則勞矣若不悔過無補於罪福故曰於事何益上文興七種心於此收繳此下文儆人及蚤懺悔之意可知且復人命無常喻如轉燭一息不還便同灰壤三塗苦報即身應受不可以錢財寶貨囑託求脫杳杳冥冥恩惠顧之意赦放捨之意無期獨嬰即受也此苦無代受者莫言我今生中無有此罪所以不能懇禱懺悔經中謂言凡夫之人舉足動步無非是罪又復過去生中皆悉成就無量惡業追逐行者如影隨形如響應聲轉燭之喻如旋火輪亦如倒燭其火即滅言速之甚也故云一息等云云三塗者火塗血塗刀塗即地獄餓鬼畜生也陽網疎而易漏陰網密而難逃豈同人間賄囑之所能為哉所以三塗苦報云云三塗遠曠受苦幽長渺莫可窮了無恩赦故云杳杳云云自作自受影響相符縱有父子至親豈能相代哉莫言下䇿發自恃之流或自謂言我今無罪何懺之有故云莫言等而䇿之所以引經證其凡夫必不能無罪云云非但今生之罪過去之罪猶多之甚矣故曰又復過去云云若不懺悔罪惡日深故知包藏瑕玼佛不許可說悔先罪淨名所尚故使長淪苦海實由隱覆有如是因必有如是果歷劫窮年不能自免惟有懺悔乃可滅除故云若不云云如法華經云護惜瑕玼是名小智之類一開懺時便說眾生垢重何人無罪故知有罪而不勤懺悔固為不可懺悔而不肯發露猶然佛不許可淨名乃經名即維摩經也此經意義不著佛求不著法求惟在反觀諸身而求故曰說悔先罪淨名所尚既曰懺悔而不肯發露即此瞞昧一念自欺猶甚對佛尚且瞞昧則我心已永無開曉之期安得不長淪苦海是故某等今日發露懺悔不復覆藏所言三障者一曰煩惱二名為業三是果報此三種法更相由藉因煩惱故所以起諸惡業惡業因緣故得苦果是故某等今日至心懺悔是故下言已畢竟懺悔不敢覆藏結顯上文慚愧洗心披陳發露無罪不滅無福不生之大意而終其悔文也人既自知必有罪自知必有報所以向佛禮懺何不洗心刻責將殺盜淫妄貪嗔癡等一切盡掃則永離苦海竟超彼岸故曰苦海茫茫回頭是岸若止身懺而不勤心懺罪業仍存惡報不免懺悔二字原從心字立名不發露不洗心亦不成懺悔故云耳所言下疊前三障之句立名廣釋資次而懺一一申明上文慙愧恐怖等七種大意其義可見三世迭遷遞互相資而起故曰更相云云所以資始為因助因為緣又云展轉感果為因互相由藉為緣因親緣疎故作二釋因緣果報流轉無窮故云三世迭遷云云已上大槩先敘人必有罪總之不出三障理所應懺次言七種懺法且宜及蚤發露懺悔之意尚未行懺已下方次第詳言三障由於三業方是求哀懺悔上總指三障以明三世因果下別舉三障以為懺悔之詳第一先應懺悔煩惱障此煩惱障从何而起而此煩惱皆从意起煩惱現於身口何从而起云云所以者何意業起故則身與口隨之而動離意不能動故下別明意業先舉數立名意業有三一者慳貪二者嗔恚三者癡闇由癡闇故起諸邪見造諸不善第一先懺煩惱障由於意業貪嗔癡故身三口四一切煩惱隨之而生煩惱者據相宗中有貪嗔癡慢疑邪見六種根本煩惱更有二十種隨煩惱小隨十中隨二大隨八文繁不引是故經華嚴言貪瞋癡業能令眾生墮於地獄餓鬼畜生受苦若生人中得貧窮孤露狠頑鈍愚迷無知諸煩惱報由貪嗔癡煩惱之苦因受三塗之苦報三塗報竟縱得人身窮露頑迷此皆煩惱所感之報故曰諸煩惱報意業既有如此惡果是故某等今日至心歸命諸佛求哀懺悔上結懺夫此下出煩惱過患云云夫此煩惱諸佛菩薩入理聖人種種訶責亦名此煩惱以為怨家何以故能斷眾生慧命根故聖者正也正智之人也除佛菩薩外諸祖師僧凡有智者悉皆訶其煩惱如教中訶欲棄葢等事可知訶責煩惱為怨家為賊為瀑河為覊鎖訶責不一故曰種種訶責總見煩惱為大過患下出過患之名而廣釋之亦名此煩惱以之為賊能劫眾生諸善法故相宗中善法十一善為信慙愧無貪等三根勤安不放逸行捨及不害六為賊媒自劫家寶之謂亦名此煩惱以為瀑河能漂眾生入於生死大苦海故亦名此煩惱以為覊鎖能繫眾生於生死獄不能得出故波濤衝逆為瀑河輪轉無窮漂流無盡受苦深遠了無邊涯故喻如大海所以六道牽連四生不絕惡業無窮苦果不息當知皆是煩惱過患六道者淨名云一天道有二十八天二人道五常五戒三修羅道鬼畜人天所攝四地獄道八寒八熱等五餓鬼道九種十類六畜生道胎卵溼化是也亦名六趣四生者胎卵溼化也依殻而延曰卵生含藏而出曰胎生假潤而興曰溼生無而忽有曰化生六道牽連四生不絕所謂輪迴無間也即應上文諸煩惱報上舉煩惱過患已竟下正求懺悔後五節文亦爾是故今日運此增上善心求哀懺悔以此煩惱過患作懺悔之增上勝緣故云增上善心云云上引聖言出其煩惱過患已竟此下五章廣顯煩惱罪業之名相莫不皆从意業而生某等自從無始以來至於今日或在人天六道受報有此心識常懷愚惑繁滿𮌎襟有此心識正根意業而來無智不信了無出世之心故曰繁滿等云云或因三毒根造一切罪或因三漏造一切罪或因三苦造一切罪或因三倒造一切罪或貪三有造一切罪如是等罪無量無邊亂一切六道四生今日慙愧皆悉懺悔貪能致老瞋能致病癡能致死故云三毒根又三為生死罪惡之根本故曰根阿毗達磨論云三漏者一欲漏欲界二有漏上二界一切煩惱除無明三無明漏三界無明令心連注流散不絕故曰為漏又流動其心故名為漏三苦者一苦苦三界已苦欲界復苦二壞苦樂壞時苦等於三塗三行苦即處中苦通於無色三倒者心顛倒想顛倒見顛倒三有者即三界謂欲有色有無色有即三界之因果不忘有生有死故名曰有如是等罪總頂上三毒以至三有一切罪來凡言如是等俱倣此又復某等自從無始以來至於今日或因四住造一切罪或因四流造一切罪或因四取造一切罪或因四執造一切罪或因四緣造一切罪或因四大造一切罪或因四縛造一切罪或因四貪造一切罪或因四生造一切罪如是等罪無量無邊亂六道一切眾生今日慚愧皆悉懺悔四識住者阿毗曇雜論云色識住受識住想識住行識住也四流者唯識論云一欲流欲界惑二有流上二界惑除見癡三見流三界見四無明流三界癡亦名四軛四取者唯識論欲取見取戒取我語取能取自身相續不絕故名為取四執者圓覺云一生執不生二不滅執滅三斷執不斷四不常執常四緣者圓覺云一因緣諸法和合二次第緣心心數法三所緣緣法無所依四增上緣法無所得四大者地大水大火大風大謂四大假合而成身也四縛者唯識論云貪縛癡縛戒取縛見取縛謂不出三界不得解脫故云縛四貪者情色食婬也四生者瑜伽論云胎卵溼化也又復某等自從無始以來至於今日或因五住造一切罪或因五葢造一切罪或因五慳造一切罪或因五見造一切罪或因五心造一切罪如是等煩惱無量無邊亂六道一切眾生今日發露皆悉懺悔五住者永嘉集云見為一住名見一切住又思惑分三住一欲愛住一色愛住一無色愛住又塵沙惑與無明惑合為一住五葢者覆真實義為葢永嘉云色受想行識亦名五陰即覆葢之意如日月本明而雲霧為之掩覆則日月陰翳為之葢蔽自性真如本體却被色受想行識五者陰葢便因迷造罪又名五蘊積聚之謂又止觀云貪欲瞋恚愚癡睡眠掉舉為五葢五慳者成論住處慳護他物慳稱讚慳財慳法慳五見者首楞嚴云一薩迦耶見即身見執我我所執身有我故二邊見隨身計斷常墮二邊見故三見取執前諸見為勝為能或執一切有漏等法妄謂常樂我淨即是涅槃故四戒取非因計因五邪見撥無因果五心者賴耶云率爾心尋求心決定心染淨心等流心也又復某等自從無始以來至於今日或因六根造一切罪或因六識造一切罪或因六想造一切罪或因六受造一切罪或因六行造一切罪或因六愛造一切罪或因六疑造一切罪如是等煩惱無量無邊亂六道一切眾生今日慙愧發露皆悉懺悔六根者一眼根謂喜怒視相二耳根謂聽審相續三鼻根謂愛憎香臭四舌根謂嘗味甘苦五身根謂貪嫌滑澀六意根謂審察思量即眼耳鼻舌身意中六情俱以識為之根也六識者淨名云眼識玄黃不真耳識苦樂音異鼻識觀氣旋光舌識辯說邪正身識隨機現儀意識緣慮循空六想者析玄云眼耳鼻舌身意其識各有相應想六受者空品云眼受色耳受聲鼻受香舌受味身受觸意受法六根領受六境也六行者眼耳鼻舌身意各有所司則各有所行也六愛者毗曇云眼耳鼻舌身意各因所觸而生愛六疑者淨名云貪瞋癡慢疑覺六者俱有疑亦名俱生惑又復某等自從無始以來至於今日或因七漏造一切罪或因七使造一切罪七漏者李論云見漏諸根漏忘漏惡漏親近漏愛漏念漏七使者首楞云欲使恚使愛使慢使無明使見使疑使或因八倒造一切罪或因八垢造一切罪或因八苦造一切罪如是等煩惱無量無邊亂六道一切眾生今日發露皆悉懺悔八倒者涅槃云無常計常無樂計樂無我計我不淨計淨此凡夫四倒也常計無常樂計無樂我計無我淨計不淨此二乘四倒也八垢者涅槃云念垢不念垢念不念垢我垢我所垢自性垢差別攝受垢也即八妄想自性汙染總名為垢八苦者維摩云生苦老苦病苦死苦怨憎會苦愛別離苦求不得苦五陰熾盛苦也又復某等自從無始以來至於今日或因九惱造一切罪或因九結造一切罪或因九緣造一切罪九惱者淨名云過去愛我怨家過去憎我知識過去惱我己身現在愛我怨家現在憎我知識現在惱我己身未來世亦然一世有三三世有九故云九惱即名九結結者結集不散之意九結者愛結恚結慢結無名結見結取結疑結嫉結慳結也當中此中能和合苦故名為結九緣者一眼識緣明緣空緣根緣境緣作意緣根本依緣染淨依緣分別依緣種子二耳識緣空緣根緣境緣作意緣根本依緣染淨依緣分別依緣種子三鼻識緣根緣境緣作意緣根本依緣染淨依緣分別依緣種子四舌識緣根緣境緣作意緣根本依緣染淨依緣分別依緣種子五身識緣根緣境緣作意緣根本依緣染淨依緣分別依緣種子六意識緣作意緣根本依緣染淨依緣分別依緣種子七第七識緣染淨依緣分別依緣種子也八第八識緣根本依緣染淨依緣分別依緣種子也總名曰九緣生識或因十煩惱造一切罪或因十纏造一切罪十煩惱者一忿二惱三恨四覆五諂六誑七憍八害九嫉十慳十纏者一忿恚纏曰瞋二隱覆自罪纏曰覆三意識昏迷纏曰睡四五情暗冥纏曰眠五嬉遊纏曰戲六三業躁動纏曰掉七屏處起罪不自羞纏曰無慙八露處起罪不羞他纏曰無愧九財法不能惠施纏曰慳十他榮心生熱惱纏曰嫉謂之十纏也或因十一徧使造一切罪十一徧使者謂不信懈怠不慙不愧多貪多瞋多癡昏迷放逸慳悋毒害此十一徧使也反此則為十一善或因十二入造一切罪十二入者謂眼耳鼻舌身意此內六根入屬能能者能見聞覺知也色聲香味觸法此外六塵入屬所所者著見聞覺知之所也入以互相涉入為義亦名十二處或因十六知見造一切罪十六知見者智論云一我者知見起我我所二生者知見如父有子三受者知見命根成就四命者知見能舉事故五有情者知見蘊和合生六養育者知見因緣故長七眾數者知見諸法有數八人者知見妄計我是人九作者知見手足能所十使作者知見力能役他十一起者知見作後世業十二使起者知見亦令他作十三受者知見苦樂果現十四使受者知見厭于苦樂十五知者知見五識名知十六見者知見目觀色像或因十八界造一切罪十八界者即六根六塵六識為十八界者有分別辨析之義又種族義界畔義或因二十五我造一切罪二十五我者即二十五諦依百論結頌曰一墮冥初為世間本性乃生覺二從覺為中陰即生我心三从我心中我慢便生五塵已上成八五塵生于五大五大生十一根通上總成二十四又至神我主諦共為二十五我也色聲香味觸五為五塵地水火風空為五大又十一根者眼耳鼻舌身為五知根手足口併大遺根小遺根為五業根又心平等共十一根大遺小遺即大小便利也或因六十二見造一切罪六十二見者即色受想行識五陰于三世推之而成也每一陰具四句如云色大我小我在色中我大色小色在我中離色是我即色是我餘四例推可知五陰共成二十以過去現在未來三世配之成六十加根本斷常二法共成六十二也或因見諦思惟九十八使百八煩惱晝夜熾然開諸漏門造一切罪見諦思惟九十八使者大藏一覽云見諦攝欲界三十二使色界二十八使無色界二十八使共八十八使思惟攝欲界四使色界三使無色界三使共十使合之成九十八也見諦所攝何謂欲界三十二使苦諦下十使集滅下各七使除身邊戒道下八使除身邊二見何謂色界二十八使苦下九使除瞋集滅下各六使除瞋身邊戒道下七使除瞋身邊何謂無色界二十八使苦下九使除瞋集滅下各六使除瞋身邊戒道下七使除瞋身邊思惟所攝何謂欲界四使一貪二瞋三癡四慢此四使從斯陀含向入修道斷至阿那含果九品方盡何謂色界三使一貪二癡三慢並是阿羅漢向修道斷何謂無色界三使一貪二癡三慢此是羅漢向至果方盡四諦者苦集滅道也苦諦下十使謂身邊戒見邪貪瞋癡慢疑也集滅下各七使者止有見邪癡疑貪瞋慢七故云除身邊戒也道下八使者止有邪癡疑戒見貪瞋慢八故云除身邊二見也下各倣此苦為有漏果集為有漏因滅為無漏果道為無漏因楞嚴註云薩迦耶見者此云身見執身有我故邊見者執我斷常墮二邊見故戒取見者執持狗牛等戒為生天因故見取見者執前諸見為勝為能或執一切有漏等法妄為樂淨即是涅槃故邪見者撥無因果斷滅善種名為邪見百八煩惱者即九十八使更加十纏成一百八也又云即一百八見亂賢聖及以四生徧滿三界彌互六道無處可避今日至禱向十方佛尊法聖眾慚愧發露皆悉懺悔三界者一欲界天自他化已下皆名欲界希須樂欲故名欲二色界天初禪至四禪未出色籠故名色三無色界四空天只有四陰無色蘊故名無色六道者天道人道修羅道旁生道餓鬼道地獄道亦名六趣十方者東西南北四維上下俱有佛剎國土故也願某等承是懺悔三毒一切煩惱所生功德生生世世三慧明三達朗三苦滅三願滿願某下上文廣舉罪相懺悔已竟下文發願求其功德何也懺悔畢竟滅罪滅罪畢竟福生福生則智慧功德自然成就也所以次第發願求其功德而顯是懺悔力用之功能也三慧者聞思修也聞而不聽無受潤因聽而不思無深旨趣思而不修終無證理所以當明三達之說諸處未見所出但梵網經上卷中有法達義達辭達更有教化達未知可否又達者明也或天眼智宿命智漏盡智之三明亦未可知也俟再考三苦者苦苦三界已苦欲界復苦壞苦樂壞時苦等于三塗行苦即處中苦通于無色此苦當滅三願者一願一切眾生得證知法二願以無厭心為眾生說法三願捨身命護持正法此願當滿願承是懺悔四識等一切煩惱所生功德生生世世廣四等心立四信業滅四惡趣得四無畏四等心者淨名云直心是道場無虗假故發行心是道場能辦事故深心是道場增益功德故菩提心是道場無錯謬故此心當廣四信者一信佛樂常稱讚佛二信法樂欲聽法三信僧樂供養眾四信戒樂離五欲此信要立四惡趣者大論云一地獄八寒八熱等二旁生水陸空行等三餓鬼三類九種等四修羅鬼畜人天所攝此趣當滅四無畏者智論云一得總持無畏二得知根無畏三得決疑無畏四得答報無畏又云一切智無畏漏盡無畏說障道無畏說苦盡無畏也願承是懺悔五葢等諸煩惱所生功德度五道豎五根淨五眼成五分又五葢如上文即五蘊一色蘊謂積聚虗假二受蘊謂領納資貪三想蘊謂取像奔馳四行蘊謂微細遷流五識蘊謂熾然了別五道者法華云天道人道二善道也地獄餓鬼畜生三惡道也皆當度之五根者賴耶云一信根信諦一切無漏根力禪定解脫三昧等法海消除疑網二念根住持不忘三進根念茲在茲四定根湛寂虗通修心不亂五慧根明辯實諦以慧照了願當豎立五眼者涅槃頌曰天眼通非礙肉眼礙非通法眼惟觀俗慧眼了知空佛眼如千日照異體還同圓明法界內無處不鑒容開示悟入佛之知見具足五眼故願淨之智度云菩薩初發心時以肉眼見苦眾生心生慈愍學諸禪定修得五通以天眼徧見六道受種種身益加哀憐故求慧眼以救濟之得見眾生心相種種不同云何令彼得是實法故求法眼引導令入法中後求佛眼得一切智成就佛法又金剛註內外空寂名肉眼見自真性自在平等名天眼見自性般若之智名慧眼見一切法無一切法見一切相空一切相名法眼見前無煩惱可斷中無自性可守後無佛位可求三際清淨名為佛眼成五分者瓔珞經云成五法香也一成戒分香以攝身二成定分香以攝意三成慧分香以攝亂四成解脫分香以攝倒見五成知見分香以攝無明一說成五分法釋籤云一分無作戒為戒身二分無漏淨禪為定身三分無漏智慧為慧身四分三種解脫為解脫身五分無生為解脫知見身也願承是懺悔六受等諸煩惱所生功德生生世世具足六神通滿足六度業不為六塵惑常行六妙行六神通者如意通天眼通天耳通他心通宿命通漏盡通是也如意通三種一者能到身飛行如鳥無礙移遠令近不往而到此沒彼出一念能至二者轉變能以大作小小作大一多等三者聖如意此如意通惟佛有之天眼通二種一修得一報得天耳通一切聲他心通知他人之喜瞋怖畏宿命通知過去世事漏盡通四漏故願具足六度業者善戒云一布施治慳貪得富報二持戒治破戒得具足善道報三忍辱治瞋恚得有相好報四精進治懈怠得壽神通報五禪定治散亂得安樂生天報六智慧治愚癡得辯才破煩惱報此六善業須滿足色聲香味觸法為六塵謂之惑者色如熱金丸執之則燒聲如塗毒鼓聞之必死香如敝龍氣嗅之則病味如沸蜜湯又如塗蜜刀䑛之則傷觸如臥師子近之則嚙法如象紛紜故皆不可為之惑也六妙行者色界初禪云厭下之苦行麤行障行三忻上之淨行妙行樂行三也又願承是懺悔七漏八垢九結十纏等一切諸煩惱所生功德生生世世坐七淨華七淨華者淨名云一戒淨身口意始終淨也二心淨三乘制煩惱斷結漏盡也三見淨見法真性不起妄想也四度疑見染疑斷也五分別道是道宜行非道宜捨也六行斷知見所行所斷通達分明也七涅槃得無生法忍也洗八解水八解者一內有色觀外色解脫為初禪二內無色觀外色解脫為二禪三觀淨解脫具足住為三禪四觀空無邊處解脫五觀識無邊處解脫俱為四禪六觀無所有處解脫七觀非非想處解脫俱為四空八觀想受滅解脫為過三界上七淨以所修因言故曰華曰坐八解以入法流言故曰水曰洗具九斷智九斷智者一乾慧地五停心總別相念處二性地煖頂忍世第一已上猶伏見思惑三初果斷三界八十八使見惑盡見真諦四二果斷欲界九品思惑五三果斷欲界殘思盡六四果斷三界見思盡七支佛斷見思盡更侵三習氣八菩薩斷三界正使盡修六度行九佛位頓斷三界見思殘習坐木菩提樹下生艸為坐成劣應身能斷此九者為具智成十地行成十地行者華嚴云登十地斷十障證十真初地斷異生障證徧行真如二地斷邪解障證最勝真如三地斷暗鈍障證聖流真如四地斷細惑現行障證無受真如五地斷下乘涅槃障證無分別真如六地斷麤相現行障證染淨真如七地斷細相現行障證智所依真如八地斷無相加行障證不增減真如九地斷不欲相利他障證所依真如十地斷法自在障證法無分別真如歡喜離垢乃至法雲為十地也願以懺悔十一徧使及十二入十八界等一切諸煩惱所生功德願十一空能解常用栖心自在十一空者涅槃經云一內空六根無體二外空六塵無相三內外空六識無有四有為空生滅相無五無為空無相亦無六無始空體本元虗七性空法本常無八無所有空俱無亦無九第一義空功用投現十空空病去藥除十一太空小乘法無此十一法空必願能解常用心既解空自得解脫三昧故曰栖心自在能轉十二行法輪十二行法輪者法華法輪三轉一示轉二勸轉三證轉也每轉有四即苦集滅道也三四成十二第一示轉云此是苦逼迫性此是集招感性此是滅可證性此是道可修性第二勸修轉云此是苦汝應知此是集汝應斷此是滅汝應證此是道汝應修第三作證轉云此是苦我已知不復更知此是集我已斷不復更斷此是滅我已證不復更證此是道我已修不復設修以此苦集等四法三唱令知故云三轉十二也輪者从喻而言如世之車輪有推碾義運轉義以此四法運入眾生心中摧滅煩惱而證涅槃故云十二行法輪也具足十八不共之法無量功德一切圓滿發願已歸命禮諸佛十八不共者梵網經云身口意三業無失無不定心無異想心無不知捨心志欲無減憶念無減精進無減智慧無減解脫無減解脫知見無減身業隨智慧行口業隨智慧行意業隨智慧行知過去無礙知現在無礙知未來無礙是為十八之數不共法者此出世法惟佛為獨不與二乘共故十八等下其餘更有無量功德莫能盡述者願求一切悉皆圓滿成就方始成我懺悔之大心也欲求懺悔必先禮佛以為懺罪之本故當發願歸命云云南無毗盧遮那佛南無本師釋迦牟尼佛南無阿彌陀佛南無彌勒佛南無龍種上尊王佛南無龍自在王佛南無寶勝佛南無覺華定自在王佛地藏經云又於過去不可思議阿僧祇劫時世有佛號曰覺華定自在王如來像法之中有一婆羅門女宿福深厚諸天衛護其母信邪常輕三寶不久命終魂神墮在無間地獄時女見覺華定自在王如來形像瞻禮尊容倍生敬仰私自念言佛名大覺具一切智我母死後必知處所忽聞空中聲曰我是汝所瞻禮者見汝憶母故來告示汝但端坐思惟我之名號即當知母所生去處時女尋禮佛足思惟經一日一夜忽見自身到一海邊以念佛力故自然無懼有一鬼王名曰無毒稽首來迎白聖女曰此是大鐵圍山西面第一重海造惡眾生七七之內無人繼嗣為作功德先渡此海三海之內是大地獄願聖女速返悅帝利罪女生天以來經今三日云承孝順之子為母設供修福布施覺華定自在王如來塔寺非惟菩薩之母得脫地獄此日無間罪人俱同生訖婆羅門女便立弘誓願願我盡未來劫應有罪苦眾生廣設方便使令解脫時鬼王無毒者當今財首菩薩是婆羅門女者即地藏菩薩是南無袈裟幢佛南無師子吼佛南無文殊師利菩薩南無普賢菩薩南無大勢至菩薩南無地藏菩薩地藏經云文殊師利白佛言惟願世尊廣說地藏菩薩摩訶薩因地作何行立何願而能成就不思議事佛告文殊師利譬如三千大千世界所謂草木叢林稻蔴竹葦山石微塵一物一數作一恒河一恒河沙一沙一界一界之內一塵一劫一劫之內所積塵數盡充為劫地藏菩薩證十地果位已來千倍多於是數何況地藏菩薩在聲聞辟支佛地南無大莊嚴菩薩南無觀自在菩薩禮諸佛已次復懺悔承前啟後夫論懺悔者本是改往修來滅惡興善人之居世誰能無過學人失念尚起煩惱羅漢結習動身口業豈況凡夫而當無過改往修來者改往昔之過咎修來世之福田滅三毒六根等惡興六度萬行等善學人者學之為言效也效古聖先賢精修道業故謂之學如云勤修戒定慧息滅貪瞋癡識心達本源故號為沙門如斯等輩堪稱學人稍有些些怠惰即為失念了也古云暫時不在猶同死人今言失念而起煩惱者正此意也楞嚴經云非不迴心大阿羅漢尚有塵沙微細惑至如鈍阿羅漢者能免結習乎結習者謂从凡夫以來所結之習氣未能消融之盡也豈況者出纏尚爾況在纏者乎但智者先覺便能改悔愚者覆藏遂使滋蔓所以長夜積習曉悟無期覆藏者知有過隱而不發其罪日增如論語云小人之過也必文文飾之也小人憚於改過而不憚於自欺故必文以重其過此之謂也所以必須發露方為懺悔智者悔罪喻如斬艸必發其根使後更不復生故云改悔愚者隱覆而不發者如艸埋根於深土之中雨露滋成即成蔓延日滋日茂罪業漸深若不發露如處於天暗之中終成迷昧了無所見乃至墮於三塗苦惱之中亦莫知其所以故云曉悟無期也若慚愧發露懺悔者豈惟止是滅罪亦復增長無量功德豎立如來涅槃妙果懺悔獲益如此之妙此下復明懺法之方若欲行此法者先當外肅形儀瞻奉尊像內起敬意緣於想法懇切至禱外肅者即齊莊恭謹之意也華嚴行願品一者禮敬諸佛今禮懺時而左顧右盻竊為語笑者豈直形儀不肅即其內無敬意維摩經云瞻仰尊顏目不暫捨禮敬正宜目視而心想若無敬意瞻奉且虗何況緣想當知敬意正不在七種心之後生二種心何等為二一者自念我此形命難可常保一朝散壞不知此身何時可復若復不值諸佛賢聖忽逢惡友造眾罪業復應墮落深坑險趣此身四大假合而成四大分散則此身壞矣況石火電光無常莫測不蚤為預辦後悔無及猶恐一失人身萬劫不復故也深坑險趣即三塗八難以喻言之也因難出故喻其深受苦惱故喻其險二者自念我此生中雖得值遇如來正法不為佛法紹繼聖種淨身口意善法自居不為佛法者人身難得佛法難聞今又僧遇而又不能為一念此身無常死墮惡趣無有出期二念此身罪惡不能瞞昧諸佛神祇畢竟到閻羅王所受諸苦惱有此二種心自然慚愧恐怖急求懺悔不敢自欺興顯佛法使聖道昌隆而無斷絕謂之紹繼聖種也而今我等私自作惡而復覆藏言他不知謂彼不見隱慝在心慠然無愧此實天下愚惑之甚非但不能紹繼佛法而反私自云云此身私自作惡只道佛不知不見所以身口意業倍為深重一經發露罪業冰消忒惡也私謂佛菩薩不知不見畢竟佛菩薩盡知盡見如下文所云故曰天下愚惑之甚即今現有十方諸佛諸大菩薩諸天神仙何曾不以清淨天眼見於我等所作罪惡又復幽顯靈祇注記罪福纖毫無差楞嚴經云阿那律見閻浮提如觀掌中菴摩羅果諸菩薩等見百千界十方如來窮盡微塵清淨國土無所不矚眾生洞視不過分寸般若經云天眼能見十方沙界眾生成就身語意業惡行誹毀賢聖邪見因緣身壞命終當墮惡趣幽者鬼使顯者聦明正直之神也因既無差果終無謬下正指果報無謬夫論作罪之人命終之後牛頭獄卒錄其精神在閻羅王所辯覈考覈是非當爾之時一切怨對皆來證據執對之謂也各言汝先屠戮我身炮煑蒸炙此指異類之對或先剝奪於我一切財寶離我眷屬此指人類之對我於今日始得汝便於時現前證據何得敢諱諱即隱瞞之謂也惟應甘心分受宿殃錄者取而收之也閻羅梵語正云閻摩羅此云靜息又云夜磨羅此云雙世鬼官總司也陰界之名苦樂並受故云雙世古云兄與妹而雙王苦與樂而同受正此謂也屠戮煑炙言殺生食肉之業剝奪離散言偷盜勢奪之業汝先或先當知兩先字皆往昔過去之意因剝奪故或至父南子北兄弟東西等故曰離我眷屬今日始便者自來業緣未熟似乎未便今既業報至時誠難逃避故得其便也甘心分受者謂罪報當如其罪業之分量故受報者一如其分而甘心受之也正是隨罪輕重考而罰之者是也如經所明地獄之中不枉治人下出不枉之意若其平素所作眾罪心自忘失者臨命終時造惡之處一切諸相皆現在前各言汝昔在於我邊作如是罪今何得諱楞嚴經云三界惟心萬法惟識隨心所作隨心所現無所諱也又楞嚴云臨命終時未捨煖觸一生善惡俱時頓現即此意也各言我昔下執對之辭也是時作罪之人無藏隱處於是閻羅王切齒訶責將付地獄歷無量劫求出莫由此事不遠不關他人此下令人追思己過而自首也正是我身自作自受雖父子至親一旦對至無代受者我等相與得此人身體無眾疾各自努力與性命競大怖至時悔無所及凡人多謂惡業可隱故不思懺悔蚤知終無隱藏何如先向佛前發露懺悔冀得免耳慎勿懈怠然而懺後改過必不更作庶可得免如或倚其懺悔更造新殃欲求免者未之有也思之慎之當自勉之訶責者如云癡人獄種汝在世時不孝父母邪慢無道無有慚愧汝今生處名阿鼻地獄受此苦惱為樂不耶此等苦切責之只要他人改過自新故耳又王見其人忘失其罪而自不知故訶責之也將付者將此罪人付之於無間地獄之中故歷劫無由求出也眾等相與下懺主激勵行人知過速懺無怠懈也大怖至時謂無常忽到眼華落地四大分張前路茫茫未知何往抑且平素資糧無辦寧不大可畏怖者哉莫待罪苦臨頭那時措手不及故當捨命忘身力求懺悔始得是故至心求哀懺悔某等自從無始以來至於今日積聚無明障蔽心目隨煩惱性造三世罪謂之無始以來則過去世數無算而造罪亦無算況今生又不覺悟則現在無明煩惱開八萬四千塵勞門造罪何可勝計未來生死無有窮期四生六道改形易相可不懼哉故曰此身不向今生度更向何時度此身當知勇猛精進超出三界正在今生切勿放過此下二章復舉無始無明而懺三世之過惡也法性本明本來無有罪業因無明煩惱之所昏蔽而不明故云隨煩云云所以云自從無始迷心海曠劫漂流生死波者正此之謂也又積聚無明者即無智慧之明不能了境惟心而遮蔽心目故隨之而造諸惡業故曰隨煩惱性也或耽染愛著起貪欲煩惱或瞋恚忿怒懷害煩惱或心憒惛懵不了煩惱或我慢自高輕傲煩惱疑惑正道猶豫煩惱謗無因果邪見煩惱不識緣假著我煩惱迷於三世執斷常煩惱朋狎惡法起見取煩惱僻稟邪師造戒取煩惱乃至一切四執橫計煩惱今日至誠悉皆懺悔凡夫但以昏散二病以為生死根本憒即煩憒散亂之謂也疑惑不信猶豫不決皆無明障蔽之過也統前統後無不皆爾天堂是妄造地獄無真說是謗無等語也不識因緣虗假遂不知四大本空因而執著我見而生煩惱也斷常二見即有無二見同志曰朋附近曰狎既曰惡法必有其人而近之故曰見取者謂執身見邊見戒取見自以為勝為能或執一切有漏等法妄為樂淨即是涅槃故戒取者非因計因謂執持牛狗等戒為生天因故四執即前一生執不生二不滅執滅三斷執不斷四不常執常已上懺十使十使即十煩惱又復無始以來至於今日守惜堅著起慳悋煩惱不攝六情六情者喜怒哀樂愛惡也奢醜煩惱奢侈誇誕心行獘惡弊即麤獷剛暴之謂也不忍煩惱當知六度之中忍為最急忍該六度古云一忍能令百禍消講說忍字極多文繁不贅怠墮緩縱恣情放逸之謂也不勤煩惱疑慮躁動覺觀煩惱覺觀差別麤心相名覺細心相名觀初緣心中發相名覺後分別籌量好醜名觀又智度論入初禪定名有覺有觀初禪二禪中間是名無覺有觀从二禪乃至非有想非無想定是名無覺無觀觸境迷惑無知解煩惱說時似悟對境即迷未得謂得者亦此意也隨世八風生彼我煩惱隨世八風者謂隨世之風之有八也一利謂得可意事二衰謂失可意事三毀謂不現前誹撥四譽謂不現前讚美五稱現前讚美六譏現前誹撥七苦逼身心八樂適悅身心彼我之間隨此八者而互生煩惱諂曲面譽不直心煩惱強獷難觸不調和煩惱獷者暴戾之獸不調和之人似之難觸者剛強而不可近也易忿難悅多含恨煩惱嫉妒擊刺狠戾煩惱恨怒之意㐫險暴害慘毒煩惱毒之最極曰慘毒乖背聖諦執相煩惱空假中三諦亦可名聖諦即下苦集等四俱名聖諦若言聖諦第一義即中道可知也言乖背者因順於凡俗之流故違於出世之聖諦故云執相也已上懺十三隨下懺三乘於苦集滅道生顛倒煩惱苦集滅道者即四諦也苦即上文生者八苦者是集即貪瞋癡等煩惱者是滅即寂滅二乘所證空理也道即三十七品等法此皆真實無謬故云諦也隨從生死十二因緣輪轉煩惱十二因緣者法華經云無明緣行行緣識識緣名色名色緣六入六入緣觸觸緣受受緣愛愛緣取取緣有有緣生生緣老死等也然有二乘還滅等文亦詳法華經中此但言生起不言還滅故不錄乃至無始無明住地恒沙煩惱起四住地構於三界苦果煩惱起者此四皆因無明而起也構結構也四住地者攝論云見一切住地欲愛住地色愛住地有愛住地也若兼上無明住地即五住地也無量無邊亂賢聖六道四生今日發露向十方佛尊法聖眾皆悉懺悔煩惱無量亂無邊若聖若凡無不惱故若得懺盡無明一切悉皆殄滅也故當恭對十方三寶之前竭誠禮拜求哀懺悔也如上廣舉三世罪業懺悔已竟下文次第發願而求其功德同上云云願某等承是懺悔意業所起貪瞋癡等一切煩惱所生功德生生世世折憍慢幢竭愛欲水滅瞋恚火破愚癡闇斷疑根裂諸見網又上種種惑業皆承懺悔之智力折之竭之乃至於之裂之始得清淨故云願某等承是云云折憍慢幢等文承上懺悔意業等句而來我慢猶若高幢懺悔智力猶如利器足以折之愛欲如水性空真火足以竭之瞋恚如火性水真空足以滅之暗喻癡迷無知而智燈足以破之疑惑如樹之根亦以智手足以之網喻見解執縛慧劍足以裂之深識三界猶如牢獄四大毒蛇五陰怨賊六入空聚愛詐親善三界極尊福盡還作牛領中蟲況復其餘無福德者故菩薩觀三界猶如牢獄深識二字直貫下五句當云深識三界如牢獄深識此身為四大猶如毒蛇深識色受想行識五陰如怨賊深識眼耳鼻舌身意為六入猶如空聚俱是盜賊藏匿其中深識此等一切欲愛猶如怨家詐為親善若實識知無能為害也已修八聖道斷無明源正向涅槃不休不息三十七品心心相續十波羅蜜常得現前一切皆以邪妄不正為無明之根源故當修聖道而斷之八聖道即八正道也修道者如畏毒蛇怨賊涉路避之而去也涅槃者具云般利涅槃那般利言普也即究竟也涅即出離槃那即煩惱合言普究竟出離煩惱又云涅而不生槃而不滅又梵語摩訶般涅槃那此云大寂定又云大固牢固具四德足證三身云云不休不息者無有疲厭意心心相續無有間斷意常得現前純熟優行意三十七品見前三十七助菩提法中十波羅蜜梵語檀波羅蜜尸羅波羅蜜羼提波羅蜜毗黎耶波羅蜜禪波羅蜜般若波羅蜜方便願力智共為十華云一布施二持戒三忍辱四精進五禪定六智慧為六波羅蜜又名六度後四度願與力即禪定開出方便與智即般若開出梵語波羅蜜此云彼岸到如涅槃經云修戒定慧解脫知見六波羅蜜三十七品以為船筏依乘此栰渡煩惱河到於彼岸常樂涅槃正此意也又此五句亦同上意懺悔而加修八正道無煩惱而不除無無明而不斷乃至直成無上菩提莫不皆从懺悔修八正道之所得也懺悔發願已至心信禮常住三寶常住者十方三寶無去無來不生不滅本無定相無住無不住但有求皆應無禱不从常在世間救苦眾生令得解脫故云常住亦如釋迦世尊常在娑婆世界化度眾生之意耳慈悲水懺法卷上瘡如人面宿憾何多清泉一掬即消磨憫己復憐佗述為懺摩萬古沐恩波音釋原敘逅上下戒切音械下胡茂切音後嫌胡兼切音賢惡烏故切去聲餧奴委切內上聲饑也今文宜用飫字是於據切於字去聲文義相合此餧字恐悞啖徒覽切談上聲掬居六切音匊盎於浪切鴦去聲晁池遙切音潮凜力錦切音廩髓息委切雖上聲甦孫租切音蘇緣起文澍陟慮切音注孽魚列切年入聲藪蘇偶切音叟開經偈解下戒切去聲曉也後凡圈去聲者同愍念後文憍倨上堅姚切音驕恣也逸也下居御切音句倨傲不遜媟狎上先結切音屑狎也下胡夾切音洽親近玩熟也悛且緣切音詮止也改也辟必勒切音璧後凡稱辟支者同夫欲文夫逢夫切音扶語端辭同長止兩切音掌凡長養後同令行上離呈切音陵凡使令者皆平聲下胡孟切去聲身之所行謂之行離力地切音利凡欲遠離則去聲罪相文相息亮切去聲後凡圈者同著直略切入聲後凡圈入聲者同厭離文眵抽知切音鴟目汁凝也腎時軫切辰上聲臟才浪切藏去聲樂魚教切去聲欲也好也後凡好樂者皆同菩提文種知隴切音腫種種猶物物也樂歷各切音洛若如者切音惹別必列切首鼈捍侯幹切音翰劫古協切兼入聲觀罪文擎拳上渠京切音鯨持高也下逵員切音權瑕玼上何加切音遐下生資切音慈玉病先應文狠上許容切音胸下下懇切上聲鈍徒困切音遯瀑步木切音僕飛泉懸水也繫胡計切音係互居鄧切庚去聲豎忍與切如上聲直立也改往文蔓莫半切去聲涅魚列切音孽讀虐非者值直意切音治遇也今讀直者非坑丘庚切音阬慝惕得切同忒惡也慠魚刀切音敖祗渠宜切音岐纖思亷切音暹細微也覈胡得切音曷考實也分房悶切音問後凡去聲者同枉嫗徃切汪上聲素蘇故切音訴蔽必敝切音閉耽賴含切煩惱文憒古外切音膾心亂也懵母總切蒙上聲心亂也僻匹亦切與辟同偏僻邪僻乖僻觸昌六切充入聲今讀楚者非譽羊居切音余凡美其人之善曰譽平聲獷古猛切音礦易以智切音異不難也平易也戾力濟切音例折食列切音舌續昨木切音俗繼連也註音釋啟運文註軌古委切音癸法則也譯夷益切音亦傳夷夏之言兜率上當侯切斗平聲下朔栗切音蟀慈悲註樂歷各切音洛𠎝去乾切音愆過也坌步悶切盆去聲巵音支从古從字字彙俱用劣力輟切音埒數生六切音朔後數數同鬬丁後切斗去聲輦力展切連上聲施式至切音試後凡施與者皆去聲備皮意切音避今讀蒲昧切音陪者不同嘿與默同秔古衡切音耕窟苦骨切坤入聲孔穴也竄取亂切音㸑邲薄密切音弼歸依註詮且緣切音川塑蘇故切音素莢古協切音劫渠求於切音劬慚愧註閒居晏切音諫厭離註骷髏上空胡切音枯下盧侯切音樓螃蠏上蒲光切音旁下呼買切音駭跎唐何切音駝呻升人切音身吟咏之聲療力弔切音料不淨觀註鼻皮意切音避讀入聲者非纖翳上思亷切音暹下於計切音意細微也怨親註揀郎殿切音練揣楚委切吹上聲觀罪註截昨吉切前入聲易以智切音異扞侯幹切音翰擎拳註倏式竹切音叔繳吉了切間皎更相註遞大計切音第傳遞也四住註曇徒含切音潭六根註澀色入切森入聲九結註中之仲切音眾六受等註䑛上紙切時上聲嚙五考切音咬覺華佛註嗣詳恣切音寺訖激質切音吉覆藏註文無悶切音問去聲飾也艸倉老切操上聲外肅註齊莊皆切音齋齊之為言齋也齋不齊以致齊也天眼註矚之六切音竹視之甚也差初加切音嗏錯也不關註首舒救切收去聲訶責註樂不上歷各切音洛下俯九切音否贅之瑞切追去聲殄徒典切田上聲羼初限切音彥栰房滑切音罰同筏
